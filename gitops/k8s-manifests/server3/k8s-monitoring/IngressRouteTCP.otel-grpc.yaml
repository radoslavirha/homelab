---
# Expose k8s-monitoring alloy-receiver gRPC (port 4317) via Traefik's otlp-grpc entrypoint.
# Used by k8s-monitoring instances on other clusters (server1/server2) to forward
# telemetry to the central server3 receiver over OTLP/gRPC.
# DNS (otel.server3.homelab.irha.cz) is already registered by the sibling HTTPRoute.
# HostSNI(*) is required for unencrypted TCP passthrough (no TLS).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: otel-grpc
  namespace: monitoring
  labels:
    app.kubernetes.io/name: k8s-monitoring
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  entryPoints:
    - otlp-grpc
  routes:
    - match: HostSNI(`*`)
      services:
        - name: k8s-monitoring-alloy-receiver
          port: 4317
