---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    # Wave -1: the Secret must exist before the server and worker pods start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
  data:
    # Store before first sync:
    #   bao kv put secret/server3/authentik secret-key=<...> bootstrap-password=<...> \
    #     bootstrap-token=<...> bootstrap-email=<...> postgres-password=<...>
    #
    # secret-key encrypts stored tokens. It is a FIRST-CLASS BACKUP ARTEFACT: a Postgres
    # restore without the identical key yields credentials that do not decrypt. Never rotate it.
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: server3/authentik
        property: secret-key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: server3/authentik
        property: postgres-password
    # The three bootstrap values are read on FIRST STARTUP ONLY and create the `akadmin`
    # user. Rotating them in OpenBao afterwards has no effect on a running install —
    # change the password through the UI or a blueprint instead.
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: server3/authentik
        property: bootstrap-password
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: server3/authentik
        property: bootstrap-token
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: server3/authentik
        property: bootstrap-email
