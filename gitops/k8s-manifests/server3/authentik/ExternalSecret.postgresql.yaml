---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
  namespace: authentik
  annotations:
    # Wave -1: the bundled PostgreSQL StatefulSet reads this at boot.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-postgresql
  data:
    # Same source value as AUTHENTIK_POSTGRESQL__PASSWORD in ExternalSecret.authentik.yaml,
    # under the two key names the Bitnami postgresql chart expects. Kept as a separate
    # Secret so the AUTHENTIK_* env bundle stays clean — it is mounted via global.envFrom
    # and every key there becomes a container env var.
    #   bao kv put secret/server3/authentik ... postgres-password=<...>
    - secretKey: password
      remoteRef:
        key: server3/authentik
        property: postgres-password
    - secretKey: postgres-password
      remoteRef:
        key: server3/authentik
        property: postgres-password
