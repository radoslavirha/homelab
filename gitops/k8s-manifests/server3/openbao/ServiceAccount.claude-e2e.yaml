# The identity coding agents log in to OpenBao with: role `claude-e2e` on the kubernetes-server3
# auth mount, declared in iac/clusters/server3/vault-config/main.tf.
#
# No Role, no RoleBinding, and no pod mounts it. Its token is useful ONLY as that login, which
# reads the Authentik E2E test user's credentials and nothing else. Agents mint one per run with
# the admin kubeconfig:
#   kubectl -n openbao create token claude-e2e --duration=10m
# Why this and not a stored OpenBao token: docs/identity.md § The E2E test user.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-e2e
  namespace: openbao
automountServiceAccountToken: false
