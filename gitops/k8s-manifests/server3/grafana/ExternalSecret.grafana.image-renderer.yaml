---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-image-renderer-token
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-image-renderer-token
  data:
    - secretKey: token
      remoteRef:
        # OpenBao KV path: secret/data/server3/grafana-image-renderer
        # Store with: bao kv put secret/server3/grafana-image-renderer token=<random>
        # Authenticates the Grafana pod to its own image-renderer pod only (both
        # restricted to each other by a NetworkPolicy) — value can be regenerated
        # freely any time, both pods just need to restart afterwards to pick it up.
        key: server3/grafana-image-renderer
        property: token
