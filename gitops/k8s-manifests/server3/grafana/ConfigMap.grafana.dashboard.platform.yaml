---
# Platform — Storage, Network & Telemetry (hand-built)
#
# Longhorn, Cilium/Hubble, Tempo and Loki in one cluster-scoped view. Hand-built
# rather than adopted from upstream, because every published dashboard for these
# five is either cluster-blind or written against a metric shape this stack does
# not produce — see docs/observability.md, "Dashboards".
#
# Every metric, label and label VALUE below was verified with an instant query
# against live Prometheus before the panel was written. Two of those checks
# changed the design:
#
#   longhorn_volume_state / longhorn_volume_robustness are 0/1 flags carried on a
#   `state` label, not the old numeric encoding (1=healthy, 2=degraded...).
#   grafana.com 16888 ORs both forms but spells the label `robustness`, which
#   does not exist here — so it reports every degraded volume as healthy.
#
#   Hubble counters carry verdict / type / protocol / subtype / reason but NOT
#   source_namespace / destination_namespace, so nothing here filters on those.
#
# The `cluster` variable is multi-select with All. Every query aggregates
# `by (cluster, ...)`, so All splits per cluster instead of silently summing
# three clusters into one line.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
    grafana_folder: "Platform"
data:
  platform.json: |
