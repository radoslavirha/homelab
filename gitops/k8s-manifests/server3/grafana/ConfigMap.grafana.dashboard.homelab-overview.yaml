---
# Homelab Overview — IoT Apps (hand-built)
#
# Front door for the four custom apps only (miot-bridge-api, interactive-map-feeder-api,
# qr-manager-api, qr-manager-ui) — not a whole-cluster health screen. That is already
# covered by Kubernetes/Global, Kubernetes/Namespaces, Platform — Storage, Network &
# Telemetry, and ArgoCD. This dashboard answers "are the apps themselves OK" in one screen.
#
# Duration comes from Traefik, not span metrics. 3.1's Applications — RED (Tempo span
# metrics) only covers miot-bridge-api and traefik itself — interactive-map-feeder-api,
# qr-manager-api and qr-manager-ui emit no spans at all (see grafana-dashboards-plan.md,
# "Findings that outlive the dashboards"). Traefik sees all four uniformly at the edge,
# so it is the only source that covers every app the same way. This is proxy-hop
# duration, not app-internal timing — expect it to run higher than an in-process
# histogram would for the same request.
#
# Two label families, verified live rather than assumed (rule 7c):
#   - Traefik metrics (OTLP-exported) carry k8s_cluster_name.
#   - kube-state-metrics metrics (pod readiness, restarts) carry cluster.
#   Both use the same values (server1/server2/server3), so one $cluster variable drives
#   both, but each query must filter on the label its own metric family actually has.
#
# Traefik's "service" label is the Gateway API's generated name, not the app name —
# e.g. "production-api-iot-miot-bridge-api-http-http-80@kubernetesgateway". Every
# per-app panel runs it through label_replace to recover a clean app name:
#   ^(production|sandbox)-[a-z]+-iot-(.+)-http-http-[0-9]+@kubernetesgateway$
# Pod names follow a different scheme again — "<stage>-iot-<app>-<rs-hash>-<pod-hash>"
# (e.g. "api-iot-miot-bridge-api-...", "apps-iot-qr-manager-ui-...") — so the pod-side
# label_replace is a separate regex:
#   ^.*-iot-(interactive-map-feeder-api|miot-bridge-api|qr-manager-api|qr-manager-ui)-[a-z0-9]+-[a-z0-9]+$
#
# kube_pod_status_ready{condition="false"} on its own is not "pod broken now" — verified
# live 2026-08-15: it also carries stale Completed pods from old ReplicaSets that were
# never garbage-collected (one is 100 days old), giving a permanent non-zero baseline
# that looks like an incident and isn't. Every readiness query here is intersected with
# `kube_pod_status_phase{phase="Running"} == 1` to exclude them — the `== 1` matters,
# because kube-state-metrics emits one series per phase value and a bare `and on(...)
# kube_pod_status_phase{phase="Running"}` matches the label set regardless of its value,
# same trap as the Longhorn `robustness` encoding in rule 7(e).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
    grafana_folder: "Homelab"
