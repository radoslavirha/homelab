---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-tempo
  namespace: monitoring
  labels:
    grafana_datasource: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
data:
  datasource-tempo.yaml: |-
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        isDefault: false
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            # filterByTraceID appends a LINE filter (|= "<traceID>"). Since logs moved to
            # Loki's native OTLP ingest the trace ID is structured metadata, not text in
            # the line, so that filter matches nothing. customQuery filters on the
            # structured-metadata field instead.
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            # Needs a stream selector; k8s_cluster_name is present on every OTLP-ingested
            # log. The ±1h span shift above bounds the scan.
            query: '{k8s_cluster_name=~".+"} | trace_id = "$${__span.traceId}"'
          tracesToMetrics:
            datasourceUid: prometheus
