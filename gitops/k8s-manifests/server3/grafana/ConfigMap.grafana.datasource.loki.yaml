---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
data:
  datasource-loki.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          derivedFields:
            # Loki's native OTLP ingest files trace_id as STRUCTURED METADATA, not text in
            # the log line, so the old `matcherRegex: "trace_id=(\\w+)"` scan of the line
            # finds nothing. matcherType: label reads structured metadata directly
            # (Grafana 10.4+; this instance is 13.0.1).
            - datasourceUid: tempo
              matcherType: label
              matcherRegex: trace_id
              name: TraceID
              url: "$${__value.raw}"
