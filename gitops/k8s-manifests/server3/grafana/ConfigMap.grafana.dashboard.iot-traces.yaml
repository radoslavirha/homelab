---
# IoT — Traces & Logs (hand-built)
#
# A trace *explorer* for the IoT apps, not an APM overview — "Applications — RED" (uid
# apps-red) already owns rate/error/duration. This one answers "find the trace, then show me
# everything that happened in it": search -> pick -> trace view -> the logs that trace emitted.
#
# Everything below was verified against live Tempo 2.10.1 / Loki / Prometheus on 2026-08-16
# before it was written, per rule 7 of docs/grafana-dashboards-plan.md.
#
# WHAT IS ACTUALLY IN TEMPO (measured, not assumed)
#
#   resource.service.name        traefik, miot-bridge-api, interactive-map-feeder-api
#   resource.k8s.cluster.name    server1 (both apps), server3 (traefik)
#   span names, miot-bridge-api  process iot/miot-bridge/device/{deviceId}/command
#                                publish iot/miot-bridge/device/{deviceId}/{response,notifications}
#                                findOne|find <db>.<collection>
#                                -- MQTT and mongo only. NO HTTP server spans, ever, in the
#                                whole retention window.
#   span names, feeder           GET /v1/data-sources/:dataSource/image  (SPAN_KIND_SERVER)
#                                request handler - /v1/data-sources/:dataSource/image
#                                middleware - {jsonParser,compression,cookieParser,cors,...}
#                                GET  (SPAN_KIND_CLIENT, outbound)
#                                -- full Express auto-instrumentation, unlike miot-bridge-api.
#   span names, traefik          GET, POST, PUT  -- method only. Traefik sets no http.route
#                                (it has no route templates), so semconv falls back to the
#                                method alone. "GET /endpoint" style names do not exist for
#                                traefik; they DO exist one level down, on the app's own span.
#
# TRACES CAN BE ROOTED IN TRAEFIK, WHICH BROKE THE FIRST VERSION OF THIS DASHBOARD
#
#   The original table selector was `{ nestedSetParent = -1 && resource.service.name =~ "$app" }`
#   -- root-only AND from a selected app. Those two are MUTUALLY EXCLUSIVE for anything entering
#   through the gateway, because the root span belongs to traefik and traefik is excluded from
#   the $app list by design. A live GET to the feeder produced trace
#   e936ffa3b635edc6af3a2f7c038f5988: rootServiceName traefik, rootTraceName "GET", 3814ms, with
#   the feeder's server span and its whole middleware chain nested underneath. It was in Tempo
#   and invisible in the table. Zero rows, no error, nothing to indicate a filter had eaten it.
#
#   Fixed by dropping nestedSetParent entirely and filtering on the `rootName` INTRINSIC, which
#   describes the trace's root while letting any span be the one that matches:
#
#     { <cluster> && <service> && (rootName =~ ".*$filter.*" || name =~ ".*$filter.*") } ...
#
#   Both halves of that OR are needed here. Filtering rootName alone for "image" returns nothing
#   on a traefik-fronted trace, because the root is called "GET"; the readable name lives on the
#   app span one level down. The Service and Name columns still show the ROOT (Tempo returns
#   rootServiceName/rootTraceName per trace regardless of what matched), so a gateway-fronted
#   trace correctly reads "traefik / GET" and expands to the app spans.
#
# MONGO SPANS REALLY ARE ROOTS -- VERIFIED, NOT A DISPLAY ARTEFACT
#
#   `find <db>.model-property-overrides` appearing as a trace root is not a dropped parent. Span
#   34860b350eeb439b in trace 09fc9667f79027e1477edb72fc0aa699 has parentSpanID = "" (empty),
#   kind client, instrumentation @opentelemetry/instrumentation-mongoose 0.67.0. There is no
#   parent to lose: whatever schedules that query runs on a timer with no enclosing span, so
#   mongoose's auto-instrumentation starts a fresh trace each time. An app-side fix (wrap the
#   scheduled work in a span) is the only thing that would give those a meaningful root.
#
# TRACE -> LOG CORRELATION IS AN APP-SIDE GAP, NOT A PANEL BUG
#
#   Measured 2026-08-17 over 24h for service_name="miot-bridge-api":
#
#     level   lines   with trace_id
#     warn      867        0
#     info      168        0
#     error      32        2
#
#   Two lines out of 1067. Both come from the same catch block (scope MQTT_LISTENER); every
#   other line, including 867 identical `Sending command failed / Command timeout: no response
#   from 192.168.1.85:54321` warnings for device 1141132187 on a ~90s timer, carries none.
#   A successful MQTT command logs nothing whatsoever.
#
#   So "I clicked an MQTT trace and got no logs" is the expected outcome for almost every trace.
#   The query is right — verified returning the line for 229569b1a74583c3d122e8a97a1f0a18, and
#   returning nothing for 59ff35aa31e7141196a211fdfe2abcb2, which is a 2.3ms successful
#   producer-only trace that emitted no log at all.
#
#   The fix is NOT a logging change. @opentelemetry/instrumentation-winston already patches
#   Logger.prototype.write and stamps trace_id/span_id from the active context on every record —
#   the two lines that have it are ordinary logger.error calls that merely happen to sit inside
#   MqttTracingService.consume()'s context.with(). The missing piece is SPANS: the poller, device
#   registry and UDP transport create none, so there is no active context to stamp. Wrapping the
#   scheduled work in a span fixes the logs as a side effect. App-side either way.
#
#   Also note the transport: OTLP log export is OFF (otel.logs.enabled: false in every app
#   config). trace_id reaches Loki as structured metadata because Alloy's podLogsViaLoki
#   extraLogProcessingStages lift it out of the Winston JSON — see gitops/helm-values/
#   k8s-monitoring.yaml. The datasource comments in this directory still credit "Loki's native
#   OTLP ingest", which is wrong about the mechanism though right about the outcome.
#
# WHY THE APP VARIABLE HAS NO allValue
#
#   The obvious `allValue: ".+"` is wrong on this dashboard: traefik is a traced service, so
#   ".+" silently pulls every server3 ingress trace into a board titled "IoT". Leaving allValue
#   unset makes Grafana expand All to the variable's real option list, and that list is built by
#   a query that excludes traefik -- so All and an explicit multi-select agree. Cost: the list
#   comes from span metrics, which only carry services seen inside the dashboard time range. An
#   app silent for the whole range drops out of the picker and its traces are hidden. Widen the
#   time range when hunting a dead app.
#
# WHY ${x:pipe} AND NOT "$x"
#
#   Grafana only auto-formats multi-value variables for datasources it recognises as regex-based
#   (Prometheus, Loki). Tempo is not one of them: a bare "$server" with two clusters selected
#   interpolates to the glob form {server1,server3}, which TraceQL then reads as a regex
#   repetition and does not match what you meant. :pipe forces server1|server3. The Prometheus
#   and Loki panels below keep the bare "$var" form, which is correct there.
#
# THREE VARIABLES ARE QUERY FRAGMENTS, NOT VALUES
#
#   TraceQL has no conditional syntax, so an "off" filter has to be a valid no-op. The assembled
#   query is:
#
#     { <cluster> && <service> && (rootName =~ <name> || name =~ <name>) } $kind $status $traceql
#
#   All three append a whole spanset, and each one's no-op is the literal `&& {}` -- a spanset
#   matching all spans, verified to return the same traces as omitting it. An empty
#   custom-variable value would read better but Grafana's `label : value` parser does not
#   reliably keep one. $traceql is a textbox and CAN default to "", since a trailing empty
#   string is already a valid query.
#
#   $kind therefore means "the trace CONTAINS a span of this kind", not "the root is this kind".
#   That is deliberate and it is the more useful question — MQTT selects traces with a
#   consumer/producer span, HTTP selects traces with a server span — and it still suppresses the
#   mongo-poller traces, which contain nothing but a single client span. There is no `rootKind`
#   intrinsic to do the other thing with, and `kind =~ "..."` is not an option either: kind is an
#   enum, and Tempo rejects the query outright with
#     invalid TraceQL query: binary operations must operate on the same type: kind =~ `...`
#
#   Consequence for anyone editing these: no label or value in $kind/$status may contain a comma
#   or a colon — Grafana splits custom-variable options on both.
#
# THE POLLER NOISE
#
#   Tempo returns one entry per trace, and Grafana's nested frame provides the expand arrow that
#   reveals the matched spans with the select()ed attributes as columns — so the table is
#   trace-level without needing a root-only selector.
#
#   At idle the list is ~all mongo. miot-bridge-api polls `find <db>.notifications` and
#   `findOne <db>.devices` on a timer, outside any span context, so those DB spans ARE trace
#   roots — measured at 0.177 traces/s each, against 0.002/s for real MQTT commands, i.e. two
#   orders of magnitude of noise. That is honest data, not a dashboard bug, which is why the
#   default stays "Any". Switch Contains kind to MQTT or HTTP to drop them.
#
#   The rate charts are deliberately NOT wired to $kind. Span metrics label the same concept
#   span_kind="SPAN_KIND_CONSUMER" while TraceQL spells it `kind = consumer`, and one variable
#   cannot carry both spellings. The charts exist to locate a time window, where the extra
#   series are labelled and harmless; the table exists to pick a trace, where they are not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-iot-traces
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
    grafana_folder: "Applications"
data:
  iot-traces.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "tags": ["applications"],
          "targetBlank": false,
          "title": "Applications",
          "type": "dashboards"
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "Find the window",
          "id": 1,
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Trace rate by operation",
          "id": 2,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Span metrics from Tempo's generator, so it covers the full Prometheus retention rather than Tempo's 14 days. Honours the Name filter. Use it to find WHEN, then zoom the time range and read the table below.",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "refId": "A",
              "editorMode": "code",
              "range": true,
              "expr": "sum by (span_name) (rate(traces_spanmetrics_calls_total{k8s_cluster_name=~\"$server\", service=~\"$app\", span_name=~\".*$filter.*\"}[$__rate_interval]))",
              "legendFormat": "{{span_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "timeseries",
          "title": "Errors by operation",
          "id": 3,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "status_code is STATUS_CODE_ERROR or STATUS_CODE_UNSET. There is no STATUS_CODE_OK — OTel only sets ERROR explicitly, so UNSET means success. Empty here means nothing failed.",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "refId": "A",
              "editorMode": "code",
              "range": true,
              "expr": "sum by (span_name) (rate(traces_spanmetrics_calls_total{k8s_cluster_name=~\"$server\", service=~\"$app\", span_name=~\".*$filter.*\", status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval]))",
              "legendFormat": "{{span_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "color": { "mode": "fixed", "fixedColor": "red" },
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["sum"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "type": "row",
          "title": "Traces",
          "id": 4,
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "panels": []
        },
        {
          "type": "table",
          "title": "Traces",
          "id": 5,
          "datasource": { "type": "tempo", "uid": "tempo" },
          "description": "One row per trace (root span only); the arrow expands to the matched spans with the selected attributes as columns. Click the NAME cell to load that trace into the panels below — it sets the traceId variable. Clicking the Trace ID cell instead opens the trace in Explore.\n\nThe select() list carries the attributes worth scanning without opening anything: miot device/command/operation, the MQTT topic, and HTTP method/path/status. Attributes a span does not have render empty.\n\nService and Name are the ROOT of the trace, so anything entering through the gateway reads \"traefik / GET\" — traefik names HTTP spans by method only. Expand the row for the app's own span, which carries the readable route.\n\nThe Name filter matches the root name OR any span name, so typing part of a route finds gateway-fronted traces too.\n\nAt idle this is dominated by miot-bridge-api's mongo polling, which genuinely starts its own traces (parentSpanID is empty — verified, not a dropped parent). Set Contains kind to MQTT or HTTP to drop them.",
          "gridPos": { "h": 13, "w": 24, "x": 0, "y": 9 },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "refId": "A",
              "queryType": "traceql",
              "limit": 100,
              "tableType": "traces",
              "query": "{ resource.k8s.cluster.name =~ \"${server:pipe}\" && resource.service.name =~ \"${app:pipe}\" && (rootName =~ \".*$filter.*\" || name =~ \".*$filter.*\") } $kind $status $traceql | select(span.miot.device.id, span.miot.command, span.miot.operation, span.messaging.destination.name, span.http.request.method, span.url.path, span.http.response.status_code)"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": [{ "displayName": "Start time", "desc": true }]
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "filterable": false } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "traceName" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Load this trace below",
                        "targetBlank": false,
                        "url": "/d/iot-traces/iot-traces?${server:queryparam}&${app:queryparam}&${kind:queryparam}&${filter:queryparam}&${status:queryparam}&${traceql:queryparam}&${__url_time_range}&var-traceId=${__data.fields.traceID}"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Name" },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Load this trace below",
                        "targetBlank": false,
                        "url": "/d/iot-traces/iot-traces?${server:queryparam}&${app:queryparam}&${kind:queryparam}&${filter:queryparam}&${status:queryparam}&${traceql:queryparam}&${__url_time_range}&var-traceId=${__data.fields.traceID}"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Duration" },
                "properties": [
                  { "id": "custom.width", "value": 110 },
                  {
                    "id": "custom.cellOptions",
                    "value": { "type": "color-text" }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "text", "value": null },
                        { "color": "orange", "value": 1000 },
                        { "color": "red", "value": 5000 }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Start time" },
                "properties": [{ "id": "custom.width", "value": 180 }]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Selected trace",
          "id": 6,
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "panels": []
        },
        {
          "type": "traces",
          "title": "Trace $traceId",
          "id": 7,
          "datasource": { "type": "tempo", "uid": "tempo" },
          "description": "Empty until traceId is set — click a trace Name above, or paste an ID into the Trace ID box. The Tempo datasource is wired to Loki and Prometheus, so each span also offers a 'Logs for this span' and a related-metrics link.",
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 23 },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "refId": "A",
              "queryType": "traceql",
              "query": "$traceId"
            }
          ],
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {}
        },
        {
          "type": "logs",
          "title": "Logs emitted by this trace",
          "id": 8,
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "trace_id is STRUCTURED METADATA here, not text in the line — but NOT because of OTLP log export, which is off (otel.logs.enabled: false in every app config). The apps log Winston JSON to stdout, Alloy scrapes it via podLogsViaLoki, and the extraLogProcessingStages in gitops/helm-values/k8s-monitoring.yaml lift trace_id/span_id/level out of the JSON into structured metadata. A line filter (|= \"<id>\") would match nothing; this uses the metadata filter, the same query the Tempo datasource's tracesToLogsV2 uses. No app/cluster filter on purpose, so a trace crossing services still shows every line.\n\nEXPECT THIS TO BE EMPTY for most traces, and blame the app, not the panel. Measured over 24h on miot-bridge-api: 1067 log lines, of which 2 carry a trace_id — both from one catch block in MQTT_LISTENER. 867 warn and 168 info lines have none. Successful commands log nothing at all. The injection itself is automatic — WinstonInstrumentation stamps trace_id on every record from the active context — so the missing piece is not logging but SPANS: the poller, device registry and UDP paths create none, so there is no active context to stamp. Until those get a span, this panel only lights up on that one error path.",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 39 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "refId": "A",
              "queryType": "range",
              "editorMode": "code",
              "expr": "{k8s_cluster_name=~\".+\"} | trace_id = \"$traceId\""
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Ascending"
          }
        }
      ],
      "preload": false,
      "refresh": "",
      "schemaVersion": 42,
      "tags": ["applications", "iot", "traces", "logs", "otel"],
      "templating": {
        "list": [
          {
            "type": "query",
            "name": "server",
            "label": "Server",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(traces_spanmetrics_calls_total{service!=\"traefik\"}, k8s_cluster_name)",
            "query": {
              "query": "label_values(traces_spanmetrics_calls_total{service!=\"traefik\"}, k8s_cluster_name)",
              "refId": "StandardVariableQuery"
            },
            "current": {},
            "options": [],
            "multi": true,
            "includeAll": true,
            "refresh": 2,
            "sort": 1,
            "hide": 0,
            "regex": ""
          },
          {
            "type": "query",
            "name": "app",
            "label": "App",
            "description": "Traced services excluding traefik. No allValue is set on purpose — All expands to this list, so it can never widen to the gateway.",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(traces_spanmetrics_calls_total{k8s_cluster_name=~\"$server\", service!=\"traefik\"}, service)",
            "query": {
              "query": "label_values(traces_spanmetrics_calls_total{k8s_cluster_name=~\"$server\", service!=\"traefik\"}, service)",
              "refId": "StandardVariableQuery"
            },
            "current": {},
            "options": [],
            "multi": true,
            "includeAll": true,
            "refresh": 2,
            "sort": 1,
            "hide": 0,
            "regex": ""
          },
          {
            "type": "custom",
            "name": "kind",
            "label": "Contains kind",
            "description": "Requires the trace to contain a span of this kind — not that its ROOT be that kind (there is no rootKind intrinsic). MQTT drops the mongo-polling traces, which hold a single client span and nothing else. HTTP finds anything that came in over the gateway.",
            "query": "Any : && {},MQTT : && {kind = consumer || kind = producer},HTTP : && {kind = server},Outbound / DB : && {kind = client}",
            "current": { "text": "Any", "value": "&& {}" },
            "options": [],
            "multi": false,
            "includeAll": false,
            "hide": 0
          },
          {
            "type": "textbox",
            "name": "filter",
            "label": "Name filter",
            "description": "Regex on the ROOT span name, substring-matched. Examples: process  |  publish|process  |  ^GET",
            "query": "",
            "current": { "text": "", "value": "" },
            "options": [],
            "hide": 0
          },
          {
            "type": "custom",
            "name": "status",
            "label": "Status",
            "description": "Appends a spanset to the trace query. 'Any' is the no-op spanset {}. The HTTP options only ever match traefik spans today — the IoT apps emit no HTTP server spans.",
            "query": "Any : && {},Errors only : && {status = error},HTTP 4xx : && {span.http.response.status_code >= 400 && span.http.response.status_code < 500},HTTP 5xx : && {span.http.response.status_code >= 500}",
            "current": { "text": "Any", "value": "&& {}" },
            "options": [],
            "multi": false,
            "includeAll": false,
            "hide": 0
          },
          {
            "type": "textbox",
            "name": "traceql",
            "label": "Extra TraceQL",
            "description": "Raw spanset appended to the trace query — must start with &&. Examples: && {span.miot.device.id = 1141132187}  |  && {kind = consumer}  |  && {duration > 1s}",
            "query": "",
            "current": { "text": "", "value": "" },
            "options": [],
            "hide": 0
          },
          {
            "type": "textbox",
            "name": "traceId",
            "label": "Trace ID",
            "description": "Set by clicking a trace Name in the table, or paste one here.",
            "query": "",
            "current": { "text": "", "value": "" },
            "options": [],
            "hide": 0
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "IoT — Traces & Logs",
      "uid": "iot-traces",
      "version": 1
    }
