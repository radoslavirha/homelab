---
# Applications — RED (hand-built)
#
# Rate, errors and duration per service and per operation, from Tempo's span-metrics
# generator. grafana.com 19419 ("OpenTelemetry APM") was rejected: it queries
# traces_span_metrics_duration_milliseconds_*, the OTel Collector spanmetrics CONNECTOR
# naming, while this stack derives span metrics in Tempo's metrics generator, which emits
# traces_spanmetrics_*. Both are current; the vocabularies differ. It also carries 25
# ${DS_PROMETHEUS} placeholders and two variables (service_name, http_route) whose labels
# do not exist here.
#
# Four things verified against live Prometheus before any panel was written, each of
# which would have produced a confidently wrong panel:
#
#   span_kind — SPAN_KIND_INTERNAL is Express middleware and accounts for 21 of 39
#   series on its own; SPAN_KIND_CLIENT is outbound. Every RED panel filters to
#   SPAN_KIND_SERVER, or "requests" is inflated several-fold.
#
#   status_code — the values are STATUS_CODE_ERROR and STATUS_CODE_UNSET. There is no
#   STATUS_CODE_OK; OTel only sets ERROR explicitly.
#
#   units — traces_spanmetrics_latency_* is in SECONDS, not the milliseconds published
#   OTel dashboards assume.
#
#   buckets — base-2 seconds, 0.002 … 16.384. The conventional Apdex thresholds of
#   0.3 / 1.2 are not bucket boundaries here and would silently return nothing, so the
#   Apdex panel uses 0.256 / 1.024.
#
# Probe traffic is absent by construction: /health and /healthz are dropped at the SDK
# (packages/otel ignoredPaths.ts) and by nginx access_log off, so these numbers are real
# traffic without any dashboard-side filtering.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-applications-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
    grafana_folder: "Applications"
data:
  applications-red.json: |
    {
      "annotations": {
        "list": []
