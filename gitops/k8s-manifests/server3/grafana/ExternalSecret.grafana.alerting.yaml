---
# The credential for Grafana's alert contact point.
#
# Kept out of the contact point ConfigMap on purpose: a provisioned contact point
# is a plain file in git, so the URL is read with $__file{} at provisioning time —
# the same indirection the InfluxDB2 datasource token already uses here.
#
# The key is named generically (`webhook-url`, not `slack-url`): the channel is a
# Slack incoming webhook today, and swapping it for an ntfy topic later is a value
# change in OpenBao plus a receiver `type:` change in
# ConfigMap.grafana.alerting.notifications.yaml — this file does not move.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-alerting
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-alerting
  data:
    - secretKey: webhook-url
      remoteRef:
        # OpenBao KV path: secret/data/server3/grafana
        # Store with: bao kv patch secret/server3/grafana alert-webhook-url=<url>
        # patch, NOT put: this path also holds admin-user and admin-password.
        key: server3/grafana
        property: alert-webhook-url
