---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: server1-influxdb2-grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: server1-influxdb2-grafana
  data:
    - secretKey: token
      remoteRef:
        # Written by the InfluxDB2 PostSync provisioner Job running ON THAT CLUSTER, into
        # that cluster's own OpenBao tree. Each provisioner token is scoped to
        # secret/data/<its own cluster>/*, so a Job cannot write anywhere else — this path
        # is the only one it is allowed to use. server3's ESO reads secret/data/* and so
        # can consume it from here. See docs/secrets.md.
        key: server1/influxdb2-grafana
        property: token
