---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
  annotations:
    external-dns.alpha.kubernetes.io/target: "192.168.1.202"
    argocd.argoproj.io/sync-wave: "100"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    # grafana is apex tier (the exposure spec's Public list), so the name is grafana.irha.cz
    # and NOT grafana.server3.homelab.irha.cz — the certificate carries both, but this is the
    # one hostname the service gets. Publishing it later becomes a routing change, never a
    # rename.
    - grafana.irha.cz
  rules:
    - backendRefs:
        - name: grafana
          namespace: monitoring
          port: 80
