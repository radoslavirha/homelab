---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
  annotations:
    external-dns.alpha.kubernetes.io/target: "192.168.1.202"
    argocd.argoproj.io/sync-wave: "100"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    # Both names, deliberately, for the whole migration. hostnames is a list, so a route can
    # answer to the old and new name at once: nothing that points at .home breaks, and the
    # irha.cz name can be tested before anything depends on it. The .home entries come out
    # at stage 7.
    #
    # grafana is apex tier (exposure spec's Public list), so the new name is grafana.irha.cz
    # and NOT grafana.server3.homelab.irha.cz — the certificate carries both, but this is the
    # one hostname the service gets. Publishing it later becomes a routing change, never a
    # rename.
    - grafana.server3.home
    - grafana.irha.cz
  rules:
    - backendRefs:
        - name: grafana
          namespace: monitoring
          port: 80
