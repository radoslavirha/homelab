---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-dashboard
  namespace: kube-system
  labels:
    app.kubernetes.io/name: hubble-dashboard
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: cilium
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    # Both names for the migration. hostnames is a list, so the route answers to the
    # old and the new name at once and nothing pointing at .home breaks while the
    # irha.cz name is proven. The .home entry comes out at stage 7.
    - hubble.server3.home
    - hubble.server3.homelab.irha.cz
  rules:
    - backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
