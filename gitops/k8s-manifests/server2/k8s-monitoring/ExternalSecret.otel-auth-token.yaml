---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-auth-token
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: otel-auth-token
  data:
    - secretKey: OTEL_AUTH_TOKEN
      remoteRef:
        # CURRENTLY UNUSED. The OTLP destination has no auth block: gRPC refuses to
        # attach bearer credentials to a plaintext channel, so tls.insecure: true and
        # auth.type: bearerToken cannot coexist. Kept so the credential is ready if
        # TLS is terminated on otel.server3.home later — see docs/observability.md.
        # Store before first sync: bao kv put secret/otel-gateway/auth-token token=$(openssl rand -base64 32 | tr -d '=+/')
        key: otel-gateway/auth-token
        property: token
