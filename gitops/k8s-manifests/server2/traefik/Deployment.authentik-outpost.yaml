---
# Authentik proxy outpost for server2: what Traefik's forwardAuth asks about every request
# to a guarded UI on this cluster (today longhorn.server2). It serves the `kind: proxy`
# providers assigned to the outpost `homelab-proxy-server2` in
# gitops/helm-values/server3/authentik-blueprints.yaml, and fetches that list from Authentik
# itself -- adding a guarded UI changes nothing here.
#
# Hand-written, the only Deployment in gitops/k8s-manifests. Authentik can deploy its own
# outposts through a Kubernetes service connection, but that hands server3's Authentik a
# kubeconfig with write access to this cluster and creates objects that are not in git. One
# small Deployment is cheaper.
#
# THE TAG MOVES WITH AUTHENTIK. Keep it equal to targetRevision in
# gitops/argocd-manifests/server3/apps/identity/Authentik.yaml: the outpost speaks
# Authentik's API and websocket protocol, and Authentik flags an outpost on another version.
#
# Security context mirrors the Deployment Authentik's own controller renders
# (outposts/controllers/k8s/deployment.py, 2026.8.1): non-root, no privilege escalation,
# all capabilities dropped, RuntimeDefault seccomp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-outpost
  namespace: traefik
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/component: forward-auth
    app.kubernetes.io/part-of: authentik
  annotations:
    # The token Secret changes only when the outpost object is recreated. Restart onto it.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-outpost
        app.kubernetes.io/component: forward-auth
        app.kubernetes.io/part-of: authentik
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/goauthentik/proxy:2026.8.1
          env:
            # API + websocket to Authentik: auth.irha.cz over the LAN to server3's Traefik,
            # the same path ESO takes to OpenBao.
            - name: AUTHENTIK_HOST
              value: https://auth.irha.cz
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-outpost
                  key: AUTHENTIK_TOKEN
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: http-metrics
              containerPort: 9300
              protocol: TCP
          # The image's own Docker HEALTHCHECK. Readiness only, no liveness: an outpost that
          # cannot reach server3 should drop out of the Service (every guarded UI then fails
          # closed) rather than be restarted in a loop.
          readinessProbe:
            exec:
              command: ["/authentik", "healthcheck", "proxy"]
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
