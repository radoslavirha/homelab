---
# The API token the Authentik proxy outpost (Deployment.authentik-outpost.yaml) connects with.
#
# Authentik GENERATES it. The blueprint declares the outpost `homelab-proxy-server2` for the
# `kind: proxy` entries on this cluster (gitops/helm-values/server3/authentik-blueprints.yaml),
# and Authentik mints the token `ak-outpost-<uuid>-api` when it creates that object. It cannot
# exist before the blueprint has landed, so it is copied by hand, once:
#
#   Authentik UI -> Applications -> Outposts -> homelab-proxy-server2 -> View Deployment Info
#   read -rs T && bao kv put secret/server2/authentik-outpost token="$T"; unset T
#
# Deleting the outpost in the UI and letting the blueprint recreate it mints a NEW token under
# a new uuid: repeat the copy, or the outpost stays disconnected and every guarded UI answers
# with an error.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-outpost
  namespace: traefik
  annotations:
    # Before the Deployment that reads it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-outpost
  data:
    - secretKey: AUTHENTIK_TOKEN
      remoteRef:
        key: server2/authentik-outpost
        property: token
