---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: emqx
  namespace: iot
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: iot
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    # Both names for the migration. hostnames is a list, so the route answers to the
    # old and the new name at once and nothing pointing at .home breaks while the
    # irha.cz name is proven. The .home entry comes out at stage 7.
    - mqtt.server2.home
    - mqtt.server2.homelab.irha.cz
  rules:
    - backendRefs:
        - name: emqx
          namespace: iot
          port: 18083
