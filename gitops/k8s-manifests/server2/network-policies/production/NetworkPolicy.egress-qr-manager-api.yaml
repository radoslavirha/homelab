# qr-manager-api in-cluster egress: MongoDB and OTLP. Both observed in Stage 1.
# qr-manager-ui has no egress at all and deliberately gets no policy of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-qr-manager-api
  namespace: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qr-manager-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mongodb
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb
      ports:
        - protocol: TCP
          port: 27017
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-receiver
      ports:
        - protocol: TCP
          port: 4318
