---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    # Both names for the whole migration — hostnames is a list, so nothing that points
    # at .home breaks while the new name is proven. The .home entry comes out at stage 7.
    - longhorn.server1.home
    - longhorn.server1.homelab.irha.cz
  rules:
    - backendRefs:
        - name: longhorn-frontend
          namespace: longhorn-system
          port: 80
