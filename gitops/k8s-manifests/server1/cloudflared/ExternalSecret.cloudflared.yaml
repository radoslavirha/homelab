---
# The tunnel credential: AccountTag + TunnelID + TunnelSecret, as written by
# `cloudflared tunnel create`. It alone authorises a tunnel into this network, so it
# never appears in git -- OpenBao -> ESO -> Secret -> mounted file, like every other
# credential here.
#
# Stored with (note `put`, not `patch`: this path was new):
#   bao kv put secret/server1/cloudflared credentials.json=@~/.cloudflared/<uuid>.json
# Every LATER write to this path uses `bao kv patch`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflared
  data:
    - secretKey: credentials.json
      remoteRef:
        # OpenBao KV path: secret/data/server1/cloudflared
        key: server1/cloudflared
        property: credentials.json
