---
# Open WebUI's Authentik client secret -- a SEPARATE ExternalSecret from the one
# beside it, and that separation is the whole point of this file.
#
# ESO has no per-key "optional": if one `data` entry's remote property is
# missing, the WHOLE ExternalSecret fails and its target Secret stops being
# refreshed. Put this key in the open-webui ExternalSecret and the window between
# "provider created" and "secret pasted into OpenBao" takes postgres-password and
# webui-secret-key down with it -- which is to say, the database and the app.
# Split, the failure is contained: Open WebUI keeps running on its local login
# form and only OIDC waits.
#
# ── The one manual step, and why it exists ──────────────────────────────────
# The blueprint deliberately does not set `client_secret` (see the `confidential`
# block in gitops/helm-charts/authentik-blueprints/templates/configmap.yaml):
# Authentik generates one when it creates the provider, and a blueprint leaves a
# field it does not mention exactly as it found it, so the value survives every
# re-apply. Nothing can read it back out except a human or the API. So:
#
#   1. Land the matrix entry (gitops/helm-values/server3/authentik-blueprints.yaml)
#      and wait for the blueprint to apply -- discovery is a cron at :57, and only
#      on a CHANGED HASH. To force it, enqueue discovery (docs/identity.md), never
#      `ak apply_blueprint` by hand.
#   2. Authentik UI -> Applications -> Providers -> open-webui-server1-production
#      -> copy the Client Secret.
#   3. bao kv patch secret/server1/open-webui oauth-client-secret=<paste>
#      (`patch`, NOT `put` -- `put` replaces the whole path and would drop
#      postgres-password and webui-secret-key, taking the app down with it.)
#
# This ExternalSecret reports SecretSyncedError until step 3 lands. That is the
# expected state, not a fault.
#
# The Secret key is spelled OAUTH_CLIENT_SECRET because the Deployment pulls it in
# with `envFrom` (optional: true) rather than a secretKeyRef -- an env var that
# appears when the Secret does. Reloader restarts the pod when it changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: oidc
    app.kubernetes.io/part-of: open-webui
  annotations:
    # LAST WAVE, deliberately -- and this is the one thing about this file that is
    # not obvious. The spec for this app said wave 0 "exactly like mealie-oidc";
    # mealie-oidc is in fact at 200, and the comment in its own file records why.
    #
    # ArgoCD gates each sync wave on the HEALTH of the previous one, and an
    # ExternalSecret whose remote key is missing reports SecretSyncedError, which
    # is Degraded. At wave 0 next to its sibling (tried on Mealie, 2026-09-18) the
    # expected "waiting for a human to paste the secret" state stops the sync dead
    # at wave 0: PostgreSQL, the Deployment and the HTTPRoute never apply.
    #
    # Behind everything else (HTTPRoute is 100), a failing sync here costs only its
    # own resource: every other object is already applied. The app still reports
    # Degraded while the secret is missing, which is honest -- it IS incomplete.
    argocd.argoproj.io/sync-wave: "200"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: open-webui-oidc
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: server1/open-webui
        property: oauth-client-secret
