---
# What HTTPRoute.yaml sends assistant.irha.cz to.
#
# Port 8080 on both sides rather than the more usual 80 -> 8080: Open WebUI's
# Dockerfile EXPOSEs 8080 and its own HEALTHCHECK curls ${PORT:-8080}, and
# keeping one number end to end removes a place for that to go wrong. There is
# nothing else in this namespace competing for the name.
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
