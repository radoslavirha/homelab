---
# The two secrets Open WebUI's own deployment consumes.
#
#   postgres-password  shared by the server that sets it (StatefulSet.postgres.yaml,
#                      POSTGRES_PASSWORD) and the client that presents it
#                      (Deployment.yaml, which interpolates it into DATABASE_URL).
#                      One key, two readers -- rotating it means rotating both,
#                      which is why neither carries a literal.
#
#   webui-secret-key   WEBUI_SECRET_KEY. Open WebUI treats this as a HARD
#                      REQUIREMENT when auth is on: config.py raises at import
#                      time if WEBUI_AUTH is true and the key is empty. It signs
#                      session JWTs, and it is also the default for
#                      OAUTH_SESSION_TOKEN_ENCRYPTION_KEY and
#                      OAUTH_CLIENT_INFO_ENCRYPTION_KEY -- so rotating it does not
#                      merely log everyone out, it makes any stored OAuth session
#                      token undecryptable. Rotate it deliberately, not casually.
#
# ── The password MUST be URL-safe, and that is not a style preference ────────
# Open WebUI takes one DATABASE_URL, not a host/user/password triple like Mealie.
# Deployment.yaml therefore builds the URL with Kubernetes' `$(VAR)` expansion,
# and a password containing @ : / ? # or % lands in the userinfo field of a URL
# and is parsed as structure rather than as a password. The failure is a connect
# error naming a host you never configured.
#
# Generate both values as hex, which has no such characters:
#
#   bao kv put secret/server1/open-webui \
#     postgres-password="$(openssl rand -hex 32)" \
#     webui-secret-key="$(openssl rand -hex 32)"
#
# The OIDC client secret is deliberately NOT here -- see ExternalSecret.oidc.yaml
# for why it is a separate object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: open-webui
  annotations:
    # Wave 0: ArgoCD waits for Ready=True (Secret populated by ESO) before
    # advancing to wave 1, where PostgreSQL starts and needs POSTGRES_PASSWORD to
    # exist. An empty OpenBao path fails HERE, visibly, rather than crashlooping
    # a database pod two waves later.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: open-webui
  data:
    - secretKey: postgres-password
      remoteRef:
        # Rotating this is NOT just a re-seed: postgres reads POSTGRES_PASSWORD
        # only when it initialises an EMPTY data directory, so a changed value
        # leaves the server on the old password and only Open WebUI moves. Change
        # it with `ALTER ROLE openwebui PASSWORD ...` in the running database too.
        key: server1/open-webui
        property: postgres-password
    - secretKey: webui-secret-key
      remoteRef:
        key: server1/open-webui
        property: webui-secret-key
