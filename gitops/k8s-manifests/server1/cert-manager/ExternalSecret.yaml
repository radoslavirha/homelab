---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    # Opt this one resource out of the Application's ServerSideApply.
    #
    # The Application needs ServerSideApply because three cert-manager CRDs exceed the
    # 262144-byte ceiling on the last-applied-configuration annotation that client-side
    # apply depends on: challenges 269KB, clusterissuers 326KB, issuers 326KB.
    #
    # But under SSA, ArgoCD builds its predicted live state by merging only the fields it
    # manages. `spec.data` is an atomic list with no merge key, so the whole list is
    # replaced in the prediction and the CRD's own defaults inside remoteRef —
    # conversionStrategy, decodingStrategy, metadataPolicy, nullBytePolicy — are dropped.
    # The live object has them, the prediction does not, and the resource reports
    # OutOfSync forever while being perfectly correct. (target.creationPolicy and
    # deletionPolicy are unaffected: they are plain fields, not list-nested.)
    #
    # Client-side apply for this object sidesteps it, and matches how every other
    # ExternalSecret in this repo is applied.
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        # OpenBao KV path: secret/data/server1/cert-manager (server1-specific).
        # One Cloudflare token per cluster — revocable and attributable independently.
        # Scope: Zone:DNS:Edit + Zone:Zone:Read on irha.cz only.
        # Store before first sync: bao kv put secret/server1/cert-manager api-token=<value>
        # Full walkthrough: docs/secrets.md -> <cluster>/cert-manager
        key: server1/cert-manager
        property: api-token
