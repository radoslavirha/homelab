---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef:
        # OpenBao KV path: secret/data/server1/cert-manager (server1-specific).
        # One Cloudflare token per cluster — revocable and attributable independently.
        # Scope: Zone:DNS:Edit + Zone:Zone:Read on irha.cz only.
        # Store before first sync: bao kv put secret/server1/cert-manager api-token=<value>
        # Full walkthrough: docs/secrets.md -> <cluster>/cert-manager
        key: server1/cert-manager
        property: api-token
