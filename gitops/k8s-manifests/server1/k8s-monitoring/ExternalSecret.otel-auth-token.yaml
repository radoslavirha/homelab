---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otel-auth-token
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-50"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: otel-auth-token
  data:
    - secretKey: OTEL_AUTH_TOKEN
      remoteRef:
        # Injected into every Alloy collector as env OTEL_AUTH_TOKEN (collectorCommon.alloy.envFrom)
        # and sent as the Bearer header on outbound OTLP to otel.server3.home.
        # Note: server3's alloy-receiver does not validate it — see docs/observability.md.
        # Store before first sync: bao kv put secret/otel-gateway/auth-token token=$(openssl rand -base64 32 | tr -d '=+/')
        key: otel-gateway/auth-token
        property: token
