# mcp.irha.cz/.well-known/oauth-protected-resource/kb/* -> the MCP server's Protected Resource
# Metadata (RFC 9728). The one route the chart cannot express: it is outside the app's /kb
# prefix (see Middleware.oauth-metadata.yaml for why). The chart's own route serves /kb.
#
# Public by nature: an MCP client reads it BEFORE it has a token, to find where to log in.
# It names the resource, the authorization server (auth.irha.cz) and the scopes — nothing
# that is not already in the 401 every unauthenticated call gets.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: knowledge-base-oauth-metadata
  namespace: production
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - mcp.irha.cz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/kb
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: knowledge-base-middleware-oauth-metadata
      backendRefs:
        - name: mcp-knowledge-base-knowledge-base-http
          namespace: production
          port: 80
