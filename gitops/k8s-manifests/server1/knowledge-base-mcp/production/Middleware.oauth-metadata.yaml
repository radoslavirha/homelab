# Drops the /kb segment from the Protected Resource Metadata path, so the app finds the document
# it mounts for each endpoint:
#
#   /.well-known/oauth-protected-resource/kb/development  ->  /.well-known/oauth-protected-resource/development
#
# Why the path has /kb in the middle: an endpoint's resource identifier is
# https://mcp.irha.cz/kb/development, and RFC 9728 puts the metadata at
# /.well-known/oauth-protected-resource + the resource's path. The app's 401 challenge
# (WWW-Authenticate: Bearer resource_metadata="…") names exactly that URL, and that is where
# every MCP client looks. The app mounts it at its own path, without the route's /kb prefix.
# A strip-prefix cannot do it — /kb is not at the front — hence a regex.
#
# Generic on purpose, like the /kb route: a new endpoint (/kb/home) needs no change here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: knowledge-base-mcp-middleware-oauth-metadata
  namespace: production
  annotations:
    # One wave ahead of HTTPRoute.oauth-metadata.yaml: Traefik rejects a route whose
    # ExtensionRef points at a middleware that does not exist yet.
    argocd.argoproj.io/sync-wave: "99"
spec:
  replacePathRegex:
    regex: ^/\.well-known/oauth-protected-resource/kb/(.*)
    replacement: /.well-known/oauth-protected-resource/$1
