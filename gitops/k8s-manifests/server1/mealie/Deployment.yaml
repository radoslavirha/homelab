---
# Mealie — the household cookbook. One container: FastAPI backend serving its
# own pre-built frontend, so there is no nginx sidecar and no second image.
#
# ── The image tag is the version, and Renovate cannot see it ────────────────
# There is no chart and no `targetRevision` to bump, so v3.27.0 below IS the
# pinned version of this app. renovate.json5 gives file patterns to the argocd
# and helm-values managers only; Renovate's `kubernetes` manager ships no
# default patterns either, so this line is currently invisible to it — which
# looks exactly like being up to date. Bump it by hand, or add a `kubernetes`
# manager pattern for gitops/k8s-manifests/ to renovate.json5.
#
# ── Trial status ────────────────────────────────────────────────────────────
# docs/superpowers/specs/2026-09-17-mealie-trial-install.md. LAN only, local
# accounts; Authentik OIDC needs a confidential client and the blueprints matrix
# renders public+PKCE `api` clients, so it is deliberately a follow-up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: mealie
  annotations:
    # Wave 2: after PostgreSQL (wave 1). Mealie runs its Alembic migrations
    # during startup and gives up if the database is not there, so on a first
    # sync this ordering is what stops it crashlooping into a backoff.
    argocd.argoproj.io/sync-wave: "2"
    # Restart when the mealie Secret changes — POSTGRES_PASSWORD reaches the pod
    # as an env var, and env vars are read once at process start. Without this
    # a rotated password leaves a Running pod holding the old one, ArgoCD green
    # the whole time. Reloader runs in opt-in mode; this annotation is the opt.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: /app/data is a ReadWriteOnce Longhorn volume
    # and Mealie is a single writer. A rolling update would start the new pod
    # before the old one released the volume, and it would sit Pending on
    # "Multi-Attach error" until the rollout timed out. The cost is a few
    # seconds of downtime per deploy, which for a cookbook is not a cost.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: mealie
    spec:
      # No securityContext.runAsNonRoot here, and that is not an oversight. The
      # upstream image has no USER directive: docker/entry.sh starts as root,
      # remaps the `abc` user to PUID/PGID, chowns /app so the mounted volume is
      # writable, and only then `exec gosu`s down to that uid. Forcing non-root
      # skips the chown and Mealie cannot write /app/data.
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.27.0
          ports:
            - name: http
              # 9000 is Mealie's API_PORT default and upstream says not to change
              # it inside a container. The Service does the remapping if ever
              # needed; this stays 9000.
              containerPort: 9000
              protocol: TCP
          env:
            # Absolute, external, and https — Mealie builds notification links
            # and the OIDC callback URL from it, so a wrong value produces links
            # that work from nowhere. Trailing slashes are stripped by Mealie.
            - name: BASE_URL
              value: https://mealie.irha.cz
            # Meal plans and the daily task schedule are local-time concepts; the
            # container defaults to UTC, which puts "today" an hour off.
            - name: TZ
              value: Europe/Prague
            # Already the upstream default since v1.4.0, but stated explicitly:
            # this host answers to the whole LAN and self-registration is not
            # wanted. Users are invited by the admin.
            - name: ALLOW_SIGNUP
              value: "false"
            #
            # ── There is deliberately no DEFAULT_EMAIL / DEFAULT_PASSWORD ────
            # They are not settable any more. In v3.x `_DEFAULT_EMAIL` and
            # `_DEFAULT_PASSWORD` are pydantic PRIVATE attributes of AppSettings
            # (mealie/core/settings/settings.py at the v3.27.0 tag) and
            # pydantic-settings never fills a leading-underscore attribute from
            # the environment. Because AppSettings sets `extra="allow"`, adding
            # them back is WORSE than useless: they are accepted, ignored, and
            # leave you believing the admin password is something it is not.
            #
            # The first admin is therefore upstream's built-in
            # `changeme@example.com` / `MyPassword` (mealie/repos/seed/init_users.py).
            # CHANGE IT AT FIRST LOGIN — the route is live the moment DNS
            # resolves. /api/app/about reports `isFirstLogin: true` until you do.
            #
            # ── Database ────────────────────────────────────────────────────
            # Names verified against Mealie's own PostgresProvider
            # (mealie/core/settings/db_providers.py, v3.27.0), not guessed.
            # DB_ENGINE anything but "postgres" silently falls back to SQLite in
            # db_provider_factory — there is no error to notice, so confirm the
            # tables really landed in PostgreSQL before trusting a green pod.
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              value: mealie-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: mealie
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie
                  key: postgres-password
            #
            # ── Authentik login ─────────────────────────────────────────────
            # Everything here is non-secret; the client secret arrives through
            # envFrom below, and OIDC stays OFF until it does. Mealie's
            # OIDC_FEATURE property requires CLIENT_ID, CLIENT_SECRET,
            # CONFIGURATION_URL and USER_CLAIM to be non-None and otherwise
            # reports "Missing required values for [...]" and disables itself —
            # so a missing secret degrades to local logins rather than breaking
            # the pod. /api/app/about shows which state it is in.
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: Authentik
            # issuer_mode is per_provider on this IdP, so the discovery URL
            # carries the application slug. A token minted by another cluster's
            # provider fails on `iss` here, by design.
            - name: OIDC_CONFIGURATION_URL
              value: https://auth.irha.cz/application/o/mealie-server1-production/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: mealie-server1-production
            # This repo's role ladder, reused rather than a second vocabulary:
            # the `homelab roles` mapping emits <app>.<role> filtered to THIS
            # application, so the claim is `roles`, not Authentik's unfiltered
            # `groups`. Two rungs, because Mealie has only two levels.
            - name: OIDC_GROUPS_CLAIM
              value: roles
            - name: OIDC_USER_GROUP
              value: mealie.user
            - name: OIDC_ADMIN_GROUP
              value: mealie.admin
            # Mealie asks for `openid profile email` by default, which would NOT
            # include the roles scope — and without it the groups claim never
            # arrives, so every login is refused by OIDC_USER_GROUP. The `roles`
            # and `profile` scope names come from the blueprint chart's own
            # mappings (`homelab roles`, `homelab profile`).
            - name: OIDC_SCOPES_OVERRIDE
              value: openid profile email roles
            # Authentik does not verify email addresses, and says so: its shipped
            # `email` scope mapping (managed goauthentik.io/providers/oauth2/
            # scope-email, read from the running 2026.8.1 instance on 2026-09-18)
            # returns a hardcoded `"email_verified": False`. Mealie refuses every
            # login while that claim is false — "[OIDC] email_verified claim is
            # missing or false; refusing to authenticate", surfacing in the UI as
            # the unhelpful "Invalid Credentials".
            #
            # What the check is FOR (mealie/core/security/providers/
            # openid_provider.py): Mealie matches an OIDC login to an existing
            # account by the email claim, so an IdP where a user can set their own
            # address would let one member log into another member's account.
            #
            # That risk is REAL here, not theoretical: Authentik's
            # `default-user-settings` prompt stage carries an editable `email`
            # field, so any user can change their own address. The mitigation is
            # in Authentik, not here — remove that field from the flow, leaving
            # email admin-assigned — and it is UI work, like every other
            # membership decision in this homelab.
            #
            # Turning the check off is therefore a statement about THIS
            # deployment: a household of accounts created by hand, where the
            # worst case is one member reaching another's cookbook. The
            # alternative — emitting `email_verified: true` from a local scope
            # mapping — would assert a verification that never happened, for
            # every application bound to that mapping rather than just this one.
            - name: OIDC_REQUIRES_EMAIL_VERIFICATION
              value: "false"
            # Mealie creates a local account on first OIDC login. Left at its
            # default (true) deliberately: household members are granted access
            # in Authentik, and OIDC_USER_GROUP is the gate, so a second
            # invite-by-hand step in Mealie buys nothing.
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            # Local logins stay ENABLED for now: this is a trial, the first
            # admin is a local account, and locking the door behind an untested
            # IdP integration is how you end up with no way in. Flip to "false"
            # once an Authentik login has actually worked.
            - name: ALLOW_PASSWORD_LOGIN
              value: "true"
          envFrom:
            # OIDC_CLIENT_SECRET, and only that. `optional: true` is what makes
            # the ordering work: the blueprint creates the provider, Authentik
            # generates the secret, a human copies it into OpenBao, and ESO
            # materialises this Secret — until then the container starts without
            # it. Reloader (annotation on this Deployment) restarts the pod when
            # the Secret appears or changes, which is the only reason an envFrom
            # value can be picked up at all: env is read once at boot.
            - secretRef:
                name: mealie-oidc
                optional: true
          volumeMounts:
            # Recipe images, uploads, and the .secret / .session_secret files
            # Mealie generates for itself. Wiping this logs every user out.
            - name: data
              mountPath: /app/data
          # /api/app/about is the endpoint the image's own Docker HEALTHCHECK
          # curls (docker/healthcheck.sh), and it needs no authentication.
          startupProbe:
            # Alembic migrations run before the server listens, and the first
            # boot also seeds foods, units and labels. 5s x 60 = 5 minutes of
            # patience before anything is called failed.
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              # Mealie's ingredient parser loads NLTK data at import time, so
              # idle usage is well above what the process size suggests.
              memory: 512Mi
            limits:
              # No CPU limit — a URL import is a short burst of parsing and
              # throttling it only makes the request slower. Memory is capped at
              # upstream's own suggested ceiling for the compose example.
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
