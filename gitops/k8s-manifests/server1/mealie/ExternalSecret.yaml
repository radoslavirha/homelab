---
# The only secret Mealie's deployment consumes: the PostgreSQL password, shared
# by the server that sets it (StatefulSet.postgres.yaml, POSTGRES_PASSWORD) and
# the client that presents it (Deployment.yaml, POSTGRES_PASSWORD). One key, two
# readers — rotating it means rotating both, which is why they read the same
# Secret key rather than each carrying a literal.
#
# ── Why there is no `default-password` here ─────────────────────────────────
# The obvious second key would be Mealie's first-admin password. It is absent
# because Mealie cannot be told what it is. As of v3.x `_DEFAULT_EMAIL` and
# `_DEFAULT_PASSWORD` are pydantic PRIVATE attributes on AppSettings
# (mealie/core/settings/settings.py, verified against the v3.27.0 tag) — their
# docstrings say outright "it should no longer be set by end users", and
# pydantic-settings never populates a leading-underscore attribute from the
# environment. Worse, AppSettings sets `extra="allow"`, so a DEFAULT_PASSWORD
# env var is accepted, stored as a stray field, and silently ignored: no error,
# no warning, and an admin account whose password is not the one you set.
#
# So the first login is upstream's built-in `changeme@example.com` / `MyPassword`
# (mealie/repos/seed/init_users.py), and CHANGING IT AT FIRST LOGIN IS PART OF
# THE INSTALL, not an afterthought — the instance is reachable from the whole
# LAN the moment the HTTPRoute resolves. Mealie flags the account itself:
# /api/app/about reports `isFirstLogin: true` while that email still exists.
#
# Do not "fix" this by adding a DEFAULT_PASSWORD env var back. It does nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/part-of: mealie
  annotations:
    # Wave 0: ArgoCD waits for Ready=True (Secret populated by ESO) before
    # advancing to wave 1, where PostgreSQL starts and needs POSTGRES_PASSWORD
    # to exist. An empty OpenBao path fails here rather than crashlooping there.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mealie
  data:
    - secretKey: postgres-password
      remoteRef:
        # Store before first sync:
        #   bao kv put secret/server1/mealie postgres-password=<...>
        #
        # Rotating it is NOT just a re-seed: postgres only reads POSTGRES_PASSWORD
        # when it initialises an empty data directory, so a changed value leaves
        # the server on the old password and only Mealie moves. Change it with
        # `ALTER ROLE mealie PASSWORD …` in the running database as well.
        key: server1/mealie
        property: postgres-password
