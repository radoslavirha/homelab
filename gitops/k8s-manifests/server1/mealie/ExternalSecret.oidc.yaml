---
# Mealie's Authentik client secret — a SEPARATE ExternalSecret from the PostgreSQL
# one next to it, and that separation is the whole point of this file.
#
# ESO has no per-key "optional": if one `data` entry's remote property is missing,
# the WHOLE ExternalSecret fails and its target Secret stops being refreshed. Put
# this key in the mealie ExternalSecret and the window between "provider created"
# and "secret pasted into OpenBao" takes POSTGRES_PASSWORD down with it. Split, the
# failure is contained: Mealie keeps running on local accounts and only OIDC waits.
#
# ── The one manual step, and why it exists ─────────────────────────────────────
# The blueprint deliberately does not set `client_secret` (see the `confidential`
# block in gitops/helm-charts/authentik-blueprints/templates/configmap.yaml):
# Authentik generates one when it creates the provider, and a blueprint leaves a
# field it does not mention exactly as it found it, so the value survives every
# re-apply. Nothing can read it back out except a human or the API. So:
#
#   1. Land the matrix entry (gitops/helm-values/server3/authentik-blueprints.yaml)
#      and wait for the blueprint to apply — discovery is a cron at :57, and only
#      on a changed hash. To force it, enqueue discovery (docs/identity.md), never
#      `ak apply_blueprint` by hand.
#   2. Authentik UI → Applications → Providers → mealie-server1-production → copy
#      the Client Secret.
#   3. bao kv patch secret/server1/mealie oidc-client-secret=<paste>
#      (`patch`, not `put` — `put` replaces the whole path and would drop
#      postgres-password.)
#
# This ExternalSecret reports SecretSyncedError until step 3 lands. That is the
# expected state, not a fault.
#
# The Secret key is spelled OIDC_CLIENT_SECRET because the Deployment pulls it in
# with `envFrom` (optional: true) rather than a secretKeyRef — an env var that
# appears when the Secret does. Reloader restarts the pod when it changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/component: oidc
    app.kubernetes.io/part-of: mealie
  annotations:
    # Wave 0 like its sibling, but NOT load-bearing for startup: the Deployment's
    # envFrom is optional, so wave 2 proceeds whether this Secret exists or not.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mealie-oidc
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: server1/mealie
        property: oidc-client-secret
