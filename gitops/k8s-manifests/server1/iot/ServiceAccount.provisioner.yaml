---
# Identity the PostSync provisioner Jobs log in to OpenBao with.
#
# Replaces the hand-minted KV token that used to arrive here as
# ExternalSecret.provisioner-token.yaml. The Job projects this ServiceAccount's token and
# exchanges it at auth/kubernetes-server1/login for a 1h OpenBao token carrying the
# server1-provisioner policy. Nothing to rotate, nothing to expire in 32 days.
#
# OpenBao side (Terraform): iac/modules/vault-config/kubernetes.tf, role `provisioner`,
# bound to this name in the iot and mongodb namespaces. Changing the name here means
# changing kubernetes_provisioner_roles in iac/clusters/server3/vault-config/main.tf and
# global.serviceAccountName in gitops/helm-values/server1/provisioner/*.yaml.
#
# A raw manifest rather than a chart template on purpose: emqx-server1 and influxdb2-server1
# both render the provisioner chart into `iot`, so a chart-owned ServiceAccount would be one
# object claimed by two Applications — a SharedResourceWarning and a permanent OutOfSync flap.
#
# automountServiceAccountToken stays false, the repo-wide default (docs/architecture.md).
# The Job mounts a projected, short-lived token explicitly instead; it never calls the
# apiserver, so it needs no RBAC and no ca.crt.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  namespace: iot
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
