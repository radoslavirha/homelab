---
# OpenBao provisioner token for server1
# Provides write access to secret/data/server1/* only. There is NO cross-cluster grant: a
# provisioner writes solely into its own cluster tree, and server3's ESO reads from there.
# Used by PostSync Jobs in the iot AND mongodb namespaces to write provisioned credentials
# back to OpenBao.
#
# One-time setup (run after iot stage is deployed):
#   bao policy write server1-provisioner - <<'EOF'
#   path "secret/data/server1/*"     { capabilities = ["create", "read", "update", "patch"] }
#   path "secret/metadata/server1/*" { capabilities = ["read", "list"] }
#   EOF
#
#   # -orphan is mandatory: without it the token is revoked together with the login/root
#   # token that minted it, taking down every provisioner Job at once.
#   #
#   # -period is NOT enough on its own. It is silently clamped by the token auth mount's
#   # max_lease_ttl, which defaults to 768h -- so this token dies in 32 DAYS, not a year,
#   # and nothing renews it. Raise the mount's Maximum Lease TTL to 8760h first, then check
#   # `expire_time` on the new token is a year out. This is what caused the 2026-09-06 outage.
#   TOKEN=$(bao token create -policy=server1-provisioner -period=8760h -orphan -display-name="server1-provisioner" -field=token)
#   bao kv put secret/server1/provisioner-token token="${TOKEN}"
#
# This manual token should eventually be replaced by a Kubernetes auth login, the way ESO
# already authenticates -- see docs/superpowers/specs/2026-09-06-provisioner-token-lifecycle.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-provision-token
  namespace: iot
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-provision-token
  data:
    - secretKey: token
      remoteRef:
        key: server1/provisioner-token
        property: token
