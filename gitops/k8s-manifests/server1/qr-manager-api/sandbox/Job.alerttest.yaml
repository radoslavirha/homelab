---
# TEMPORARY — issue 14 fire test. Revert after the alerts are seen in Slack.
#
# A PreSync hook that always fails, the shape of the planned migration Job going wrong:
# the sync fails before anything is applied and the previous revision keeps serving.
# Expected: `job-failed` within ~2 minutes, `argocd-sync-failed` on qr-manager-api-server1-sandbox.
#
# BeforeHookCreation alone would leave the failed Job until the next sync, and the revert's
# sync renders no hook, so nothing would ever delete it. ttlSecondsAfterFinished does: the
# Job (and the job-failed alert) goes away 20 minutes after it fails.
apiVersion: batch/v1
kind: Job
metadata:
  name: alerttest-presync-fail
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1200
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fail
          image: busybox:1.37.0
          command: ["sh", "-c", "echo 'issue-14 alert fire test: failing on purpose'; exit 1"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
