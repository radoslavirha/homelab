---
# Prepends /r to every request arriving on the qr.home hostname.
#
# PRINTED QR CODES DEPEND ON THIS OBJECT. A label reads `http://qr.home/x7k2` and is
# resolvable only because this middleware turns that into `/r/x7k2`, which is where
# qr-manager-api mounts its RedirectController. Delete it, rename it, or drop the
# ExtensionRef in HTTPRoute.qr.yaml and every printed label 404s — and labels are stuck to
# physical objects, so they cannot be reissued. This is the one thing in this directory
# that must not be "cleaned up".
#
# Why the prefix lives here and not in the URL: the slug is short on purpose so the QR
# prints tiny. Adding /r to the printed string would spend characters; adding it at the
# gateway spends none.
#
# Second effect, equally deliberate: this route has no path matching of its own, so before
# this middleware existed `qr.home/qr-codes` reached full unauthenticated CRUD and
# `qr.home/api/docs` reached Swagger. Now every non-redirect path arrives at the app
# prefixed (`/r/qr-codes`, `/r/api/docs`) and matches nothing — qr.home is a redirect-only
# host. Admin access stays on the chart's api.<domain>/iot/qr-manager route.
#
# Why a rewrite and not a path match on the route itself — both alternatives were checked
# 2026-08-29 against Traefik's docs (chart 39.0.7) and do not exist:
#
#   - Matching only slug-shaped paths would need path.type: RegularExpression. Traefik's
#     Gateway API provider documents Exact and PathPrefix only, and the Gateway API spec
#     makes RegularExpression implementation-specific. No prefix separates /x7k2 from
#     /qr-codes.
#   - Adding a more specific rule that REFUSES /qr-codes does not work either: Gateway API
#     has no deny filter and Traefik OSS has no block middleware.
#
# So the gap could not be closed by subtraction. Rewriting every path was the only shape
# left, and it happens to fix the app's root-catch-all problem at the same time.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: qr-manager-api-middleware-addprefix-redirect
  namespace: production
  annotations:
    # One wave ahead of HTTPRoute.qr.yaml. A route whose ExtensionRef points at a
    # middleware that does not exist yet is rejected by Traefik, and the window where that
    # is true is a window where labels do not resolve.
    argocd.argoproj.io/sync-wave: "99"
spec:
  addPrefix:
    prefix: /r
