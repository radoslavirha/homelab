# The knowledge-base index: every KB in one database, keyed by a `kb` column. Tables and
# indexes are knowledge-base-api's migrations. Derived data — rebuilt from the sources by the
# indexer — so it is not in the backup path.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: knowledge-base
  namespace: postgres
  annotations:
    # After the role it is owned by.
    argocd.argoproj.io/sync-wave: "3"
spec:
  cluster:
    name: postgres
  name: knowledge_base
  owner: knowledge_base
  extensions:
    # pgvector's extension name is `vector`; the image comes from ImageCatalog.yaml.
    - name: vector
      ensure: present
  databaseReclaimPolicy: delete
