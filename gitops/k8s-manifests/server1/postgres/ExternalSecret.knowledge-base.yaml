# The `knowledge_base` role's password, read back from OpenBao (written there once by
# PushSecret.knowledge-base.yaml) into the kubernetes.io/basic-auth Secret CNPG wants for the
# DatabaseRole. The cnpg.io/reload label makes the operator re-apply the role if it changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-knowledge-base
  namespace: postgres
  annotations:
    # After the PushSecret (wave 0) has written the key. On a first sync this may fail once
    # and retry; the role waits for it (wave 2).
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgres-knowledge-base
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: knowledge_base
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: server1/postgres/knowledge-base
        property: password
