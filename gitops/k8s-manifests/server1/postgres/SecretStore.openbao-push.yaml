# OpenBao with write access, for this namespace's PushSecrets only. The fleet-wide
# `openbao` ClusterSecretStore is read-only and stays that way; reads here still go through it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-push
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    vault:
      server: https://vault.server3.homelab.irha.cz
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-server1
          role: provisioner
          serviceAccountRef:
            name: provisioner
