# Password of the `knowledge` role, read by DatabaseRole.knowledge.yaml.
#
# CNPG wants a kubernetes.io/basic-auth Secret with `username` and `password`, in the same
# namespace as the DatabaseRole. The consumer (the knowledge-base indexer in `production`)
# gets its own ExternalSecret from the same OpenBao key in its own namespace.
#
# Store before first sync — hex, because consumers build a connection URL from it:
#   bao kv put secret/server1/postgres knowledge-password="$(openssl rand -hex 32)"
#
# Rotation: re-seed, then force-sync this ExternalSecret. The cnpg.io/reload label makes the
# operator re-apply the DatabaseRole when the Secret changes, so the server moves too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-knowledge
  namespace: postgres
  annotations:
    # Wave 0: an empty OpenBao path fails HERE, visibly, before the role is created.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgres-knowledge
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: knowledge
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: server1/postgres
        property: knowledge-password
