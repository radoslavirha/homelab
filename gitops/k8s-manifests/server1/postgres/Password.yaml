# Generates role passwords for the PushSecrets in this namespace. Letters and digits only:
# consumers build a postgresql:// URL from the password, and @ : / ? # % would break it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: role-password
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
