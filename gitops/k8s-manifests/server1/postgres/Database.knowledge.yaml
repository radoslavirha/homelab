# The knowledge-base index: documents, chunks and embeddings for every KB, keyed by a `kb`
# column. Derived data — rebuilt from the KB git repo by the indexer — so it is not in the
# backup path.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: knowledge
  namespace: postgres
  annotations:
    # After the role it is owned by.
    argocd.argoproj.io/sync-wave: "3"
spec:
  cluster:
    name: postgres
  name: knowledge
  owner: knowledge
  extensions:
    # pgvector's extension name is `vector`; the image comes from ImageCatalog.yaml.
    - name: vector
      ensure: present
  databaseReclaimPolicy: delete
