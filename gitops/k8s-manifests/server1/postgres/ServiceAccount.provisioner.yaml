---
# The identity the `openbao-push` SecretStore logs in to OpenBao with. Bound to the
# `provisioner` role on the kubernetes-server1 auth mount — the same role the provisioner Jobs
# use in `iot` and `mongodb` (iac/clusters/server3/vault-config/main.tf). No pod runs as it;
# ESO requests a token for it on each login.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
