# Creates the `knowledge_base` role's password once and stores it in OpenBao. What the
# provisioner Jobs do for MongoDB and EMQX users, without a Job:
#   - IfNotExists: once the key exists, OpenBao is the source of truth. A re-sync, a deleted
#     Secret or a new generator value never overwrites it.
#   - deletionPolicy None: removing this manifest leaves the password in OpenBao.
#
# Read back by ExternalSecret.knowledge-base.yaml (for the DatabaseRole) and by
# knowledge-base-api's own ExternalSecret in `production`.
#
# New role = copy this file, the ExternalSecret and the DatabaseRole; change the name.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: knowledge-base
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: openbao-push
      kind: SecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: role-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: server1/postgres/knowledge-base
          property: password
