---
# Authentik proxy outpost for server1 — what Traefik's forwardAuth asks about every request to a
# guarded UI on this cluster. It serves the `kind: proxy` providers assigned to the outpost
# `homelab-proxy-server1` in gitops/helm-values/server3/authentik-blueprints.yaml, and fetches that
# list from Authentik itself, so guarding another UI on this cluster needs no change here.
#
# One outpost per cluster, on purpose: the embedded outpost on server3 would mean every guarded
# request here crossed to server3 through its Traefik, which trusts no forwarded headers — and the
# outpost picks its provider by X-Forwarded-Host. Design: docs/identity.md, "Proxies".
#
# THE TAG MOVES WITH AUTHENTIK. Keep it equal to targetRevision in
# gitops/argocd-manifests/server3/apps/identity/Authentik.yaml.
#
# Security context mirrors the Deployment Authentik's own Kubernetes controller renders
# (outposts/controllers/k8s/deployment.py, 2026.8.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-outpost
  namespace: traefik
  labels:
    app.kubernetes.io/name: authentik-outpost
    app.kubernetes.io/component: forward-auth
    app.kubernetes.io/part-of: authentik
  annotations:
    # The token Secret changes only when the outpost object is recreated. Restart onto it.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-outpost
        app.kubernetes.io/component: forward-auth
        app.kubernetes.io/part-of: authentik
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/goauthentik/proxy:2026.8.1
          env:
            # API + websocket to Authentik on server3, over the LAN via its Traefik — the same path
            # this cluster's ExternalSecrets already take to OpenBao.
            - name: AUTHENTIK_HOST
              value: https://auth.irha.cz
            - name: AUTHENTIK_INSECURE
              value: "false"
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-outpost
                  key: AUTHENTIK_TOKEN
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: http-metrics
              containerPort: 9300
              protocol: TCP
          # The image's own Docker HEALTHCHECK. Readiness only, no liveness: an outpost that cannot
          # reach server3 should drop out of the Service — every guarded UI then fails closed with a
          # 500 (measured on server2, 2026-09-16) — rather than restart in a loop.
          readinessProbe:
            exec:
              command: ["/authentik", "healthcheck", "proxy"]
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
