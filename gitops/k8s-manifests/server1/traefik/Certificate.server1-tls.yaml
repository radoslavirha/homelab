---
# The server1 cluster certificate. Same shape as server3's — see
# gitops/k8s-manifests/server3/traefik/Certificate.server3-tls.yaml for why it lives in the
# traefik namespace and why the Traefik Application owns it rather than cert-manager's.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server1-tls
  namespace: traefik
spec:
  secretName: server1-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256

  dnsNames:
    - server1.homelab.irha.cz
    # Infrastructure on this cluster: headlamp, hubble, longhorn, influx, mqtt, and the
    # production app names api/apps.
    - "*.server1.homelab.irha.cz"
    # Sandbox. One wildcard per STAGE, not per component — this is what the
    # api.sandbox.… ordering buys, and it means adding an app never touches this list.
    #
    # NOTE: the chart still emits sandbox.api.… today. Stage 6.0 reverses that. Until it
    # does, this SAN matches nothing — it is carried now so stage 6.0 is a chart change
    # only and does not also need a certificate reissue.
    - "*.sandbox.server1.homelab.irha.cz"
    # Apex tier: the URL shortener. Deliberately short — printed QR codes point at it.
    - qr.irha.cz
    # Apex tier: the recipe manager. Named for where it is going — it is LAN-only today
    # and public once the public-exposure spec's gate opens, and a rename would break
    # every phone client and OIDC redirect URI pointed at it.
    - mealie.irha.cz
    # Apex tier: the household assistant (Open WebUI). Named for the ROLE, not the
    # product -- it survives swapping Open WebUI for something else, and a rename
    # would break the registered OIDC redirect URI. It is also the one name the
    # public-exposure spec ever publishes, so it is deliberately vaguer about the
    # inventory than a product name would be: every SAN in this list is public in
    # Certificate Transparency logs.
    - assistant.irha.cz

