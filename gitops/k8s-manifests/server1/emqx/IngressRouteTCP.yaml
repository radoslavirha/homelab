---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: emqx-mqtt
  namespace: iot
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: iot
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  entryPoints:
    - mqtt
  routes:
    - match: HostSNI(`*`)
      services:
        - name: emqx
          port: 1883

---
# MQTT over TLS on 8883 — the encrypted half of the pair. The plaintext route above stays
# for devices that cannot do TLS; this one exists so everything that can, does.
#
# Credentials on 1883 travel in cleartext inside the CONNECT packet, readable by anything on
# the LAN. Authentication and ACLs are enforced either way (EMQX_AUTHORIZATION__NO_MATCH:
# deny), so a sniffed credential is scoped to that user's topics — but it is still a
# credential in the clear. Move a client here by pointing it at port 8883 with TLS enabled
# and SNI set to the hostname below.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: emqx-mqtts
  namespace: iot
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/component: mqtt
    app.kubernetes.io/part-of: iot
  annotations:
    argocd.argoproj.io/sync-wave: "100"
    external-dns.alpha.kubernetes.io/target: "192.168.1.200"
spec:
  entryPoints:
    - mqtts
  routes:
    # Real HostSNI, unlike the plaintext route's `*` — TLS termination selects the router by
    # the SNI the client sends, so the client must send one.
    - match: HostSNI(`mqtt.server1.homelab.irha.cz`)
      services:
        - name: emqx
          port: 1883
  tls:
    secretName: server1-tls
