# Server3-only Identity App-of-Apps: Authentik.
# Sync wave 3 — same reasoning as RootObservability: Authentik needs ESO (wave 1)
# for its secrets and Traefik (wave 2) for the HTTPRoute. Not wave 1 despite being
# "infrastructure": it is a consumer of the platform, not part of it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-identity-server3
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/radoslavirha/homelab
    targetRevision: HEAD
    path: gitops/argocd-manifests/server3/apps/identity
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
