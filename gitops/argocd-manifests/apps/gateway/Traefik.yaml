apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: traefik
  namespace: argocd
spec:
  generators:
    - list:
        # chartVersion is per cluster ON PURPOSE, and is temporary.
        #
        # Traefik 3.7 (chart 41.x) watches v1.TLSRoute unconditionally. On 2026-09-06 this
        # chart was bumped for all three clusters in one commit while Gateway API was still
        # 1.4.0, which does not serve that version: every informer failed to sync, the
        # gateway provider published nothing, and all ingress on all three clusters 404'd
        # for 3-4 minutes -- taking ESO's path to OpenBao with it. See the write-up in
        # docs/superpowers/plans/archive/2026-09-03-upgrade-w2-charts-medium-risk.md § 2.6.
        #
        # Gateway API is now 1.6.2 fleet-wide and v1.TLSRoute is served, so the cause is
        # gone. This field exists so the retry is still staged rather than simultaneous:
        # syncPolicy.automated is on, so a single shared targetRevision would re-sync all
        # three clusters the moment the ApplicationSet updated.
        #
        # server2 carries almost no data and is the canary. Once it is verified, move
        # server1 and server3, then collapse this back to a single targetRevision and
        # migrate the shared values file.
        elements:
          - cluster: server1
            clusterServer: https://192.168.1.200:6443
            chartVersion: "39.0.7"
          - cluster: server2
            clusterServer: https://192.168.1.201:6443
            chartVersion: "41.5.0"
          - cluster: server3
            clusterServer: https://kubernetes.default.svc
            chartVersion: "39.0.7"
  template:
    metadata:
      name: traefik-{{cluster}}
    spec:
      project: default
      sources:
        - repoURL: https://traefik.github.io/charts
          chart: traefik
          targetRevision: '{{chartVersion}}'
          helm:
            releaseName: traefik
            valueFiles:
              - $values/gitops/helm-values/traefik.yaml
              - $values/gitops/helm-values/{{cluster}}/traefik.yaml
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          ref: values
        # Cluster-scoped Traefik resources that are not chart values — currently the
        # cert-manager Certificate backing the HTTPS listener.
        #
        # The Certificate belongs here rather than with the cert-manager Application because
        # it targets the `traefik` namespace, and only this Application creates that
        # namespace. Putting it in root-infra (wave 1) would deadlock a fresh bootstrap:
        # the Certificate cannot apply into a namespace that root-gateway (wave 2) has not
        # created yet, and wave 2 does not start until wave 1 is Healthy.
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          path: gitops/k8s-manifests/{{cluster}}/traefik
      destination:
        server: '{{clusterServer}}'
        namespace: traefik
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
