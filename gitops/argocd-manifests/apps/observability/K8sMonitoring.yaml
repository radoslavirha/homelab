# k8s-monitoring — ApplicationSet (all clusters)
# Replaces: OTelGateway ApplicationSet + AppsOTelCollector ApplicationSet
# Upstream values.yaml: https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k8s-monitoring
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # Every cluster gets the shared base (collectors + feature toggles);
          # the cluster file adds only `cluster.name` and `destinations`.
          # server1/server2 forward to server3 over OTLP; server3 fans out locally.
          - cluster: server1
            clusterServer: https://192.168.1.200:6443
          - cluster: server2
            clusterServer: https://192.168.1.201:6443
          - cluster: server3
            clusterServer: https://kubernetes.default.svc
  template:
    metadata:
      name: k8s-monitoring-{{cluster}}
    spec:
      project: default
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: k8s-monitoring
          targetRevision: 4.3.2
          helm:
            releaseName: k8s-monitoring
            valueFiles:
              - $values/gitops/helm-values/k8s-monitoring.yaml
              - $values/gitops/helm-values/{{cluster}}/k8s-monitoring.yaml
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          ref: values
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          path: gitops/k8s-manifests/{{cluster}}/k8s-monitoring
      destination:
        server: '{{clusterServer}}'
        namespace: monitoring
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: privileged
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
