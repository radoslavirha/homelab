# network-policies — ApplicationSet (cluster × production + sandbox)
# Raw manifests: gitops/k8s-manifests/<cluster>/network-policies/<env>/
#
# ── One Application per namespace, on purpose ────────────────────────────────
# The generator produces `network-policies-<cluster>-<env>`, so sandbox can be
# synced, verified and (if needed) rolled back entirely independently of
# production. That separation is the whole rollout strategy: sandbox is the
# canary, and a canary that shares an Application with production is not one.
#
# ── syncPolicy is deliberately MANUAL ───────────────────────────────────────
# Every other Application in this repo uses `automated: {selfHeal, prune}`.
# This one does not, and the deviation is intentional. These policies can take
# a namespace off the network; the documented rollback is
# `kubectl delete networkpolicy … -n <env>`, which takes effect immediately and
# needs no pod restart. `selfHeal` would undo exactly that rollback the next
# time ArgoCD reconciled — turning the emergency brake into a temporary one.
# Switch to automated once both clusters have run enforced for a while.
#
# ── server1 is absent from the generator ────────────────────────────────────
# Only server2 has manifests under network-policies/ today. server1 is added to
# the list below once its set exists and server2 has been verified enforced.
# server1 is the cluster with a live registered device and real miIO LAN
# traffic — see docs/superpowers/plans/2026-08-25-network-default-deny.md.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: network-policies
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: server2
                  clusterServer: https://192.168.1.201:6443
          - list:
              elements:
                - env: production
                - env: sandbox
  template:
    metadata:
      name: network-policies-{{cluster}}-{{env}}
    spec:
      project: default
      source:
        repoURL: https://github.com/radoslavirha/homelab
        targetRevision: HEAD
        path: gitops/k8s-manifests/{{cluster}}/network-policies/{{env}}
      destination:
        server: '{{clusterServer}}'
        namespace: '{{env}}'
      syncPolicy:
        syncOptions:
          # The namespaces are created by the application ApplicationSets in
          # wave 4; this must never be the thing that creates them.
          - CreateNamespace=false
