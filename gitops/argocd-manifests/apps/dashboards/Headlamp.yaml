apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: headlamp-dashboard
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: server1
            clusterServer: https://192.168.1.200:6443
          - cluster: server2
            clusterServer: https://192.168.1.201:6443
          - cluster: server3
            clusterServer: https://kubernetes.default.svc
  template:
    metadata:
      name: headlamp-dashboard-{{cluster}}
    spec:
      project: default
      sources:
        - repoURL: https://kubernetes-sigs.github.io/headlamp/
          chart: headlamp
          targetRevision: 0.45.0
          helm:
            releaseName: headlamp
            valueFiles:
              - $values/gitops/helm-values/headlamp.yaml
              - $values/gitops/helm-values/{{cluster}}/headlamp.yaml
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          ref: values
        # Cluster-scoped RBAC for OIDC logins: the ClusterRoleBindings that map the
        # `roles` claim (headlamp.admin / .editor / .reader) onto cluster-admin / edit
        # / view. They belong to Headlamp rather than to a shared RBAC app because
        # they are meaningless without this release and its apiserver_oidc.
        #
        # The directory must exist for EVERY cluster in the generator, even one whose
        # apiserver does not trust the issuer yet -- a source path that does not exist
        # makes the Application error. Bindings for groups nobody holds are inert.
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          path: gitops/k8s-manifests/{{cluster}}/headlamp
      destination:
        server: '{{clusterServer}}'
        namespace: headlamp
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
