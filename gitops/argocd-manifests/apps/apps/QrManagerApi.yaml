# qr-manager-api — ApplicationSet (server1 × production + sandbox)
# Chart: gitops/helm-charts/iot-applications/ (path-based, no publishing)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: qr-manager-api
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: server1
                  clusterServer: https://192.168.1.200:6443
          - list:
              elements:
                - env: production
                - env: sandbox
  template:
    metadata:
      name: qr-manager-api-{{cluster}}-{{env}}
    spec:
      project: default
      sources:
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          path: gitops/helm-charts/iot-applications
          helm:
            releaseName: qr-manager-api
            valueFiles:
              - $values/gitops/helm-values/server1/apps/qr-manager-api/base.yaml
              - $values/gitops/helm-values/server1/apps/qr-manager-api/{{env}}.yaml
              # Every template variable (vars:) is in a file, so whoever edits a config can find it.
              # Loaded last: an app file cannot shadow a variable by accident.
              - $values/gitops/helm-values/server1/apps/vars/common.yaml
              - $values/gitops/helm-values/server1/apps/vars/{{env}}.yaml
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          ref: values
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          path: gitops/k8s-manifests/{{cluster}}/qr-manager-api/{{env}}
      destination:
        server: '{{clusterServer}}'
        namespace: '{{env}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
