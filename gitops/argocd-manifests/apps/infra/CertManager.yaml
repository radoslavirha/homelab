# cert-manager on all three clusters.
#
# Certificates are Secrets and Secrets do not cross clusters, so this is one install per
# cluster — the same ApplicationSet-with-a-list-generator shape as ESO, Reloader and Traefik.
#
# sync-wave 2, inside root-infra (itself wave 1). ESO carries no wave annotation, so it is
# wave 0 and lands first: the per-cluster ExternalSecret below needs ESO's CRDs to exist
# before it can apply. root-infra as a whole finishes before root-gateway (wave 2), which is
# what the HTTPS listener on Traefik will depend on in stage 4.
#
# Design: docs/architecture.md -> "Hostnames and TLS"; renewal runbook in docs/observability.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: server1
            clusterServer: https://192.168.1.200:6443
          - cluster: server2
            clusterServer: https://192.168.1.201:6443
          - cluster: server3
            clusterServer: https://kubernetes.default.svc
  template:
    metadata:
      name: cert-manager-{{cluster}}
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        # Required companion to ServerSideApply below, not an optimisation.
        #
        # ArgoCD picks its diff strategy per Application, not per resource. With
        # ServerSideApply on and the default (client-side) diff, it predicts live state by
        # merging only the fields it manages — and `spec.data` on an ExternalSecret is an
        # atomic list with no merge key, so the whole list is replaced in the prediction and
        # the CRD's own defaults nested inside remoteRef (conversionStrategy,
        # decodingStrategy, metadataPolicy, nullBytePolicy) vanish from it. The live object
        # has them, the prediction does not, and the resource reports OutOfSync forever
        # while being entirely correct.
        #
        # ServerSideDiff computes the prediction with a server-side apply dry-run instead,
        # so the API server fills in the same defaults it filled in on the live object and
        # the two agree. Per-resource ServerSideApply=false does NOT fix this — the diff
        # strategy is already chosen at Application level by then.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: v1.21.1
          helm:
            releaseName: cert-manager
            valueFiles:
              - $values/gitops/helm-values/cert-manager.yaml
              - $values/gitops/helm-values/{{cluster}}/cert-manager.yaml
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          ref: values
        # ExternalSecret (Cloudflare API token) + ClusterIssuer.
        - repoURL: https://github.com/radoslavirha/homelab
          targetRevision: HEAD
          path: gitops/k8s-manifests/{{cluster}}/cert-manager
      destination:
        server: '{{clusterServer}}'
        namespace: cert-manager
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          # Required, not preference: three of cert-manager's six CRDs are past the
          # 262144-byte ceiling on the last-applied-configuration annotation that
          # client-side apply needs — challenges 269KB, clusterissuers 326KB, issuers 326KB.
          - ServerSideApply=true
        automated:
          selfHeal: true
          # Matches ESO and Reloader. Safe here: crds.keep survives a prune, and cert-manager
          # does not set an owner reference on the tls Secret it issues, so pruning a
          # Certificate leaves the certificate material in place to be re-adopted.
          prune: true
