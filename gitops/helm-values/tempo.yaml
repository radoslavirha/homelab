# Tempo — shared base values (single-binary mode)
# Upstream: https://github.com/grafana-community/helm-charts/tree/main/charts/tempo
# Receives traces from OTel Collector via OTLP gRPC on port 4317.

tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

  # Metrics generator writes span metrics to Prometheus
  metricsGenerator:
    enabled: true
    # Port 80, not 9090. `server.fullnameOverride: prometheus` renders a Service that
    # listens on 80 only (the chart's servicePort default) — nothing answers on 9090.
    # Same endpoint k8s-monitoring's server3 prometheus destination writes to.
    remoteWriteUrl: "http://prometheus.monitoring.svc.cluster.local:80/api/v1/write"

  # Without this the generator loads no processors and emits only traces_host_info.
  # `metricsGenerator.enabled` renders the generator's ring/storage config, but the
  # processor list is per-tenant and lives in overrides; the chart writes this block
  # verbatim into the config's `overrides.defaults` (configmap-tempo.yaml).
  # These two feed Grafana's Tempo datasource `tracesToMetrics` (traces_spanmetrics_*)
  # and `serviceMap` (traces_service_graph_*), both dead links until now.
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
        # The generator runs on server3 and derives these centrally from spans arriving
        # from all three clusters, so without an explicit dimension the output has no
        # cluster label at all and Phase 3 can never be per-cluster.
        #
        # Ordering matters: this is only meaningful once the spans themselves are
        # attributed correctly. Until 0d13e1c, server3's tempo destination overwrote every
        # forwarded span's cluster with "server3", so adding this dimension first would
        # have produced a label that was present, plausible and wrong on every series.
        #
        # Intrinsic dimensions (service, span_name, span_kind, status_code) stay on.
        # Attribute names become labels with dots replaced by underscores, so this lands
        # as `k8s_cluster_name` — matching the label the Traefik dashboard already uses.
        processor:
          span_metrics:
            dimensions:
              - k8s.cluster.name
          service_graphs:
            dimensions:
              - k8s.cluster.name

  retention: 336h  # 14 days

  reportingEnabled: false

persistence:
  enabled: true
  size: 20Gi
  storageClass: longhorn
