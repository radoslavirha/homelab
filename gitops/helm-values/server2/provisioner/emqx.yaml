global:
  cluster: server2
  baoHost: "https://vault.server3.homelab.irha.cz"
  baoTokenSecret: openbao-provision-token

emqx:
  host: "http://emqx.iot.svc.cluster.local:18083"
  credentialsSecret: emqx-credentials
  credentialsUsernameKey: EMQX_DASHBOARD__DEFAULT_USERNAME
  credentialsPasswordKey: EMQX_DASHBOARD__DEFAULT_PASSWORD

  # --- Topic ACLs -----------------------------------------------------------
  #
  # Rules live on each user, and are written to the built_in_database authorization
  # source — the same backend that holds the accounts themselves. A user's `acl` list
  # replaces that username's rules on every sync; usernames absent from this file
  # (`loxone`, `explorer`, both created by hand) are never touched by the Job.
  #
  # Rules are INERT until authorization.no_match is flipped from `allow` to `deny` in
  # gitops/helm-values/emqx.yaml. Land them, audit, then flip.
  # Plan: docs/superpowers/plans/2026-08-29-mqtt-topic-acls.md

  jobs:
    telegraf:
      syncWave: "0"
      users:
        - mqttUsername: telegraf
          baoPath: telegraf-mqtt
          baoUsernameKey: username
          baoPasswordKey: password
          idempotencyStrategy: api-check
          # Pure consumer: mqtt_consumer input on Loxone state, no MQTT output.
          acl:
            - { permission: allow, action: subscribe, topic: "iot/loxone/state" }

    miot-bridge-production:
      syncWave: "0"
      users:
        - mqttUsername: miot-bridge-production
          baoPath: production/miot-bridge-api-emqx
          baoUsernameKey: mqtt-username
          baoPasswordKey: mqtt-password
          idempotencyStrategy: bao-check
          # Consumes commands, produces responses and notifications. Publish and
          # subscribe are separate grants on purpose.
          acl:
            - { permission: allow, action: subscribe, topic: "iot/miot-bridge/device/+/command" }
            - { permission: allow, action: publish,   topic: "iot/miot-bridge/device/+/response" }
            - { permission: allow, action: publish,   topic: "iot/miot-bridge/device/+/notifications" }

    miot-bridge-sandbox:
      syncWave: "0"
      users:
        - mqttUsername: miot-bridge-sandbox
          baoPath: sandbox/miot-bridge-api-emqx
          baoUsernameKey: mqtt-username
          baoPasswordKey: mqtt-password
          idempotencyStrategy: bao-check
          # Same shape under the sandbox prefix. The prefix split is load-bearing: it is
          # what keeps sandbox from driving production devices.
          acl:
            - { permission: allow, action: subscribe, topic: "iot/sandbox/miot-bridge/device/+/command" }
            - { permission: allow, action: publish,   topic: "iot/sandbox/miot-bridge/device/+/response" }
            - { permission: allow, action: publish,   topic: "iot/sandbox/miot-bridge/device/+/notifications" }
