global:
  cluster: server2
  baoHost: "https://vault.server3.homelab.irha.cz"
  baoTokenSecret: openbao-provision-token

influxdb2:
  host: "http://influxdb2.iot.svc.cluster.local"
  org: homelab
  adminTokenSecret: influxdb2
  adminTokenKey: admin-token

  jobs:
    loxone:
      syncWave: "0"
      buckets:
        - name: loxone
          retentionSeconds: 1209600
        - name: loxone_downsample
          retentionSeconds: 0
      tasks:
        - name: "Downsample Loxone"
          flux: |
            option task = {name: "Downsample Loxone", every: 10m}

            from(bucket: "loxone")
                |> range(start: -task.every)
                |> aggregateWindow(every: task.every, fn: mean)
                |> to(bucket: "loxone_downsample")
      tokens:
        # Scoped read-only InfluxDB token for the Grafana datasource on server3.
        #
        # Written to THIS cluster's own OpenBao tree. It used to target
        # secret/server3/server2-influxdb2-grafana via baoCluster, which no provisioner
        # token has ever been allowed to write: each is scoped to secret/data/<own
        # cluster>/* only. The seeded value survived from bootstrap, so Grafana kept
        # working while every run of this Job failed on a 403 it never surfaced.
        # server3's ESO reads secret/data/*, so it consumes this path just as happily.
        - description: server2-grafana-read
          readBuckets:
            - loxone
            - loxone_downsample
          baoPath: influxdb2-grafana
          baoKey: token

    telegraf:
      syncWave: "1"
      buckets: []
      tasks: []
      tokens:
        - description: telegraf-write
          writeBucket: loxone
          baoPath: telegraf-influxdb2
          baoKey: token
