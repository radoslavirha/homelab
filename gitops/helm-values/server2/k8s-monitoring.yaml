# k8s-monitoring — server2 cluster overrides
# Upstream values.yaml: https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/values.yaml
cluster:
  name: server2

destinations:
  server3:
    type: otlp
    # Plaintext gRPC, deliberately. The receiver is an IngressRouteTCP with
    # HostSNI(`*`) on a dedicated 4317 entrypoint — it terminates no TLS, so the
    # hostname here is a DNS lookup and nothing more. Renaming it does not make
    # the hop encrypted; that is separate design work, see the note below.
    url: http://otel.server3.homelab.irha.cz:4317
    protocol: grpc
    tls:
      insecure: true
    metrics:
      enabled: true
    logs:
      enabled: true
    traces:
      enabled: true
    # NO auth block. gRPC refuses to attach per-RPC credentials to a plaintext
    # channel — "the credentials require transport level security" — so
    # tls.insecure: true and auth.type: bearerToken cannot be combined. The
    # exporter fails to start entirely and no telemetry leaves the cluster.
    #
    # Nothing is lost by dropping it: server3's alloy-receiver never validated
    # the token (k8s-monitoring has no server-side OTLP auth), so the endpoint
    # was always protected by private-network isolation alone.
    #
    # To have real auth, terminate TLS on otel.server3.homelab.irha.cz and reinstate:
    #   tls: { insecure: false, ca: ... }
    #   auth: { type: bearerToken, bearerTokenFrom: env("OTEL_AUTH_TOKEN") }
    # plus collectorCommon.alloy.envFrom to inject the otel-auth-token secret.
