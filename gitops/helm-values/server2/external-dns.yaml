# ExternalDNS — server2 cluster overrides
# Shared base values: gitops/helm-values/external-dns.yaml

# ADDITIVE through the migration — routes carry .home and irha.cz side by side, and a
# hostname missing from this list is ignored SILENTLY by ExternalDNS. Must land before any
# route on this cluster carries an irha.cz name. Apex names are listed individually; a bare
# `irha.cz` would have all three clusters claiming the whole zone.
domainFilters:
  - server2.home
  - server2.homelab.irha.cz

# TXT registry owner ID — must be unique per cluster to avoid record conflicts
txtOwnerId: homelab-server2
