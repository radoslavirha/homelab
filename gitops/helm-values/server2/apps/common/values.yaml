# server2 cluster VARs
# Shared across all apps deployed on server2.
# Hard cutover, unlike the rest of stage 6: the chart emits exactly one hostname
# per route, so the .home names stop answering the moment this syncs. Covered by
# the *.server2.homelab.irha.cz and *.sandbox.server2.homelab.irha.cz SANs on server2-tls.
VAR_PUBLIC_DOMAIN: server2.homelab.irha.cz
# The cluster's own name. The ApplicationSet is a cluster x env matrix and the
# per-env values files are shared by both clusters, so this is the only thing that
# tells an app which cluster it landed on. qr-manager-ui needs it to name its
# Authentik application: the client_id is qr-manager-<cluster>-<stage>.
VAR_CLUSTER: server2
