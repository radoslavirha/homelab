# Grafana — shared base values
# Upstream: https://github.com/grafana-community/helm-charts/tree/main/charts/grafana

# Restart when grafana-admin or the influxdb2 token secrets rotate. Datasource
# tokens are read via $__file{} during provisioning, i.e. at startup only — the
# sidecar reload fires on ConfigMap changes, not on a changed secret file.
# Chart's top-level `annotations` maps to Deployment metadata, where Reloader looks.
annotations:
  reloader.stakater.com/auto: "true"

# Admin credentials supplied via ExternalSecret → grafana-admin Secret
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Persistence via Longhorn
persistence:
  enabled: true
  size: 5Gi
  storageClass: longhorn

# Sidecar watches ConfigMaps labelled grafana_datasource="1" in all namespaces
sidecar:
  datasources:
    enabled: true
    searchNamespace: ALL
  dashboards:
    enabled: true
    searchNamespace: ALL
    # The sidecar reads this annotation off each ConfigMap and files the dashboard into
    # /tmp/dashboards/<annotation value>/ instead of the flat root.
    folderAnnotation: grafana_folder
    provider:
      # Required for folderAnnotation to do anything. The chart renders provider.yaml with
      # `folder: ''` + `options.foldersFromFilesStructure: false` when this is false
      # (templates/_config.tpl), and Grafana's file provisioner then ignores subdirectories
      # entirely — the sidecar still sorts the files on disk, Grafana just files every
      # dashboard under General. Silent: nothing logs, the annotation simply has no effect.
      #
      # Turning it on drops `folder`/`folderUid` from provider.yaml, so folders come only
      # from the annotation. A ConfigMap without one lands at the path root, i.e. General.
      foldersFromFilesStructure: true

# ---------------------------------------------------------------------------
# Third-party dashboards — declared, not vendored.
#
# The chart's download-dashboards initContainer fetches each entry at pod start, so a
# dashboard costs three lines here instead of an ~80 KB JSON blob in git.
#
# `url` and `gnetId` mix freely inside one provider — the chart branches on whichever key
# an entry carries (templates/_config.tpl). Choose per dashboard:
#
#   url     preferred whenever upstream publishes the JSON in a tagged git repo. It pins to
#           a real release and picks up fixes the author never re-uploaded to grafana.com.
#           Measured for 15757: the grafana.com mirror is stuck at revision 43 (2025-02-11)
#           while dotdc v3.0.6 (2026-03-24) is two versions ahead.
#   gnetId  fallback for dashboards published only on grafana.com. Always pin `revision` —
#           the chart silently substitutes revision 1 when it is omitted.
#
# Do NOT add a `datasource:` key. Its string form seds every `"datasource":` line in the
# file; these dashboards use a `${datasource}` template variable, which resolves by itself
# against the isDefault Prometheus datasource (proven by the Loxone dashboard, whose
# datasource variable has an empty `current` and still binds).
#
# One provider per Grafana folder — `folder` is a provider-level setting, so a new folder
# means a new provider. This is independent of the sidecar's grafana_folder annotation
# above, which keeps filing the hand-built ConfigMap dashboards; both providers coexist.
#
# Accepted trade-off: download_dashboards.sh runs `set -euf` with `curl -skf`, so an
# unreachable upstream fails the initContainer and Grafana does not start. Kubernetes keeps
# retrying it, so this self-heals once the source is back — but Grafana is down until then.
# That is the price of not keeping the JSON in git.
# ---------------------------------------------------------------------------
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        # Provisioned dashboards are read-only; edit upstream and bump the ref instead.
        editable: false
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: observability
        orgId: 1
        folder: Observability
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/observability
      - name: gitops
        orgId: 1
        folder: GitOps
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/gitops

# dotdc/grafana-dashboards-kubernetes, all pinned to the same tag so the set stays coherent —
# they share template variables and cross-link by uid, so mixing versions is asking for trouble.
# Bump every url together.
#
# `title` rewrites the dashboard's own name. Upstream calls these "Kubernetes / Views / Global"
# etc., which is redundant once they are all sitting in a folder named Kubernetes, so each is
# shortened to its distinguishing word. The chart implements this as a sed anchored on a
# 1-or-2-level indent (`/^(\t|  |    )"title":/`), which in these files matches the top-level
# title and nothing else — verified 1 match against 31 "title" keys per file. Panel titles are
# indented deeper and are untouched.
#
# Deliberately omitted from the upstream set:
#   k8s-addons-trivy-operator no Trivy in this cluster.
#   k8s-addons-prometheus     not evaluated.
dashboards:
  kubernetes:
    # grafana.com id 15757. Sourced from the repo rather than the mirror — see above.
    k8s-views-global:
      title: Global
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-global.json
    # grafana.com id 15758
    k8s-views-namespaces:
      title: Namespaces
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-namespaces.json
    # grafana.com id 15760. Needs the widened node-exporter allow-list (item 0.4) for its disk
    # and load panels; node_load1 and node_disk_io_time_seconds_total are confirmed on all three.
    k8s-views-nodes:
      title: Nodes
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-nodes.json
    # grafana.com id 15759. The drill-down for restart storms and OOMKills.
    k8s-views-pods:
      title: Pods
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-pods.json
    # grafana.com id 15762. Reaches CoreDNS through annotation autodiscovery (item 0.3) —
    # kube-system/kube-dns already carries prometheus.io/scrape on :9153.
    k8s-system-coredns:
      title: CoreDNS
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-system-coredns.json
    # grafana.com id 15761. Needs clusterMetrics.apiServer, enabled in k8s-monitoring.yaml with
    # a six-name allow-list — read the cardinality note there before touching either side.
    # This dashboard reads only _count and _sum, never _bucket, which is what makes the tight
    # allow-list sufficient.
    k8s-system-api-server:
      title: API Server
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-system-api-server.json

  # No `title` overrides below, unlike the dotdc set above. Those needed shortening because
  # "Kubernetes / Views / Global" inside a folder named Kubernetes is redundant; these are
  # already namespaced sensibly by upstream, and every override is a sed that can silently
  # mis-fire on a version bump. Leave them alone.
  #
  # All five were screened against rule 7 of docs/grafana-dashboards-plan.md before adoption:
  # each declares a `cluster` template variable, none carries a ${DS_*} placeholder in a panel,
  # and none hardcodes a foreign datasource uid. Metric coverage verified by instant query.
  observability:
    # grafana/alloy alloy-mixin, tag matches the running Alloy exactly.
    #
    # NOTE the path is rendered/dashboards/, NOT dashboards/ — the latter holds .libsonnet
    # sources. download_dashboards.sh runs `set -euf` with `curl -skf`, so pointing at a
    # .libsonnet fails the initContainer and Grafana does not start at all.
    #
    # 8/8 metrics live, 7/7 queries cluster-filtered. Cleanest of the mixin set.
    alloy-resources:
      url: https://raw.githubusercontent.com/grafana/alloy/v1.18.0/operations/alloy-mixin/rendered/dashboards/alloy-resources.json
    # 6/8 metrics. alloy_component_evaluation_slow_seconds and
    # alloy_component_dependencies_wait_seconds are absent (the _bucket variant of the latter
    # is live, 546 series), so two panels stay thin. Everything else resolves.
    alloy-controller:
      url: https://raw.githubusercontent.com/grafana/alloy/v1.18.0/operations/alloy-mixin/rendered/dashboards/alloy-controller.json
    # THE dashboard that answers "is server1/server2 exporting anything at all". Their entire
    # egress is otelcol.exporter.otlp, so the remote-write mixin dashboard cannot see them —
    # prometheus_remote_storage_* only exists on server3.
    #
    # Needs item 0.10: before that allow-list widening this was 6/15 otelcol metrics, now 12/15.
    # The 3 still missing are otelcol_exporter_send_failed_{spans,metric_points,log_records}_total,
    # which OTel only creates on first increment — those panels are blank because nothing has
    # failed, and will fill the moment something does. That is the intended behaviour.
    #
    # Known gap: ~4 http/rpc panels query *_duration_milliseconds_bucket. The live series are
    # *_request_duration_seconds_bucket (OTel semantic-convention rename) and are present on all
    # three clusters. Fixing it means vendoring the JSON, so it is accepted as-is for now.
    alloy-opentelemetry:
      url: https://raw.githubusercontent.com/grafana/alloy/v1.18.0/operations/alloy-mixin/rendered/dashboards/alloy-opentelemetry.json
    # grafana/loki mixin, tag matches the running Loki. 106/106 queries cluster-filtered.
    #
    # EXPECT DEAD PANELS, by design rather than by mistake. The mixin targets a microservices
    # Loki (distributor / ingester / querier / ruler as separate deployments); this is a
    # single-binary install, so every panel scoped to a component job is empty —
    # loki_request_duration_seconds_count here carries job="monitoring/single-binary".
    # Roughly 19 of 38 referenced metrics are absent, all of them object-store and KV families
    # this deployment does not use: loki_s3_*, loki_gcs_*, loki_dynamo_*, loki_azure_blob_*,
    # loki_bigtable_*, loki_consul_*, loki_boltdb_shipper_*.
    #
    # What does work is the part worth having: loki_request_duration_seconds_bucket (390
    # series), loki_distributor_{bytes,lines}_received_total, and the loki_ingester_* set
    # (memory_streams, streams_created_total, chunks_flushed_total, chunk_utilization_bucket).
    # Ingest rate, error rate and chunk behaviour all populate.
    loki-operational:
      url: https://raw.githubusercontent.com/grafana/loki/v3.7.1/production/loki-mixin-compiled/dashboards/loki-operational.json

  gitops:
    # argoproj/argo-cd at the tag matching the deployed chart's appVersion (chart 9.5.2).
    # Deliberately NOT grafana.com 14584: that is still on revision 1 dated 2021-06-14, and its
    # Prometheus panels carry datasource "-- Grafana --", which is simply wrong. 20/20 metrics.
    #
    # Its `cluster` variable is label_values(argocd_cluster_info, server) — ArgoCD's DESTINATION
    # server, not the Prometheus cluster label, so only 12 of 42 queries filter on it. That is
    # correct here rather than a gap: ArgoCD runs on server3 only (argocd_app_info is 67 series,
    # all cluster="server3"), so there is nothing to sum across, and the variable still gives the
    # three-way split because ArgoCD manages all three clusters from one place.
    argocd:
      url: https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.7/examples/dashboard.json

  # NO Cilium provider yet, deliberately. hubble-network-overview-namespace.json passed every
  # check that looks at metric NAMES — 4/4 present, 8/8 queries cluster-filtered, no ${DS_*}
  # problem — and is still 0/8 useful panels, because every query filters on
  # source_namespace / destination_namespace and those LABELS do not exist here:
  #
  #   hubble_flows_processed_total{cluster, instance, job, k8s_cluster_name, namespace,
  #                                protocol, service, subtype, type, verdict}
  #
  # Hubble only emits source/destination identity when the metric handler is given context
  # options. iac/clusters/helm-values/cilium.yaml enables the bare handler names
  # (`dns drop tcp flow icmp http`), so the counters are aggregate-only. The fix is a Cilium
  # values change, applied per cluster with Terraform, not a dashboard change:
  #
  #   hubble:
  #     metrics:
  #       enabled:
  #         - flow:sourceContext=namespace;destinationContext=namespace
  #         - drop:sourceContext=namespace;destinationContext=namespace
  #         - tcp:sourceContext=namespace;destinationContext=namespace
  #         - icmp:sourceContext=namespace;destinationContext=namespace
  #
  # Weigh the cardinality first: context labels turn a handful of aggregate series into
  # roughly namespace x namespace per handler. See item 2.2 of docs/grafana-dashboards-plan.md.
