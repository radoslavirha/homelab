# k8s-monitoring — server1 cluster overrides
# Upstream values.yaml: https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/values.yaml
cluster:
  name: server1

# Keep Alloy's storage, including the log tail positions, across container replacements.
# The default /tmp/alloy lives in the container's writable layer, so every replacement forgets
# where each log file was. server1 only: hook Jobs run here, and a Job's first seconds of output
# are lost while podLogsViaLoki.onlyGatherNewLogLines is true. Turning that off is only safe once
# positions persist, otherwise each Alloy replacement re-reads every log on the node.
#
# hostPath has no `type` on purpose. Talos runs the kubelet in its own mount namespace with no view
# of /var/lib/alloy, so a type check would run against the wrong filesystem. With no type, containerd
# creates the directory on the host, as it did for /var/lib/docker/containers in this DaemonSet.
collectors:
  alloy-receiver:
    alloy:
      storagePath: /var/lib/alloy
      mounts:
        extra:
          - name: alloy-storage
            mountPath: /var/lib/alloy
    controller:
      volumes:
        extra:
          - name: alloy-storage
            hostPath:
              path: /var/lib/alloy

# Read a log file from its start when Alloy has no position for it. The default (true) seeks to the
# end, so a new pod loses whatever it wrote before the tailer opened the file, up to about 5 s: all
# of a fast hook Job's output, and the error of a container that fails at startup.
# Depends on the persistent storage above. Without it, every Alloy replacement re-reads every log.
podLogsViaLoki:
  onlyGatherNewLogLines: false

destinations:
  server3:
    type: otlp
    # TLS. Traefik terminates against server3-tls on the otlp-grpc entrypoint and
    # forwards plaintext h2c to alloy-receiver inside the cluster.
    #
    # No scheme: Alloy's OTLP gRPC exporter takes host:port, and whether TLS is used is
    # decided by the tls block below, not by the URL.
    url: otel.server3.homelab.irha.cz:4317
    protocol: grpc
    tls:
      # Verified against the public chain — the Alloy image carries the system roots and
      # the certificate is a real Let's Encrypt one, so no ca_pem and no skip-verify.
      insecure: false
    metrics:
      enabled: true
    logs:
      enabled: true
    traces:
      enabled: true
    # STILL NO auth block, and the reason has changed. The old blocker was the plaintext
    # channel: gRPC refuses to attach per-RPC credentials to one. That is gone now.
    #
    # The remaining blocker is the receiving end. server3's alloy-receiver has never
    # validated a bearer token — k8s-monitoring exposes no server-side OTLP auth — so
    # sending one would authenticate nothing and only look like it did.
    #
    # Real authentication here means mTLS: a Traefik TLSOption with clientAuth against an
    # internal CA, and a client certificate for each cluster's Alloy (the destination
    # supports tls.cert/tls.key). Tracked as step 9.2 in the TLS spec. The otel-auth-token
    # ExternalSecret stays in place for whichever approach wins.
