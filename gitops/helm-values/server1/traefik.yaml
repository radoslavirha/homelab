# Traefik — server1 cluster overrides
# Shared base values: gitops/helm-values/traefik.yaml

ingressRoute:
  dashboard:
    enabled: true
    matchRule: "Host(`traefik.server1.homelab.irha.cz`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
    # Forward-auth. Everything this route serves — the dashboard AND /api, which lists every
    # router, service and middleware in the cluster — now goes past Authentik first. The
    # Middleware is k8s-manifests/server1/traefik/Middleware.authentik.yaml, in this same
    # namespace; the login callback for this host is its own HTTPRoute next to it, because
    # matchRule above covers only /dashboard and /api.
    middlewares:
      - name: authentik
        namespace: traefik
    # websecure only. The one hostname this route answers to is covered by the cluster
    # certificate, so there is nothing left for `web` to serve — the .home name it existed
    # for was retired at stage 7.
    entryPoints: [websecure]
    tls:
      # An IngressRoute is served by the kubernetesCRD provider, which does not see
      # the Gateway listener's certificateRefs. Without this Traefik answers with its
      # built-in self-signed certificate and the browser warns.
      secretName: server1-tls
    annotations:
      external-dns.alpha.kubernetes.io/target: "192.168.1.200"


# HTTPS Gateway listener. Per cluster because certificateRefs names a cluster-specific
# Secret. See gitops/helm-values/server3/traefik.yaml for the full reasoning — including
# why there is deliberately no 80 -> 443 redirect yet (stage 7.5, after OTLP moves).
gateway:
  listeners:
    websecure:
      port: 443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - name: server1-tls

service:
  # type: ClusterIP is in the shared values file; only the address is per cluster.
  spec:
    externalIPs:
      - 192.168.1.200

providers:
  kubernetesGateway:
    statusAddress:
      ip: "192.168.1.200"

ports:
  # ── Whose X-Forwarded-* does this cluster believe? ──────────────────────────
  # PER-CLUSTER ON PURPOSE, exactly like server3's copy. The shared
  # gitops/helm-values/traefik.yaml leaves this unset -- "trust nobody" -- and
  # server2 DEPENDS on that: its Ollama ipAllowList middleware documents that it
  # works precisely because no entrypoint trusts forwarded headers. A shared
  # setting would let any pod there forge a client IP past that allow-list.
  #
  # server1 needs it because cloudflared runs here too (tunnel
  # bcd33540-dbb9-4a5d-a419-f60626a44fce, for mealie.irha.cz). cloudflared dials
  # out from INSIDE the cluster, so the peer Traefik sees for public traffic is
  # its POD -- never Cloudflare's edge addresses, which is the usual wrong guess.
  # Headers from cloudflared are then believed; headers from anything on the LAN
  # are still overwritten, so LAN attribution does not change.
  #
  # TRADE: every pod on this cluster shares this CIDR and could forge
  # X-Forwarded-For toward Traefik. Accepted -- pinning cloudflared's pod IPs
  # breaks on every reschedule. server1 runs no ipAllowList that this would
  # weaken; if one is ever added here, revisit this line first.
  #
  # NEVER `insecure: true`: that trusts forged headers from anyone.
  #
  # Measured 2026-09-22: server1 node podCIDR is 10.244.0.0/24; the /16 covers a
  # second node without another edit.
  websecure:
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16

  udp-miot-prod:
    port: 4000
    protocol: UDP
    # hostNetwork: true — traffic goes directly to Traefik on the host.
    # Exposing via the Service causes kube-proxy to DNAT+SNAT packets,
    # masquerading the client source IP and breaking UDP response routing.
    expose:
      default: false
  udp-miot-sbx:
    port: 4001
    protocol: UDP
    expose:
      default: false
  mqtt:
    port: 1883
    protocol: TCP
    expose:
      default: true
    exposedPort: 1883
  # MQTT over TLS, alongside 1883 rather than replacing it. Terminated at Traefik against
  # the cluster certificate; EMQX keeps listening plaintext behind it.
  #
  # Both stay open deliberately. A TLS client must send SNI for the route to match, and it
  # is not yet established that the Loxone Miniserver and the ESP32 devices can do MQTT over
  # TLS at all — several ESPHome/Arduino MQTT clients cannot, or cannot send SNI. Closing
  # 1883 before that is known would take the IoT estate offline.
  mqtts:
    port: 8883
    protocol: TCP
    expose:
      default: true
    exposedPort: 8883
  mongodb:
    port: 27017
    protocol: TCP
    expose:
      default: true
    exposedPort: 27017