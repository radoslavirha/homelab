# Traefik — server1 cluster overrides
# Shared base values: gitops/helm-values/traefik.yaml

ingressRoute:
  dashboard:
    enabled: true
    matchRule: "Host(`traefik.server1.homelab.irha.cz`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
    # websecure only. The one hostname this route answers to is covered by the cluster
    # certificate, so there is nothing left for `web` to serve — the .home name it existed
    # for was retired at stage 7.
    entryPoints: [websecure]
    tls:
      # An IngressRoute is served by the kubernetesCRD provider, which does not see
      # the Gateway listener's certificateRefs. Without this Traefik answers with its
      # built-in self-signed certificate and the browser warns.
      secretName: server1-tls
    annotations:
      external-dns.alpha.kubernetes.io/target: "192.168.1.200"


# HTTPS Gateway listener. Per cluster because certificateRefs names a cluster-specific
# Secret. See gitops/helm-values/server3/traefik.yaml for the full reasoning — including
# why there is deliberately no 80 -> 443 redirect yet (stage 7.5, after OTLP moves).
gateway:
  listeners:
    websecure:
      port: 443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - name: server1-tls

service:
  externalIPs:
    - 192.168.1.200

providers:
  kubernetesGateway:
    statusAddress:
      ip: "192.168.1.200"

ports:
  udp-miot-prod:
    port: 4000
    protocol: UDP
    # hostNetwork: true — traffic goes directly to Traefik on the host.
    # Exposing via the Service causes kube-proxy to DNAT+SNAT packets,
    # masquerading the client source IP and breaking UDP response routing.
    expose:
      default: false
  udp-miot-sbx:
    port: 4001
    protocol: UDP
    expose:
      default: false
  mqtt:
    port: 1883
    protocol: TCP
    expose:
      default: true
    exposedPort: 1883
  # MQTT over TLS, alongside 1883 rather than replacing it. Terminated at Traefik against
  # the cluster certificate; EMQX keeps listening plaintext behind it.
  #
  # Both stay open deliberately. A TLS client must send SNI for the route to match, and it
  # is not yet established that the Loxone Miniserver and the ESP32 devices can do MQTT over
  # TLS at all — several ESPHome/Arduino MQTT clients cannot, or cannot send SNI. Closing
  # 1883 before that is known would take the IoT estate offline.
  mqtts:
    port: 8883
    protocol: TCP
    expose:
      default: true
    exposedPort: 8883
  mongodb:
    port: 27017
    protocol: TCP
    expose:
      default: true
    exposedPort: 27017