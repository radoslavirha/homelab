# qr-manager-ui — sandbox overrides
#
# Probes, lifecycle, strategy and templates.config.validate live in base.yaml — they were
# staged here first and promoted once a sandbox rollout had been watched.

apps:
  qr-manager-ui:
    image:
      tag: "0.13.1"
    templates:
      config:
        # The auth block is templated, not spelled out. The ApplicationSet is a
        # cluster x env matrix and this file is shared by every cluster in it, so a
        # literal client_id here would hand a second cluster server1's Authentik application
        # and a redirect URI for a host it is not served on — a Redirect URI Error at
        # /authorize, on the cluster nobody was looking at.
        #
        # The auth design doc says "spelled out, never derived", and that rule stands:
        # it forbids deriving the redirect URI from window.location IN THE BROWSER,
        # where it can disagree with what the IdP registered. This is deploy-time Jinja
        # over the same VAR_* that produce the HTTPRoute hostname, so the redirect URI
        # cannot drift from the host the app is actually served on. apiBaseURL directly
        # above already works this way.
        #
        # NAMESPACE is the release namespace, which is the stage. VAR_CLUSTER is set by
        # the ApplicationSet generator (helm.parameters). Renders to:
        #   qr-manager-server1-sandbox @ apps.sandbox.server1.homelab.irha.cz
        content: |
          {
              "apiBaseURL": "{{ VAR_PROTOCOL }}://api.{{ VAR_SUBDOMAIN }}.{{ VAR_PUBLIC_DOMAIN }}/iot/qr-manager",
              "basePath": "/qr-manager",
              "auth": {
                  "issuer": "https://auth.irha.cz/application/o/qr-manager-{{ VAR_CLUSTER }}-{{ NAMESPACE }}/",
                  "clientId": "qr-manager-{{ VAR_CLUSTER }}-{{ NAMESPACE }}",
                  "scope": "openid profile email roles",
                  "redirectUri": "{{ VAR_PROTOCOL }}://{{ COMPONENT }}.{{ VAR_SUBDOMAIN }}.{{ VAR_PUBLIC_DOMAIN }}/{{ PATH_NAME }}/callback",
                  "postLogoutRedirectUri": "{{ VAR_PROTOCOL }}://{{ COMPONENT }}.{{ VAR_SUBDOMAIN }}.{{ VAR_PUBLIC_DOMAIN }}/{{ PATH_NAME }}/"
              }
          }
