# qr-manager-ui — sandbox overrides
# Template variables: .vars.* from ../vars/common.yaml + ../vars/sandbox.yaml, chart built-ins
# .app.* (name, group, component, pathName, containerPort, namespace, host).
#
# Probes, lifecycle, strategy and templates.config.validate live in values.yaml — they were
# staged here first and promoted once a sandbox rollout had been watched.

image:
  tag: "0.13.1"
templates:
  config:
    # The auth block is templated, not spelled out. The ApplicationSet is a
    # cluster x env matrix and this file is shared by every cluster in it, so a
    # literal client_id here would hand a second cluster server1's Authentik application
    # and a redirect URI for a host it is not served on — a Redirect URI Error at
    # /authorize, on the cluster nobody was looking at.
    #
    # The auth design doc says "spelled out, never derived", and that rule stands:
    # it forbids deriving the redirect URI from window.location IN THE BROWSER,
    # where it can disagree with what the IdP registered. This is deploy-time templating:
    # .app.host is the hostname the chart gives this app's HTTPRoute, so the redirect
    # URI cannot drift from the host the app is actually served on.
    #
    # .app.namespace is the release namespace, which is the stage; .vars.cluster is in
    # ../vars/sandbox.yaml. Renders to:
    #   qr-manager-server1-sandbox @ apps.sandbox.server1.homelab.irha.cz
    content: |
      {
          "apiBaseURL": "{{ .vars.protocol }}://api.{{ .vars.domain }}/iot/qr-manager",
          "basePath": "/qr-manager",
          "auth": {
              "issuer": "https://auth.irha.cz/application/o/qr-manager-{{ .vars.cluster }}-{{ .app.namespace }}/",
              "clientId": "qr-manager-{{ .vars.cluster }}-{{ .app.namespace }}",
              "scope": "openid profile email roles",
              "redirectUri": "{{ .vars.protocol }}://{{ .app.host }}/{{ .app.pathName }}/callback",
              "postLogoutRedirectUri": "{{ .vars.protocol }}://{{ .app.host }}/{{ .app.pathName }}/"
          }
      }
