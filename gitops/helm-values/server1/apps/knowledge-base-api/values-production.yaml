# knowledge-base-api — production overrides
# Template variables: .vars.* from ../vars/common.yaml + ../vars/production.yaml, chart built-ins
# .app.* (name, group, component, pathName, containerPort, namespace, host), and .secrets.* from
# secrets: below.
#
# publicURL is the Swagger UI's server URL: without it the UI fetches its spec from the host
# root and "Try it out" drops the /kb/knowledge-base prefix.
#
# The repository to index is never named here. The GitHub App's installation says which
# repository it covers, and the service asks it at runtime.
#
# Embedding templates use single braces ({title}, {text}, {query}): the app fills them in,
# and Go templates leave them alone. Changing a template or a model changes every vector —
# add a new entry under embeddings.models instead of editing this one.

# Placeholder until the first release: the homelab-apps release workflow rewrites it.
image:
  tag: "0.3.0"
templates:
  config:
    # Read from OpenBao by the chart's ExternalSecret; the template reads .secrets.<name>.
    secrets:
      # Generated by ESO, never seeded: the postgres namespace's PushSecret wrote it, and the
      # DatabaseRole reads the same key (gitops/k8s-manifests/server1/postgres/).
      databasePassword:
        key: server1/postgres/knowledge-base
        property: password
      # Seeded by hand before the first sync — docs/secrets.md.
      githubClientId:
        key: server1/production/knowledge-base-api-github
        property: github-client-id
      githubPrivateKey:
        key: server1/production/knowledge-base-api-github
        property: github-private-key
    # The password and the PEM go in through toJson, unquoted: it escapes the key's newlines
    # (and any character JSON would choke on) and adds the quotes itself.
    content: |
      {
          "serviceName": "{{ .app.name }}",
          "server": {
              "httpPort": {{ .app.containerPort }}
          },
          "publicURL": "{{ .vars.protocol }}://{{ .app.host }}/{{ .app.pathName }}",
          "externalApis": {
              "OLLAMA": {
                  "baseURL": "https://ollama.server2.homelab.irha.cz",
                  "resilience": {
                      "timeout": {
                          "ms": 60000
                      },
                      "retry": {
                          "count": 1,
                          "backoffMs": 1000
                      },
                      "circuitBreaker": {}
                  },
                  "retriableStatusCodes": [500, 502, 503, 504, 408]
              },
              "OLLAMA_SEARCH": {
                  "baseURL": "https://ollama.server2.homelab.irha.cz",
                  "resilience": {
                      "timeout": {
                          "ms": 5000
                      },
                      "circuitBreaker": {}
                  },
                  "retriableStatusCodes": [500, 502, 503, 504, 408]
              }
          },
          "database": {
              "host": "{{ .vars.postgres.host }}",
              "port": {{ .vars.postgres.port }},
              "database": "knowledge_base",
              "user": "knowledge_base",
              "password": {{ .secrets.databasePassword | toJson }},
              "sslMode": "REQUIRE"
          },
          "github": {
              "clientId": {{ .secrets.githubClientId | toJson }},
              "privateKey": {
                  "source": "value",
                  "value": {{ .secrets.githubPrivateKey | toJson }}
              }
          },
          "embeddings": {
              "models": [
                  {
                      "name": "embeddinggemma:300m",
                      "dimensions": 768,
                      "documentTemplate": "title: {title} | text: {text}",
                      "queryTemplate": "task: search result | query: {query}"
                  }
              ]
          },
          "knowledgeBases": [
              {
                  "id": "development",
                  "source": "GIT",
                  "tsConfig": "english",
                  "models": ["embeddinggemma:300m"],
                  "readers": ["knowledge-base-api.reader"]
              }
          ],
          "indexer": {
              "enabled": true,
              "intervalMs": 300000
          },
          "auth": {
              "IDP": {
                  "type": "bearer-jwt",
                  "trustedIssuers": [
                      {
                          "name": "knowledge-base-mcp",
                          "issuer": "https://auth.irha.cz/application/o/knowledge-base-mcp/",
                          "audience": "knowledge-base-api-{{ .vars.cluster }}-{{ .app.namespace }}",
                          "subjectKind": "service",
                          "key": {
                              "source": "jwks",
                              "uri": "https://auth.irha.cz/application/o/knowledge-base-mcp/jwks/"
                          }
                      },
                      {
                          "name": "postman",
                          "issuer": "https://auth.irha.cz/application/o/postman/",
                          "audience": "knowledge-base-api-{{ .vars.cluster }}-{{ .app.namespace }}",
                          "subjectKind": "human",
                          "key": {
                              "source": "jwks",
                              "uri": "https://auth.irha.cz/application/o/postman/jwks/"
                          }
                      }
                  ]
              }
          },
          "logger": {
              "enabled": true,
              "level": "info"
          },
          "otel": {
              "metrics": {
                  "enabled": true,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                  }
              },
              "traces": {
                  "enabled": true,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                  }
              },
              "logs": {
                  "enabled": false,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                  }
              }
          }
      }
