# interactive-map-feeder-api — sandbox overrides
# Template variables: .vars.* from ../vars/common.yaml + ../vars/sandbox.yaml, chart built-ins
# .app.* (name, group, component, pathName, containerPort, namespace, host).
#
# Probes, lifecycle and strategy live in values.yaml — they were staged here first and
# promoted once a sandbox rollout had been watched.

image:
  tag: "0.15.0"
templates:
  config:
    content: |
      {
          "serviceName": "{{ .app.name }}",
          "server": {
              "httpPort": {{ .app.containerPort }}
          },
          "publicURL": "{{ .vars.protocol }}://{{ .app.host }}/{{ .app.pathName }}",
          "externalApis": {
              "CHMI_PORTAL": {
                  "baseURL": "https://produkty.chmi.cz",
                  "resilience": {
                      "timeout": {
                          "ms": 10000
                      },
                      "retry": {
                          "count": 2,
                          "backoffMs": 500
                      },
                      "circuitBreaker": {}
                  },
                  "logging": {
                      "enabled": true,
                      "stack": false
                  },
                  "retriableStatusCodes": [500, 502, 503, 504, 429, 408]
              },
              "CHMI_OPENDATA": {
                  "baseURL": "https://opendata.chmi.cz",
                  "resilience": {
                      "timeout": {
                          "ms": 10000
                      },
                      "retry": {
                          "count": 2,
                          "backoffMs": 500
                      },
                      "circuitBreaker": {}
                  },
                  "logging": {
                      "enabled": true,
                      "stack": false
                  },
                  "retriableStatusCodes": [500, 502, 503, 504, 429, 408]
              }
          },
          "auth": {
              "IDP": {
                  "type": "bearer-jwt",
                  "trustedIssuers": [
                      {
                          "name": "idp",
                          "issuer": "https://auth.irha.cz/application/o/interactive-map-feeder-{{ .vars.cluster }}-{{ .app.namespace }}/",
                          "audience": "interactive-map-feeder-{{ .vars.cluster }}-{{ .app.namespace }}",
                          "subjectKind": "human",
                          "key": {
                              "source": "jwks",
                              "uri": "https://auth.irha.cz/application/o/interactive-map-feeder-{{ .vars.cluster }}-{{ .app.namespace }}/jwks/"
                          }
                      },
                      {
                          "name": "postman",
                          "issuer": "https://auth.irha.cz/application/o/postman/",
                          "audience": "interactive-map-feeder-{{ .vars.cluster }}-{{ .app.namespace }}",
                          "subjectKind": "human",
                          "key": {
                              "source": "jwks",
                              "uri": "https://auth.irha.cz/application/o/postman/jwks/"
                          }
                      }
                  ]
              }
          },
          "logger": {
              "enabled": true,
              "level": "info"
          },
          "otel": {
              "debug": false,
              "metrics": {
                  "enabled": true,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                  }
              },
              "traces": {
                  "enabled": true,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                  }
              },
              "logs": {
                  "enabled": false,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                  }
              }
          }
      }
