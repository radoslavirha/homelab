# qr-manager-api — production overrides
# Template variables: .vars.* from ../vars/common.yaml + ../vars/production.yaml, chart built-ins
# .app.* (name, group, component, pathName, containerPort, namespace, host), and .secrets.* from secrets: below.
#
# redirect.baseURL has no path and must keep none. The app serves the redirect at /r/:slug,
# and the /r is supplied by the addPrefix middleware on the qr.irha.cz HTTPRoute
# (gitops/k8s-manifests/server1/qr-manager-api/production/Middleware.addprefix-qr.yaml, which
# explains the whole arrangement). Putting /r here as well would double it and break every
# printed label.

image:
  tag: "0.9.0"
templates:
  config:
    # Read from OpenBao by the chart's ExternalSecret; the template reads .secrets.<name>.
    secrets:
      mongodbDatabase:
        key: server1/production/qr-manager-api-mongodb
        property: mongodb-database
      mongodbUsername:
        key: server1/production/qr-manager-api-mongodb
        property: mongodb-username
      mongodbPassword:
        key: server1/production/qr-manager-api-mongodb
        property: mongodb-password
    content: |
      {
          "serviceName": "{{ .app.name }}",
          "server": {
              "httpPort": {{ .app.containerPort }}
          },
          "redirect": {
              "baseURL": "https://qr.irha.cz"
          },
          "mongodb": {
              "enabled": true,
              "url": "{{ .vars.mongodb.url }}/{{ .secrets.mongodbDatabase }}",
              "connectionOptions": {
                  "user": "{{ .secrets.mongodbUsername }}",
                  "pass": "{{ .secrets.mongodbPassword }}"
              }
          },
          "auth": {
              "IDP": {
                  "type": "bearer-jwt",
                  "trustedIssuers": [
                      {
                          "name": "idp",
                          "issuer": "https://auth.irha.cz/application/o/qr-manager-{{ .vars.cluster }}-{{ .app.namespace }}/",
                          "audience": "qr-manager-{{ .vars.cluster }}-{{ .app.namespace }}",
                          "subjectKind": "human",
                          "key": {
                              "source": "jwks",
                              "uri": "https://auth.irha.cz/application/o/qr-manager-{{ .vars.cluster }}-{{ .app.namespace }}/jwks/"
                          }
                      },
                      {
                          "name": "postman",
                          "issuer": "https://auth.irha.cz/application/o/postman/",
                          "audience": "qr-manager-{{ .vars.cluster }}-{{ .app.namespace }}",
                          "subjectKind": "human",
                          "key": {
                              "source": "jwks",
                              "uri": "https://auth.irha.cz/application/o/postman/jwks/"
                          }
                      }
                  ]
              }
          },
          "logger": {
              "enabled": true,
              "level": "info"
          },
          "otel": {
              "metrics": {
                  "enabled": true,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                  }
              },
              "traces": {
                  "enabled": true,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                  }
              },
              "logs": {
                  "enabled": false,
                  "exporter": {
                      "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                  }
              }
          }
      }
