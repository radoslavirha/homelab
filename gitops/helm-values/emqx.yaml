# EMQX — shared Helm values
# Upstream values.yaml: https://github.com/emqx/emqx/blob/master/deploy/charts/emqx/values.yaml
# Cluster-specific overrides: gitops/helm-values/<cluster>/emqx.yaml
# Per-cluster k8s manifests (HTTPRoute, IngressRouteTCP, ExternalSecret): gitops/k8s-manifests/<cluster>/emqx/

replicaCount: 1

# Dashboard and API credentials come from OpenBao via ESO.
# Store before first sync: bao kv put secret/<cluster>/emqx dashboard-username=<user> dashboard-password=<pass>
envFromSecret: "emqx-credentials"

service:
  type: ClusterIP

ingress:
  enabled: false

persistence:
  enabled: true
  storageClass: "longhorn"

# emqxConfig renders to the `emqx-env` ConfigMap, consumed via envFrom — and a
# ConfigMap edit alone never changes the pod template, so the StatefulSet does not
# roll and the running broker keeps its boot-time env. ArgoCD still reports Synced,
# which is how the OTel settings below sat unapplied for a full day. This adds the
# chart's checksum/config pod annotation so any emqxConfig change rolls the pod.
#
# Deliberately not Reloader: its `auto` annotation would also watch the
# emqx-credentials Secret, and emqx is excluded from Reloader on purpose because
# that Secret only bootstraps the dashboard user into mnesia on first boot
# (docs/superpowers/plans/2026-08-05-stakater-reloader.md). The chart checksums
# configmap.yaml only, and the Secret is an ExternalSecret outside the chart, so
# credential rotation still cannot trigger a restart.
recreatePods: true

emqxConfig:
  # --- Topic ACLs -----------------------------------------------------------
  # Rules live on each user in gitops/helm-values/<cluster>/provisioner/emqx.yaml and
  # are written to the built_in_database authorization source by the EMQX provisioner
  # Job — the same backend that holds the accounts. That Job also deletes the stock
  # `file` source, whose shipped acl.conf ends `{allow, all}.` and would make the flip
  # below a no-op. Only the switch itself lives here: it is a scalar, so it survives
  # the envFrom ConfigMap shape a multi-line acl.conf never could.
  #
  # UNCOMMENT ONLY AFTER THE AUDIT BELOW IS CLEAN. Flipping this with a missing rule
  # silently stops a client publishing while it stays connected and looks healthy.
  # recreatePods: true above means this change does roll the broker.
  # EMQX_AUTHORIZATION__NO_MATCH: deny
  #
  # --- Audit before flipping -------------------------------------------------
  # `$events/client_check_authz_complete` exists in this open-source 5.8.9 build and
  # reports every authorization decision, including `authz_source` — empty when no
  # rule matched and the no_match default decided it. While no_match is still `allow`,
  # those are exactly the checks that `deny` would break.
  #
  # Enable temporarily, watch `iot/_authz_audit` with MQTT Explorer through a full
  # cycle of real traffic (a vacuum run, a command from Loxone, a telegraf write),
  # then comment it out again and flip no_match.
  #
  # EMQX_rule_engine__rules__AUTHZ_AUDIT:
  #   enable: true
  #   description: "Temporary: republish every authorization check so the checks that would be denied under no_match=deny can be observed before flipping it."
  #   sql: |-
  #     SELECT
  #       clientid, username, topic, action, result, authz_source
  #     FROM
  #       "$events/client_check_authz_complete"
  #   actions:
  #     - function: "republish"
  #       args:
  #         topic: "iot/_authz_audit"
  #         direct_dispatch: false
  #         qos: 0
  #         retain: false
  #         payload: |-
  #           ${username} ${action} ${topic} -> ${result} (source=${authz_source})
  #         mqtt_properties:
  #           Content-Type: "text/plain"
  #           Payload-Format-Indicator: "true"
  #
  # Do not add EMQX_OPENTELEMETRY__* here. OpenTelemetry in EMQX is **Enterprise-only
  # as of 5.8.3** — confirmed by an EMQX maintainer:
  # https://github.com/emqx/emqx/issues/14395#issuecomment-2550653939
  #
  # 5.8.3 is also the release the docs credit with introducing end-to-end tracing, so
  # "EMQX 5.8.3+ supports e2e tracing" is true *and* Enterprise-scoped — the same
  # version added the feature and put it behind the licence. Every OTel page upstream
  # lives in the EE configuration manual. This image is emqx/emqx, the open-source
  # build, where the `opentelemetry` config root does not exist:
  # the vars are set in the container but the broker never maps them (they are absent
  # from the "env var -> config path" boot log), and `emqx ctl conf show opentelemetry`
  # returns key_not_found. It fails silently — no warning, no error.
  #
  # MQTT tracing is instead done client-side: the shared mqtt module in the apps repo
  # injects/extracts W3C traceparent over MQTT 5 user properties and emits the
  # PRODUCER/CONSUMER spans. That covers app-to-app correlation through the broker;
  # only EMQX's own internal spans are missing, and those are what the licence buys.
  EMQX_rule_engine__rules__LOXONE_MIOT_NOTIFICATION:
    enable: true
    description: "Rule to accept JSON payload from MiOT Bridge and republish each property as a separate message with deviceId in text/plain format. First line is deviceId from topic, second line is property=value from JSON payload."
    sql: |-
      FOREACH
        jq('to_entries[] | {k: .key, v: (.value | tostring)}', payload) as item
      DO
        nth(4, tokens(topic, '/')) as deviceId,
        item.k as property,
        item.v as value
      FROM "iot/miot-bridge/device/+/notifications"
    actions:
      - function: "republish"
        args:
          topic: "iot/miot-bridge/devices/notifications"
          direct_dispatch: false
          qos: 1
          retain: false
          payload: |-
            deviceId=${deviceId}
            ${property}=${value}
          mqtt_properties:
            Content-Type: "text/plain"
            Payload-Format-Indicator: "true"
