# miot-bridge-api — sandbox overrides
# Cluster-specific VAR_* (VAR_PUBLIC_DOMAIN, VAR_SUBDOMAIN, VAR_MQTT_URL, etc.) are in server2/apps/common/sandbox.yaml
#
# Probes, lifecycle and strategy live in base.yaml — they were staged here first and
# promoted once a sandbox rollout had been watched.
# See docs/superpowers/plans/2026-08-06-iot-app-health-checks-homelab.md

apps:
  miot-bridge-api:
    image:
      tag: "0.23.2"
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": {{ CONTAINER_PORT }}
              },
              "publicURL": "{{ VAR_PROTOCOL }}://{{ COMPONENT }}.{{ VAR_SUBDOMAIN }}.{{ VAR_PUBLIC_DOMAIN }}/{{ PATH_NAME }}",
              "cachePath": "./cache",
              "mqtt": {
                  "enabled": true,
                  "url": "{{ VAR_MQTT_URL }}",
                  "clientId": "miot-bridge-api-sandbox",
                  "username": "{{ SECRET_MQTT_MIOT_BRIDGE_USERNAME }}",
                  "password": "{{ SECRET_MQTT_MIOT_BRIDGE_PASSWORD }}",
                  "topicPrefix": "{{ APPLICATION_GROUP }}/{{ NAMESPACE }}/",
                  "notifications": {
                      "enabled": true
                  }
              },
              "polling": {
                  "enabled": true,
                  "intervalMs": 5000,
                  "dispatchOnChange": true,
                  "maxErrorCount": 3,
                  "errorSkipCycles": 20
              },
              "mongodb": {
                  "enabled": true,
                  "url": "{{ VAR_MONGODB_URL }}/{{ SECRET_MONGODB_DATABASE }}",
                  "connectionOptions": {
                      "user": "{{ SECRET_MONGODB_USERNAME }}",
                      "pass": "{{ SECRET_MONGODB_PASSWORD }}"
                  }
              },
              "externalApis": {
                  "MIOT_SPEC": {
                      "baseURL": "https://miot-spec.org/miot-spec-v2",
                      "resilience": {
                          "timeout": {
                              "ms": 10000
                          },
                          "retry": {
                              "count": 2,
                              "backoffMs": 500
                          },
                          "circuitBreaker": {}
                      },
                      "logging": {
                          "enabled": true,
                          "stack": false
                      },
                      "retriableStatusCodes": [500, 502, 503, 504, 429, 408]
                  }
              },
              "logger": {
                  "enabled": true,
                  "level": "info"
              },
              "otel": {
                  "debug": false,
                  "metrics": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                      }
                  },
                  "traces": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                      }
                  },
                  "logs": {
                      "enabled": false,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                      }
                  }
              }
          }
