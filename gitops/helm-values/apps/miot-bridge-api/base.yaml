# miot-bridge-api — shared base values
# Env-specific: replicas, templates.config.content, VAR_* → production.yaml / sandbox.yaml

apps:
  miot-bridge-api:
    # Restart on change of the MQTT/MongoDB ExternalSecrets (envFrom + Jinja2 init env)
    # and of the generated config ConfigMap. Both are read once, at pod start.
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/radoslavirha/miot-bridge-api
      tag: "0.17.0"
      pullPolicy: Always
    replicas: 1
    serviceAccount:
      create: true
      # No ambient token: automount would give every pod a long-lived,
      # full-audience one. projectedToken below is the explicit, scoped,
      # short-lived replacement.
      automountServiceAccountToken: false
      # Mounts a default-audience token + the cluster CA at
      # /var/run/secrets/kubernetes.io/serviceaccount, which is what lets this
      # service verify cluster-issued ServiceAccount tokens (JWKS fetch from
      # kubernetes.default.svc). Both files are needed: without ca.crt the TLS
      # handshake fails, without the token the apiserver returns 401.
      # Per-callee audiences get added here when the first real
      # service-to-service call exists, not speculatively.
      projectedToken:
        enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 250Mi
      limits:
        cpu: 500m
        memory: 500Mi
    labels:
      component: api
      partOf: iot
    services:
      http:
        enabled: true
        protocol: TCP
        port: 80
        targetPort: 4000
    ingress:
      enabled: true
      serviceRef: http
      pathName: iot/miot-bridge
    # No udpIngress. The UDP command listener and the UDP/HTTP notification channels were
    # never used (owner, 2026-08-27) and are switched off in the config below, so the
    # Service, the IngressRouteUDP and the container's UDP port all go with them.
    #
    # What this removed: Traefik runs hostNetwork and bound the `udp-miot-prod` /
    # `udp-miot-sbx` entrypoints on the node, so 192.168.1.20x:4000-4001/UDP was a real
    # LAN-reachable path into this pod. It is now closed at the application layer as well
    # as by NetworkPolicy — allow-host-ingress permits TCP only.
    #
    # The Traefik entrypoints themselves still exist in
    # gitops/helm-values/<cluster>/traefik.yaml and now have no backend. Removing them is
    # a separate change: Traefik is hostNetwork with one replica, so it restarts ingress.
    secretRefs:
      - name: miot-bridge-api-mqtt-credentials
        keys:
          - SECRET_MQTT_MIOT_BRIDGE_USERNAME
          - SECRET_MQTT_MIOT_BRIDGE_PASSWORD
      - name: miot-bridge-api-mongodb-credentials
        keys:
          - SECRET_MONGODB_DATABASE
          - SECRET_MONGODB_USERNAME
          - SECRET_MONGODB_PASSWORD
    # Boot budget: 5s × 24 = 120s. Liveness and readiness stay suppressed until this passes,
    # which is the modern replacement for initialDelaySeconds guesswork.
    startupProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 5
      failureThreshold: 24
      timeoutSeconds: 2
    # Shallow by design — /health/live never touches the check registry. A MongoDB or MQTT
    # outage must degrade readiness, never restart pods.
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 2
    # Checks MongoDB and MQTT (both critical: true). Failing here only removes the pod from
    # Endpoints. MQTT reconnects are silent post-startup, so this is the only signal that a
    # mid-life broker outage exists. timeoutSeconds is above the app's own per-check
    # deadline (2s) so a slow dependency reports detail rather than a bodyless probe timeout.
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      periodSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 3
    # preStop covers Endpoints removal → Traefik; the app's own SIGTERM drain (readiness
    # flips to 503, in-flight requests finish) covers the window after it. Budget:
    # preStop 10s + drain 5s + teardown, well inside 30s.
    terminationGracePeriodSeconds: 30
    lifecycle:
      preStop:
        sleep:
          seconds: 10
    # At replicas: 1 this is what makes a rollout gapless — the new pod must pass readiness
    # before the old one is torn down.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    templates:
      config:
        file: production.json
        path: /home/app/config
        # content defined per-env
