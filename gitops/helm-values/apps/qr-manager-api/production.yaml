# qr-manager-api — production overrides
#
# redirect.baseURL has no path and must keep none. The app serves the redirect at /r/:slug,
# and the /r is supplied by the addPrefix middleware on the qr.home HTTPRoute
# (gitops/k8s-manifests/server1/qr-manager-api/production/Middleware.addprefix-qr.yaml, which
# explains the whole arrangement). Putting /r here as well would double it and break every
# printed label.

apps:
  qr-manager-api:
    image:
      tag: "0.5.9"
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": {{ CONTAINER_PORT }}
              },
              "redirect": {
                  "baseURL": "http://qr.home"
              },
              "mongodb": {
                  "enabled": true,
                  "url": "{{ VAR_MONGODB_URL }}/{{ SECRET_MONGODB_DATABASE }}",
                  "connectionOptions": {
                      "user": "{{ SECRET_MONGODB_USERNAME }}",
                      "pass": "{{ SECRET_MONGODB_PASSWORD }}"
                  }
              },
              "logger": {
                  "enabled": true,
                  "level": "info"
              },
              "otel": {
                  "metrics": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                      }
                  },
                  "traces": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                      }
                  },
                  "logs": {
                      "enabled": false,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                      }
                  }
              }
          }
