# qr-manager-api — shared base values
# Env-specific: image.tag, templates.config.content → production.yaml / sandbox.yaml

apps:
  qr-manager-api:
    # Restart on change of the MongoDB ExternalSecret (envFrom) and of the
    # generated config ConfigMap. Both are read once, at pod start.
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/radoslavirha/qr-manager-api
      tag: "0.2.1"
      pullPolicy: Always
    replicas: 1
    serviceAccount:
      create: true
      # No ambient token: automount would give every pod a long-lived,
      # full-audience one. projectedToken below is the explicit, scoped,
      # short-lived replacement.
      automountServiceAccountToken: false
      # Mounts a default-audience token + the cluster CA at
      # /var/run/secrets/kubernetes.io/serviceaccount, which is what lets this
      # service verify cluster-issued ServiceAccount tokens (JWKS fetch from
      # kubernetes.default.svc). Both files are needed: without ca.crt the TLS
      # handshake fails, without the token the apiserver returns 401.
      # Per-callee audiences get added here when the first real
      # service-to-service call exists, not speculatively.
      projectedToken:
        enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 250Mi
      limits:
        cpu: 500m
        memory: 500Mi
    labels:
      component: api
      partOf: iot
    services:
      http:
        enabled: true
        protocol: TCP
        port: 80
        targetPort: 4000
    ingress:
      enabled: true
      serviceRef: http
      pathName: iot/qr-manager
    secretRefs:
      - name: qr-manager-api-mongodb-credentials
        keys:
          - SECRET_MONGODB_DATABASE
          - SECRET_MONGODB_USERNAME
          - SECRET_MONGODB_PASSWORD
    # Boot budget: 5s × 24 = 120s. Liveness and readiness stay suppressed until this passes,
    # which is the modern replacement for initialDelaySeconds guesswork.
    startupProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 5
      failureThreshold: 24
      timeoutSeconds: 2
    # Shallow by design — /health/live never touches the check registry. A MongoDB outage
    # must degrade readiness, never restart pods.
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 2
    # Checks MongoDB (critical: true). Failing here only removes the pod from Endpoints.
    # timeoutSeconds is above the app's own per-check deadline (2s) so a slow dependency
    # reports a failed check with detail rather than being cut off as a probe timeout.
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      periodSeconds: 5
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 3
    # preStop covers Endpoints removal → Traefik; the app's own SIGTERM drain (readiness
    # flips to 503, in-flight requests finish) covers the window after it. Budget:
    # preStop 10s + drain 5s + teardown, well inside 30s.
    terminationGracePeriodSeconds: 30
    lifecycle:
      preStop:
        sleep:
          seconds: 10
    # At replicas: 1 this is what makes a rollout gapless — the new pod must pass readiness
    # before the old one is torn down.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    templates:
      config:
        file: production.json
        path: /home/app/config
        # content defined per-env
