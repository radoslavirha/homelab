# qr-manager-api — sandbox overrides
#
# The trailing /r on redirect.baseURL is not a typo. The redirect endpoint is mounted at
# /r/:slug; production reaches it through a gateway addPrefix on qr.irha.cz and so has no /r
# in its baseURL, but sandbox composes the chart's path-based route, where nothing adds the
# prefix. Nothing is printed from sandbox — this only keeps the qrURL field truthful.
#
# Probes, lifecycle and strategy live in base.yaml — they were staged here first and
# promoted once a sandbox rollout had been watched.

apps:
  qr-manager-api:
    image:
      tag: "0.8.0"
    # Staged here first, promoted to base.yaml once a sandbox rollout has been watched —
    # same path probes and lifecycle took.
    #
    # The image declares USER 1000 since 0.8.0; runAsUser repeats it numerically because
    # kubelet verifies runAsNonRoot against the image's configured user and cannot resolve
    # a username. readOnlyRootFilesystem was exercised locally against this image (boots,
    # /health/ready passes, no tmpfs needed); the sandbox is where its runtime write paths
    # get the same test.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": {{ CONTAINER_PORT }}
              },
              "redirect": {
                  "baseURL": "{{ VAR_PROTOCOL }}://{{ COMPONENT }}.{{ VAR_SUBDOMAIN }}.{{ VAR_PUBLIC_DOMAIN }}/{{ PATH_NAME }}/r"
              },
              "mongodb": {
                  "enabled": true,
                  "url": "{{ VAR_MONGODB_URL }}/{{ SECRET_MONGODB_DATABASE }}",
                  "connectionOptions": {
                      "user": "{{ SECRET_MONGODB_USERNAME }}",
                      "pass": "{{ SECRET_MONGODB_PASSWORD }}"
                  }
              },
              "auth": {
                  "IDP": {
                      "type": "bearer-jwt",
                      "trustedIssuers": [
                          {
                              "name": "idp",
                              "issuer": "https://auth.irha.cz/application/o/qr-manager-{{ VAR_CLUSTER }}-{{ NAMESPACE }}/",
                              "audience": "qr-manager-{{ VAR_CLUSTER }}-{{ NAMESPACE }}",
                              "subjectKind": "human",
                              "key": {
                                  "source": "jwks",
                                  "uri": "https://auth.irha.cz/application/o/qr-manager-{{ VAR_CLUSTER }}-{{ NAMESPACE }}/jwks/"
                              }
                          },
                          {
                              "name": "postman",
                              "issuer": "https://auth.irha.cz/application/o/postman/",
                              "audience": "qr-manager-{{ VAR_CLUSTER }}-{{ NAMESPACE }}",
                              "subjectKind": "human",
                              "key": {
                                  "source": "jwks",
                                  "uri": "https://auth.irha.cz/application/o/postman/jwks/"
                              }
                          }
                      ]
                  }
              },
              "logger": {
                  "enabled": true,
                  "level": "info"
              },
              "otel": {
                  "debug": false,
                  "metrics": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                      }
                  },
                  "traces": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                      }
                  },
                  "logs": {
                      "enabled": false,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                      }
                  }
              }
          }
