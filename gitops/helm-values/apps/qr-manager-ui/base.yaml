# qr-manager-ui — shared base values
# Env-specific: image.tag, templates.config.content → production.yaml / sandbox.yaml
# No secretRefs (no secrets needed), no udpIngress, no cluster-specific overrides.

apps:
  qr-manager-ui:
    # No secrets, but the config ConfigMap is rendered into the image at pod
    # start — Reloader is the only thing that restarts the pod when it changes.
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/radoslavirha/qr-manager-ui
      tag: "0.2.1"
      pullPolicy: Always
    replicas: 1
    # Was running as the `default` ServiceAccount, which meant Kubernetes
    # automounted a cluster token into it — the only pod in these namespaces
    # that still held one. A static nginx SPA never calls the apiserver, so it
    # gets its own ServiceAccount with automount off and no projectedToken.
    serviceAccount:
      create: true
      automountServiceAccountToken: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    labels:
      component: apps
      partOf: iot
    services:
      http:
        enabled: true
        protocol: TCP
        port: 80
        targetPort: 80
    ingress:
      enabled: true
      serviceRef: http
      pathName: qr-manager
      stripPrefix: false
    env:
      - name: NGINX_BASE_PATH
        value: /qr-manager
    # nginx serves a static SPA. /healthz is an absolute path (exact-match location),
    # independent of NGINX_BASE_PATH, and there is no live/ready distinction to make:
    # after the config validator has passed there is nothing a readiness check could know
    # that a liveness check could not.
    #
    # Deliberately NOT probing qr-manager-api from here: an API outage would empty this
    # Deployment's Endpoints and turn a degraded page into a Traefik 502.
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 2
      failureThreshold: 15
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
      failureThreshold: 3
    # Keep serving while Endpoints removal propagates to Traefik. nginx's own graceful
    # shutdown (STOPSIGNAL SIGQUIT, inherited from the base image) handles connections it
    # already has; preStop covers the window where Traefik still sends new ones.
    terminationGracePeriodSeconds: 30
    lifecycle:
      preStop:
        sleep:
          seconds: 5
    # At replicas: 1 this is what makes the rollout gapless — the new pod must pass
    # readiness before the old one is torn down. It is also what contains a bad config:
    # the new pod fails init validation while the old pod keeps serving.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    templates:
      config:
        file: config.json
        path: /usr/share/nginx/html/config.json
        subPath: config.json
        # nginx cannot check the config it serves, so the chart runs the app's own Zod
        # schema in an initContainer. An empty {{ VAR_* }} substitution is valid JSON and
        # would otherwise boot a Ready pod serving a blank page.
        # Validator image: ghcr.io/radoslavirha/qr-manager-ui-config-validator:<image.tag>
        validate: true
        # content defined per-env
