# interactive-map-feeder-api — production overrides
# Cluster-specific VAR_* (VAR_PUBLIC_DOMAIN, VAR_PROTOCOL) are in server2/apps/interactive-map-feeder-api/production.yaml

apps:
  interactive-map-feeder-api:
    image:
      tag: "0.12.1"
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": {{ CONTAINER_PORT }}
              },
              "publicURL": "{{ VAR_PROTOCOL }}://{{ COMPONENT }}.{{ VAR_PUBLIC_DOMAIN }}/{{ PATH_NAME }}",
              "externalApis": {
                  "CHMI_PORTAL": {
                      "baseURL": "https://intranet.chmi.cz",
                      "resilience": {
                          "timeout": {
                              "ms": 10000
                          },
                          "retry": {
                              "count": 2,
                              "backoffMs": 500
                          },
                          "circuitBreaker": {}
                      },
                      "logging": {
                          "enabled": true,
                          "stack": false
                      },
                      "retriableStatusCodes": [500, 502, 503, 504, 429, 408]
                  },
                  "CHMI_OPENDATA": {
                      "baseURL": "https://opendata.chmi.cz",
                      "resilience": {
                          "timeout": {
                              "ms": 10000
                          },
                          "retry": {
                              "count": 2,
                              "backoffMs": 500
                          },
                          "circuitBreaker": {}
                      },
                      "logging": {
                          "enabled": true,
                          "stack": false
                      },
                      "retriableStatusCodes": [500, 502, 503, 504, 429, 408]
                  }
              },
              "auth": {
                  "IDP": {
                      "type": "bearer-jwt",
                      "trustedIssuers": [
                          {
                              "name": "idp",
                              "issuer": "https://auth.irha.cz/application/o/interactive-map-feeder-{{ VAR_CLUSTER }}-{{ NAMESPACE }}/",
                              "audience": "interactive-map-feeder-{{ VAR_CLUSTER }}-{{ NAMESPACE }}",
                              "subjectKind": "human",
                              "key": {
                                  "source": "jwks",
                                  "uri": "https://auth.irha.cz/application/o/interactive-map-feeder-{{ VAR_CLUSTER }}-{{ NAMESPACE }}/jwks/"
                              }
                          },
                          {
                              "name": "interactive-map",
                              "issuer": "https://auth.irha.cz/application/o/interactive-map/",
                              "audience": "interactive-map-feeder-{{ VAR_CLUSTER }}-{{ NAMESPACE }}",
                              "subjectKind": "device",
                              "key": {
                                  "source": "jwks",
                                  "uri": "https://auth.irha.cz/application/o/interactive-map/jwks/"
                              }
                          },
                          {
                              "name": "postman",
                              "issuer": "https://auth.irha.cz/application/o/postman/",
                              "audience": "interactive-map-feeder-{{ VAR_CLUSTER }}-{{ NAMESPACE }}",
                              "subjectKind": "human",
                              "key": {
                                  "source": "jwks",
                                  "uri": "https://auth.irha.cz/application/o/postman/jwks/"
                              }
                          }
                      ]
                  }
              },
              "logger": {
                  "enabled": true,
                  "level": "info"
              },
              "otel": {
                  "metrics": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                      }
                  },
                  "traces": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                      }
                  },
                  "logs": {
                      "enabled": false,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                      }
                  }
              }
          }
