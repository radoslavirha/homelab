# interactive-map-feeder-api — sandbox overrides
# Cluster-specific VAR_* (VAR_PUBLIC_DOMAIN, VAR_SUBDOMAIN, VAR_PROTOCOL) are in server2/apps/common/sandbox.yaml
#
# Probes, lifecycle and strategy live in base.yaml — they were staged here first and
# promoted once a sandbox rollout had been watched.
# See docs/superpowers/plans/2026-08-06-iot-app-health-checks-homelab.md

apps:
  interactive-map-feeder-api:
    image:
      tag: "0.11.11"
    templates:
      config:
        content: |
          {
              "serviceName": "{{ APPLICATION }}",
              "server": {
                  "httpPort": {{ CONTAINER_PORT }}
              },
              "publicURL": "{{ VAR_PROTOCOL }}://{{ VAR_SUBDOMAIN }}.{{ COMPONENT }}.{{ VAR_PUBLIC_DOMAIN }}/{{ PATH_NAME }}",
              "externalApis": {
                  "CHMI_PORTAL": {
                      "baseURL": "https://intranet.chmi.cz",
                      "resilience": {
                          "timeout": {
                              "ms": 10000
                          },
                          "retry": {
                              "count": 2,
                              "backoffMs": 500
                          },
                          "circuitBreaker": {}
                      },
                      "logging": {
                          "enabled": true,
                          "stack": false
                      },
                      "retriableStatusCodes": [500, 502, 503, 504, 429, 408]
                  },
                  "CHMI_OPENDATA": {
                      "baseURL": "https://opendata.chmi.cz",
                      "resilience": {
                          "timeout": {
                              "ms": 10000
                          },
                          "retry": {
                              "count": 2,
                              "backoffMs": 500
                          },
                          "circuitBreaker": {}
                      },
                      "logging": {
                          "enabled": true,
                          "stack": false
                      },
                      "retriableStatusCodes": [500, 502, 503, 504, 429, 408]
                  }
              },
              "logger": {
                  "enabled": true,
                  "level": "info"
              },
              "otel": {
                  "debug": false,
                  "metrics": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/metrics"
                      }
                  },
                  "traces": {
                      "enabled": true,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/traces"
                      }
                  },
                  "logs": {
                      "enabled": false,
                      "exporter": {
                          "url": "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318/v1/logs"
                      }
                  }
              }
          }
