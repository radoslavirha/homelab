# Headlamp — server3 cluster overrides
# Shared base values: gitops/helm-values/headlamp.yaml

httpRoute:
  hostnames:
    - headlamp.server3.homelab.irha.cz

# OIDC login through Authentik. Headlamp authorizes nothing itself: it forwards the
# id_token to kube-apiserver, which must trust this issuer -- `apiserver_oidc` in
# iac/clusters/server3/bootstrap. Land this only together with that change, or every
# login gets a 401 from the API server. Same shape as server2, which is the verified
# canary; the reasoning for each field is in gitops/helm-values/server2/headlamp.yaml.
config:
  oidc:
    clientID: headlamp-server3-production
    # NO clientSecret: public client + PKCE.
    issuerURL: https://auth.irha.cz/application/o/headlamp-server3-production/
    scopes: "openid,profile,email,roles"
    callbackURL: https://headlamp.server3.homelab.irha.cz/oidc-callback
    usePKCE: true
