apps:
  homelab-dashboard-ui:
    # SECRET_UNIFI_API_KEY reaches nginx as an env var (secretRefs -> envFrom) and is
    # read once at container start. Without a restart, a rotated Unifi key is never
    # picked up.
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/radoslavirha/homelab-dashboard-ui
      tag: "0.4.2"
      pullPolicy: Always
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    labels:
      component: apps
      partOf: dashboards
    services:
      http:
        enabled: true
        protocol: TCP
        port: 80
        targetPort: 80
    ingress:
      enabled: true
      serviceRef: http
      hostname: dashboard.home
      pathName: ""
      stripPrefix: false
    # The Unifi host and credential are server-side only — see
    # docs/superpowers/plans/2026-08-25-dashboard-credential-boundary-homelab.md.
    # nginx reads UNIFI_HOST in proxy_pass and attaches SECRET_UNIFI_API_KEY (via the
    # secretRefs envFrom below) with proxy_set_header. config.json deliberately carries
    # neither, because nginx serves it to the browser.
    env:
      - name: UNIFI_HOST
        value: "https://192.168.1.1"
    secretRefs:
      - name: homelab-dashboard-ui-unifi-credentials
        keys:
          - SECRET_UNIFI_API_KEY
    # nginx serves a static SPA. /healthz is an exact-match location, so all three probes
    # share it: after the config validator has passed there is nothing a readiness check
    # could know that a liveness check could not.
    #
    # Deliberately NOT probing the Unifi controller through this pod's own /proxy/network/
    # reverse proxy: a controller reboot must not delete the dashboard from Endpoints.
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 2
      failureThreshold: 15
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
      failureThreshold: 3
    # Keep serving while Endpoints removal propagates to Traefik. nginx's own graceful
    # shutdown (STOPSIGNAL SIGQUIT, inherited from the base image) handles connections it
    # already has; preStop covers the window where Traefik still sends new ones.
    terminationGracePeriodSeconds: 30
    lifecycle:
      preStop:
        sleep:
          seconds: 5
    # At replicas: 1 this is what makes the rollout gapless — the new pod must pass
    # readiness before the old one is torn down. It is also what contains a bad config:
    # the new pod fails init validation while the old pod keeps serving.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    templates:
      config:
        file: config.json
        path: /usr/share/nginx/html/config.json
        subPath: config.json
        # nginx cannot check the config it serves, so the chart runs the app's own Zod
        # schema in an initContainer. It no longer covers the credential (that moved to
        # the image's own entrypoint guard) but serverPattern, scheme and unifi.site are
        # still required, so an empty substitution still fails init rather than booting a
        # Ready pod that renders nothing.
        # Validator image: ghcr.io/radoslavirha/homelab-dashboard-ui-config-validator:<image.tag>
        validate: true
        content: |
          {
            "title": "homelab",
            "unifi": {
              "site": "default"
            },
            "serverPattern": "^server(\\d+)\\.home$",
            "scheme": "http",
            "exclude": [
              "dashboard.home",
              "qr.home",
              "api.server1.home",
              "sandbox.api.server1.home",
              "apps.server1.home",
              "sandbox.apps.server1.home",
              "api.server2.home",
              "sandbox.api.server2.home",
              "apps.server2.home",
              "sandbox.apps.server2.home",
              "otel.server3.home"
            ],
            "paths": {
              "traefik": "/dashboard/"
            }
          }
