# Traefik — server3 cluster overrides
# Shared base values: gitops/helm-values/traefik.yaml

ingressRoute:
  dashboard:
    enabled: true
    # Custom match rule with Host() so external-dns traefik-proxy source can extract the hostname.
    # The default rule only has PathPrefix, which gives external-dns nothing to work with.
    matchRule: "Host(`traefik.server3.homelab.irha.cz`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
    # websecure only. The one hostname this route answers to is covered by the cluster
    # certificate, so there is nothing left for `web` to serve — the .home name it existed
    # for was retired at stage 7.
    entryPoints: [websecure]
    tls:
      # An IngressRoute is served by the kubernetesCRD provider, which is a separate path
      # from the Gateway API listener — it does not inherit the listener's certificateRefs.
      # Without an explicit secretName here Traefik would answer with its built-in
      # self-signed default certificate and the browser would warn.
      secretName: server3-tls
    annotations:
      # traefik-proxy source resolves target from status.loadBalancer.ingress by default.
      # Since the Traefik Service is ClusterIP (no LB), that is always empty.
      # Provide the target IP explicitly so external-dns can create the A record.
      external-dns.alpha.kubernetes.io/target: "192.168.1.202"

# HTTPS Gateway listener. Per cluster, not shared, because certificateRefs names a
# cluster-specific Secret — server1 and server2 have no certificate yet (stage 5), and a
# listener pointing at a Secret that does not exist would sit unprogrammed.
#
# The listener map merges with `web` from gitops/helm-values/traefik.yaml rather than
# replacing it, so port 80 keeps serving.
#
# There is deliberately NO 80 -> 443 redirect here. `ports.web.http.redirections.entryPoint`
# is the obvious next line and it would break two things: OTLP ingest
# (otel.server3.homelab.irha.cz:4318 is an HTTPRoute on `web`, and OTLP exporters do not
# follow 301s) and an ESPHome device that fetches api.server1.homelab.irha.cz over plain
# HTTP — TLS there means the esp-idf framework with verify_ssl: false. Left open on
# purpose; a redirect nothing follows is worse than no redirect.
gateway:
  listeners:
    websecure:
      port: 443
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        # Issued by cert-manager into the traefik namespace; declared in
        # gitops/k8s-manifests/server3/traefik/Certificate.server3-tls.yaml.
        # A listener resolves certificateRefs in the Gateway's own namespace, which is why
        # the Certificate is co-located here and needs no ReferenceGrant.
        - name: server3-tls

# ── staged chart migration: this block is per cluster until all three are on 41.x ──
# server2 is the canary for chart 39.0.7 -> 41.5.0. The 41.x values schema rejects the 39.x
# spelling of these keys and vice versa, so while the clusters are split they cannot live in
# the shared gitops/helm-values/traefik.yaml. (Helm null-deletion was tried first and does
# not work here: helm 3.13.3 keeps `logs: null` as a present key and the schema still
# rejects it.) When server1 and server3 move to 41.x, fold this back into the shared file.

# `logs.general`/`logs.access` became `log`/`accessLog` in chart 41.0.0, and
# `defaultmode` was recased to `defaultMode` in the same release -- only one of the two
# is in the changelog. The root of the values file carries additionalProperties:false,
# so the old spelling fails the render loudly rather than being ignored.
log:
  level: INFO

accessLog:
  enabled: true
  # The chart default is `common` (CLF) — a plain text line. Every log panel of the
  # Traefik dashboard runs `| json` over the line and reads Traefik's own field names
  # (OriginStatus, RequestMethod, RequestPath, ServiceAddr), so with CLF they render
  # empty while metrics and traces look healthy. JSON also emits `"level":"info"`,
  # which is what makes detected_level something other than `unknown` for these lines.
  #
  # JSON is what carries TraceId/SpanId as well: with tracing enabled Traefik writes
  # them into every access log record, but only in the structured formats. Those two
  # fields are lifted into Loki structured metadata by the Traefik-scoped stage in
  # gitops/helm-values/k8s-monitoring.yaml — that is what links an access log line to
  # its Tempo trace, the same correlation the Winston-instrumented APIs get.
  format: json
  fields:
    headers:
      # Headers are dropped wholesale by default. The dashboard reads three of them.
      # Loki's `| json` rewrites `-` to `_`, so `request_X-Real-Ip` is queried as
      # `request_X_Real_Ip`. The Cf-* pair only ever populates behind Cloudflare —
      # kept so the client-country panels work if this is ever fronted by it, and
      # simply absent on the private network.
      defaultMode: drop
      names:
        X-Real-Ip: keep
        Cf-Connecting-Ip: keep
        Cf-Ipcountry: keep

service:
  # ClusterIP + externalIPs is the correct pattern for bare metal.
  # LoadBalancer (default) waits for status.loadBalancer.ingress which a bare metal cluster
  # never populates, causing ArgoCD to mark the Service as Progressing forever.
  #
  # Both keys live under `spec` since chart 41.x, and that rename is SILENT: `service` carries
  # no additionalProperties:false, so the old spelling validates and is then discarded, leaving
  # a LoadBalancer with no externalIPs. `helm template` exits 0 and the ArgoCD diff looks clean.
  spec:
    type: ClusterIP
    externalIPs:
      - 192.168.1.202

providers:
  kubernetesGateway:
    # TCPRoute and TLSRoute are part of the Gateway API experimental channel.
    # Without this, Traefik rejects the entire Gateway object with
    # "Protocol TCP requires the experimental channel support" when any TCP
    # listener (e.g. otlp-grpc :4317) is present.
    experimentalChannel: true
    statusAddress:
      # The Traefik Service uses externalIPs (not LoadBalancer), so status.loadBalancer is empty
      # and statusAddress.service would never populate Gateway status.addresses.
      # Use a static IP instead so external-dns can resolve HTTPRoute target addresses.
      ip: "192.168.1.202"

ports:
  otlp-grpc:
    port: 4317
    protocol: TCP
    expose:
      default: true
