# ExternalDNS — server3 cluster overrides
# Shared base values: gitops/helm-values/external-dns.yaml

# A hostname missing from this list is ignored SILENTLY by ExternalDNS — no error, no
# event, just a record that never appears. Apex names are listed individually; a bare
# `irha.cz` would have all three clusters claiming the whole zone, leaving the TXT registry
# as the only thing keeping three writers off each other's records.
#
# The .home entries were removed at stage 7. That stops ExternalDNS managing those names;
# it does NOT delete the records it already wrote, because policy is upsert-only. They are
# deleted by hand in UniFi.
domainFilters:
  - server3.homelab.irha.cz
  # Apex tier, per the naming decision. grafana is on the exposure spec's public list;
  # auth is Authentik, which does not exist yet — listed now because it is already a SAN on
  # server3-tls, and a missing filter entry fails silently rather than loudly.
  - grafana.irha.cz
  - auth.irha.cz

# TXT registry owner ID — must be unique per cluster to avoid record conflicts
txtOwnerId: homelab-server3
