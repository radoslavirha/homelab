# Grafana — server3 cluster overrides
# Shared base values: gitops/helm-values/grafana.yaml

# Authentik SSO. Public client + PKCE (no clientSecret) — same shape as ArgoCD's
# oidc.config in server3/argocd.yaml. Grafana's own backend does the code exchange, but
# its shipped defaults.ini ships client_secret empty and grafana/grafana's own bundled
# devenv docs run this exact shape against Authentik, so no confidential client is
# needed here. Headlamp turned out to be the same shape (public + PKCE, verified
# 2026-09-17 — see docs/identity.md); OpenBao is the only confidential api client.
#
# client_id is the rendered slug: <app>-<cluster>-<stage>, no `local` environment
# exists for this application (see gitops/helm-values/server3/authentik-blueprints.yaml).
#
# admin/password login (grafana-admin ExternalSecret, see admin: below) is kept on as a
# fallback: if Authentik or the network path to it is down, admin still gets in.
grafana.ini:
  # Chart's default `server.domain`/`root_url` templating derives from `ingress.hosts[0]`
  # -- this repo uses `httpRoute`, not `ingress`, so that default came up empty
  # (`domain = ''`, no root_url at all) and Grafana fell back to its built-in template
  # (http://<empty>:3000/...) for every absolute URL it constructs, OAuth redirect_uri
  # included. Authentik's registered redirect_uri is a STRICT match against
  # https://grafana.irha.cz/login/generic_oauth, so the wrong one Grafana was sending
  # got the "Redirect URI Error" banner. Pre-existing gap -- nothing used an absolute
  # URL before OAuth needed one.
  server:
    domain: grafana.irha.cz
    # root_url, not just domain: Grafana's own domain-derived default still guesses
    # http:// and appends :3000 (the pod's own listen port), both wrong behind Traefik's
    # TLS-terminated :443. Setting root_url directly is what fixes the redirect_uri.
    root_url: https://grafana.irha.cz/
  auth.generic_oauth:
    name: Authentik
    enabled: true
    client_id: grafana-server3-production
    # Deliberately absent. Authentik's client_type for this provider is `public` — no
    # secret exists to set. Grafana's own default for this key is also empty, so an
    # absent key here and an explicit empty one render identically.
    scopes: openid profile email roles
    auth_url: https://auth.irha.cz/application/o/authorize/
    token_url: https://auth.irha.cz/application/o/token/
    api_url: https://auth.irha.cz/application/o/userinfo/
    use_pkce: true
    # roles claim is already filtered to this application and already flattened by the
    # role ladder (docs/identity.md): ["grafana.admin"] or ["grafana.admin",
    # "grafana.editor", "grafana.reader"] for an admin, down to ["grafana.reader"] for a
    # reader. JMESPath, evaluated top-to-bottom against the /userinfo response.
    role_attribute_path: "contains(roles[*], 'grafana.admin') && 'Admin' || contains(roles[*], 'grafana.editor') && 'Editor' || 'Viewer'"
    # RP-initiated logout: ends the Authentik-side session for this application (not
    # every application — see invalidation_flow in the blueprint chart) and returns here.
    signout_redirect_url: https://auth.irha.cz/application/o/grafana-server3-production/end-session/

extraSecretMounts:
  - name: server1-influxdb2-grafana
    secretName: server1-influxdb2-grafana
    defaultMode: 0440
    mountPath: /etc/secrets/server1-influxdb2-grafana
    readOnly: true
