global:
  domain: argocd.server3.home

notifications:
  argocdUrl: http://argocd.server3.home
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"

configs:
  cm:
    admin.enabled: "true"
    url: http://argocd.server3.home
    # Machine account for the Argo CD MCP server (read-only, see rbac below).
    # `apiKey` grants token generation only — no `login`, so this account cannot
    # sign in to the UI and needs no password in argocd-secret.
    # Mint a token with:  argocd account generate-token --account claude
    accounts.claude: apiKey
    # Restore health assessment for Application CRD so App-of-Apps sync waves
    # wait for each child Application to reach Healthy before the next wave.
    # Removed from ArgoCD core in v1.8 — re-enabled via Lua customization.
    # https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/1.7-1.8
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Stakater Reloader patches this pod template annotation to trigger a rolling
    # update when a referenced ConfigMap/Secret changes. Without ignoring it,
    # selfHeal reverts the patch and causes a second, pointless rollout.
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jqPathExpressions:
        - '.spec.template.metadata.annotations."reloader.stakater.com/last-reloaded-from"'
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jqPathExpressions:
        - '.spec.template.metadata.annotations."reloader.stakater.com/last-reloaded-from"'
    resource.customizations.ignoreDifferences.apps_DaemonSet: |
      jqPathExpressions:
        - '.spec.template.metadata.annotations."reloader.stakater.com/last-reloaded-from"'
  rbac:
    # Full operational control for the MCP account: every ArgoCD resource is
    # granted except `accounts` and `exec` (see below).
    #
    # Resources are listed explicitly rather than using `*, *, */*`. Upstream
    # recommends this — a wildcard silently grants any resource type added by a
    # future ArgoCD release, which is how `applicationsets` caught people out in 2.5.
    #
    # Object format differs per resource: applications, applicationsets and logs
    # are project-scoped (<project>/<object>); everything else takes a plain object.
    #
    # Deliberately NOT granted:
    #   accounts — would allow rotating the admin password or minting tokens for
    #              other accounts, i.e. privilege escalation if this token leaks.
    #   exec     — shell into any pod on any connected cluster. Also disabled
    #              server-side by default (exec.enabled is unset), so this is belt
    #              and braces. Add `p, role:claude, exec, *, */*, allow` plus
    #              `exec.enabled: "true"` in configs.cm if you ever want it.
    #
    # To grant literally everything instead, replace the whole block with:
    #   g, claude, role:admin
    policy.csv: |
      p, role:claude, applications, *, */*, allow
      p, role:claude, applicationsets, *, */*, allow
      p, role:claude, logs, *, */*, allow
      p, role:claude, clusters, *, *, allow
      p, role:claude, projects, *, *, allow
      p, role:claude, repositories, *, *, allow
      g, claude, role:claude
  params:
    server.insecure: "true"
  secret:
    createSecret: false

dex:
  enabled: false

# Metrics Services for every component. They default to enabled: false, which is why no
# argocd_* series existed — the metrics ports are always in the workload spec, so this
# creates five Services and restarts nothing.
#
# Annotations opt each Service into k8s-monitoring's annotation autodiscovery
# (annotationAutodiscovery in gitops/helm-values/k8s-monitoring.yaml). serviceMonitor is
# left off — there are no Prometheus Operator CRDs in this cluster.
#
# Ports are the chart's own defaults, verified against argo-cd 9.5.2, and differ per
# component. Re-check them on a chart upgrade; a wrong port scrapes nothing and says so
# nowhere.
controller:
  replicas: 1
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"

repoServer:
  replicas: 1
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"

applicationSet:
  replicas: 1
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"

server:
  replicas: 1
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        group: gateway.networking.k8s.io
        kind: Gateway
    hostnames:
      - argocd.server3.home
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# notifications has no replicas key here — the chart default is 1.
