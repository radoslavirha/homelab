global:
  domain: argocd.server3.home

notifications:
  argocdUrl: http://argocd.server3.home

configs:
  cm:
    admin.enabled: "true"
    url: http://argocd.server3.home
    # Machine account for the Argo CD MCP server (read-only, see rbac below).
    # `apiKey` grants token generation only — no `login`, so this account cannot
    # sign in to the UI and needs no password in argocd-secret.
    # Mint a token with:  argocd account generate-token --account claude
    accounts.claude: apiKey
    # Restore health assessment for Application CRD so App-of-Apps sync waves
    # wait for each child Application to reach Healthy before the next wave.
    # Removed from ArgoCD core in v1.8 — re-enabled via Lua customization.
    # https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/1.7-1.8
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  rbac:
    # Full operational control for the MCP account: every ArgoCD resource is
    # granted except `accounts` and `exec` (see below).
    #
    # Resources are listed explicitly rather than using `*, *, */*`. Upstream
    # recommends this — a wildcard silently grants any resource type added by a
    # future ArgoCD release, which is how `applicationsets` caught people out in 2.5.
    #
    # Object format differs per resource: applications, applicationsets and logs
    # are project-scoped (<project>/<object>); everything else takes a plain object.
    #
    # Deliberately NOT granted:
    #   accounts — would allow rotating the admin password or minting tokens for
    #              other accounts, i.e. privilege escalation if this token leaks.
    #   exec     — shell into any pod on any connected cluster. Also disabled
    #              server-side by default (exec.enabled is unset), so this is belt
    #              and braces. Add `p, role:claude, exec, *, */*, allow` plus
    #              `exec.enabled: "true"` in configs.cm if you ever want it.
    #
    # To grant literally everything instead, replace the whole block with:
    #   g, claude, role:admin
    policy.csv: |
      p, role:claude, applications, *, */*, allow
      p, role:claude, applicationsets, *, */*, allow
      p, role:claude, logs, *, */*, allow
      p, role:claude, clusters, *, *, allow
      p, role:claude, projects, *, *, allow
      p, role:claude, repositories, *, *, allow
      g, claude, role:claude
  params:
    server.insecure: "true"
  secret:
    createSecret: false

dex:
  enabled: false

server:
  replicas: 1
  httproute:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        group: gateway.networking.k8s.io
        kind: Gateway
    hostnames:
      - argocd.server3.home
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

repoServer:
  replicas: 1

applicationSet:
  replicas: 1

controller:
  replicas: 1
