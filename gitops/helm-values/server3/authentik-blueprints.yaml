# Authentik configuration graph — THE FILE YOU EDIT.
#
# Rendered into a blueprint ConfigMap by gitops/helm-charts/authentik-blueprints,
# mounted by the Authentik worker, and applied by Authentik itself. Adding an
# application or a role is a few lines here; the chart produces the repetitive YAML.
#
# Topology: docs/superpowers/specs/archive/2026-09-04-authentik-tenancy-topology.md
#
# Hostnames are derived as:
#   production -> <hostPrefix>.<cluster>.homelab.irha.cz
#   sandbox    -> <hostPrefix>.<stage>.<cluster>.homelab.irha.cz
# unless `host` is set explicitly.
#
# `{ stage: local }` (no cluster) is the developer-machine environment: slug
# <app>-local, redirect URIs on http://localhost:5173 (override with `localPort`).
# It is a full application — own client_id, own issuer, own role groups — so local
# development mimics a deployment instead of borrowing sandbox's client. Sandbox
# clients therefore carry no loopback URI. A local application is revocable on its
# own, and its token reaches only an API that explicitly trusts it.
#
# Devices and other machine identities are NOT here: they need client secrets, which
# do not belong in git. They arrive at A5, sourced from OpenBao via the !Env tag.
#
# ROLES form a ladder, written most-privileged first:
#
#   roles:
#     - name: admin
#       inherits: editor
#     - name: editor
#       inherits: reader
#     - name: reader
#
# `inherits` is Authentik group parentage, and Authentik membership flows UPWARD, so
# `admin` is the CHILD of `editor`. A user in `<app>-<env>-admin` alone is an effective
# member of the two groups above it and their token carries all three roles:
#
#   "roles": ["qr-manager.admin", "qr-manager.editor", "qr-manager.reader"]
#
# That is what lets an API say `@RequireRoles('qr-manager.reader')` once on a controller
# and narrow individual routes to `admin`, instead of listing every role on every route.
# A bare string is still accepted and means a role with no parent. Ladders are per
# application: `qr-manager.admin` implies nothing about `miot-bridge`.
#
# Design: docs/superpowers/specs/archive/2026-09-08-role-hierarchy.md
#
# `accesses` makes an application a CLIENT-ONLY one: it serves no host and calls other
# applications' APIs, so its token's `aud` names each of them and its `roles` claim is
# collected from THEIR role groups. It brings `redirectUris` with it -- there is no host
# to derive a callback from -- and it forbids `host`/`hostPrefix`/`basePath`. Targets
# resolve within one environment only, and an application that is someone's target may
# never declare `accesses` itself; the chart fails on both.
#
# Design: docs/superpowers/specs/2026-09-08-multi-audience-tokens.md

applications:
  - name: qr-manager
    title: QR Manager
    hostPrefix: apps
    # qr-manager-ui is served under a path prefix, not at the host root.
    basePath: /qr-manager
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { stage: local }

  - name: miot-bridge
    title: MIoT Bridge
    hostPrefix: apps
    basePath: /miot-bridge
    # No UI today: the REST surface is operated by hand and may get a frontend
    # later. The application exists so a caller can hold a token addressed to this
    # API — without it there is no audience to mint for, and the API can trust
    # nothing.
    #
    # `/command` is `admin` and stays `admin`. The two rungs below it exist ahead of
    # the routes that will use them: reading the device registry is not actuating a
    # device, and the ladder is what lets that split land as a class-level floor
    # rather than a role repeated on every route.
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { stage: local }

  - name: interactive-map-feeder
    title: Interactive Map Feeder
    hostPrefix: apps
    basePath: /interactive-map-feeder
    # No UI. The application exists so a person can hold a token addressed to
    # this API; the LaskaKit map does NOT use it — a device is its own
    # confidential application with client_credentials, and that one cannot live
    # here because it needs a client secret. See "Devices" in
    # docs/superpowers/specs/archive/2026-09-04-authentik-tenancy-topology.md.
    #
    # Every route is a read of public CHMU data, so `reader` is the only rung with
    # anything behind it today. `editor` and `admin` are declared so the feeder is
    # shaped like every other application here — and so the first write route does
    # not have to reissue everyone's groups.
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { stage: local }

  - name: postman
    title: Postman
    # CLIENT-ONLY: Postman serves nothing, it calls the APIs above. `accesses` is the
    # superset; each environment gets the intersection with what actually runs there, so
    # postman-server3-production addresses homelab-dashboard alone while postman-local
    # addresses all four.
    #
    # ONE CLIENT PER ENVIRONMENT, and that is not tidiness. The `roles` claim is
    # environment-free by design -- `qr-manager.admin` is the same string everywhere --
    # so `aud` and `iss` are the only things pinning a token to server1-sandbox rather
    # than server2-production. A single postman client spanning environments would put a
    # sandbox admin's `qr-manager.admin` into a token the production API accepts.
    #
    # In Postman this is one collection-level OAuth 2.0 config with the client_id as a
    # variable: the authorize and token endpoints are shared across every provider here,
    # so switching Postman environment switches the client and nothing else. Authorization
    # Code with PKCE, no client secret, scope `openid profile email roles` -- `roles` is
    # not implied by `profile` and has to be asked for.
    #
    # Public client + PKCE means there is no secret, which is why this belongs in git with
    # the rest instead of in OpenBao.
    accesses: [qr-manager, miot-bridge, interactive-map-feeder, homelab-dashboard]
    # Postman's hosted callback, used by the desktop app and the web client alike.
    redirectUris:
      - https://oauth.pstmn.io/v1/callback
    # The access gate, and nothing more. An Application with no binding is readable by
    # EVERY user, and this one mints tokens for every API in its environment. Membership
    # means "may hold a broad token here" -- the switch that revokes Postman access
    # without touching anyone's application roles, and the only revocation that acts
    # faster than expiry, since this client gets no refresh token. What the token can
    # actually DO still comes from the target applications' own role groups.
    roles:
      - user
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { cluster: server3, stage: production }
      - { stage: local }

  - name: homelab-dashboard
    title: Homelab Dashboard
    # Explicit host: server3 is the control cluster and does not follow the
    # apps.<cluster> convention.
    host: dashboard.server3.homelab.irha.cz
    # `viewer` was RENAMED to `reader` on 2026-09-08, when the ladder went uniform.
    # Blueprints do not prune: the old homelab-dashboard-*-viewer groups and their
    # bindings survive this change and must be deleted in the Authentik UI by hand,
    # or a member of one keeps both the access and a `homelab-dashboard.viewer` claim.
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server3, stage: production }
      - { stage: local }
