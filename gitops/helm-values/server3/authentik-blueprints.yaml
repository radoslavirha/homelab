# Authentik configuration graph — THE FILE YOU EDIT.
#
# Rendered into a blueprint ConfigMap by gitops/helm-charts/authentik-blueprints,
# mounted by the Authentik worker, and applied by Authentik itself. Adding an
# application or a role is a few lines here; the chart produces the repetitive YAML.
#
# Topology: docs/superpowers/specs/archive/2026-09-04-authentik-tenancy-topology.md
#
# Hostnames are derived as:
#   production -> <hostPrefix>.<cluster>.homelab.irha.cz
#   sandbox    -> <hostPrefix>.<stage>.<cluster>.homelab.irha.cz
# unless `host` is set explicitly.
#
# `{ stage: local }` (no cluster) is the developer-machine environment: slug
# <app>-local, redirect URIs on http://localhost:5173 (override with `localPort`).
# It is a full application — own client_id, own issuer, own role groups — so local
# development mimics a deployment instead of borrowing sandbox's client. Sandbox
# clients therefore carry no loopback URI. A local application is revocable on its
# own, and its token reaches only an API that explicitly trusts it.
#
# Devices and other machine identities are NOT here: they need client secrets, which
# do not belong in git. They arrive at A5, sourced from OpenBao via the !Env tag.
#
# ROLES form a ladder, written most-privileged first:
#
#   roles:
#     - name: admin
#       inherits: editor
#     - name: editor
#       inherits: reader
#     - name: reader
#
# `inherits` is Authentik group parentage, and Authentik membership flows UPWARD, so
# `admin` is the CHILD of `editor`. A user in `<app>-<env>-admin` alone is an effective
# member of the two groups above it and their token carries all three roles:
#
#   "roles": ["qr-manager.admin", "qr-manager.editor", "qr-manager.reader"]
#
# That is what lets an API say `@RequireRoles('qr-manager.reader')` once on a controller
# and narrow individual routes to `admin`, instead of listing every role on every route.
# A bare string is still accepted and means a role with no parent. Ladders are per
# application: `qr-manager.admin` implies nothing about `miot-bridge`.
#
# Design: docs/superpowers/specs/archive/2026-09-08-role-hierarchy.md
#
# `kind` says what sort of client an entry is. It is OURS, not Authentik's `client_type`
# (public/confidential), which is derived from it.
#
#   api     (default)  Serves a host; a human's browser logs in. Public + PKCE.
#   client             A human drives it and it calls other applications' APIs (Postman).
#                      Public + PKCE, `accesses`, `redirectUris`, no host.
#   device             A machine -- no browser, no human. Confidential +
#                      client_credentials, one environment, a blueprint-declared service
#                      account, no redirect URIs.
#
# `accesses` is what the two non-api kinds share: the applications whose audience this
# client's token carries. Unlike an `api` -- one Application per environment -- a client
# or device renders exactly ONE, spanning every environment it lists. One login, one
# token, every API. Where they differ is whose groups fill the `roles` claim. A client
# borrows the human's, so it names bare applications. A device has no human, so each
# access must name a role too:
#
#   accesses: [qr-manager]                        # client
#   accesses: [{ app: qr-manager, role: reader }] # device
#
# An application that is someone's target may never declare `accesses` itself -- clients
# are clients and APIs are APIs, and the chart fails on the overlap.
#
# Design: docs/superpowers/specs/archive/2026-09-08-multi-audience-tokens.md and
#         docs/superpowers/specs/2026-09-08-device-identity-esp32.md

applications:
  - name: qr-manager
    title: QR Manager
    hostPrefix: apps
    # qr-manager-ui is served under a path prefix, not at the host root.
    basePath: /qr-manager
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { stage: local }

  - name: miot-bridge
    title: MIoT Bridge
    hostPrefix: apps
    basePath: /miot-bridge
    # No UI today: the REST surface is operated by hand and may get a frontend
    # later. The application exists so a caller can hold a token addressed to this
    # API — without it there is no audience to mint for, and the API can trust
    # nothing.
    #
    # `/command` is `admin` and stays `admin`. The two rungs below it exist ahead of
    # the routes that will use them: reading the device registry is not actuating a
    # device, and the ladder is what lets that split land as a class-level floor
    # rather than a role repeated on every route.
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { stage: local }

  - name: interactive-map-feeder
    title: Interactive Map Feeder
    hostPrefix: apps
    basePath: /interactive-map-feeder
    # No UI. The application exists so a person can hold a token addressed to
    # this API; the LaskaKit map does NOT use it — a device is its own
    # confidential application with client_credentials, and that one cannot live
    # here because it needs a client secret. See "Devices" in
    # docs/superpowers/specs/archive/2026-09-04-authentik-tenancy-topology.md.
    #
    # Every route is a read of public CHMU data, so `reader` is the only rung with
    # anything behind it today. `editor` and `admin` are declared so the feeder is
    # shaped like every other application here — and so the first write route does
    # not have to reissue everyone's groups.
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { stage: local }

  - name: postman
    title: Postman
    kind: client
    # Postman serves nothing, it calls the APIs above. `accesses` names the applications
    # and `environments` the environments; the audience is the intersection -- every one of
    # those applications that actually runs in each of those environments, 18 entries today.
    #
    # ONE client for every environment: log in once, call any API anywhere. The `roles`
    # claim is `app.role` and carries no environment, so this token holds the union of
    # your roles across every environment listed below. With the same roles everywhere --
    # which is the case here -- that is identical to a per-environment token. It would
    # start to matter the day someone holds a higher role in sandbox than in production.
    #
    # In Postman this is one collection-level OAuth 2.0 config and nothing in it varies by
    # environment: client_id `postman`, Authorization Code with PKCE, no client secret,
    # scope `openid profile email roles` -- `roles` is not implied by `profile` and has to
    # be asked for. Only `baseUrl` changes between Postman environments.
    #
    # Public client + PKCE means there is no secret, which is why this belongs in git with
    # the rest instead of in OpenBao.
    accesses: [qr-manager, miot-bridge, interactive-map-feeder, homelab-dashboard]
    # Postman's hosted callback, used by the desktop app and the web client alike.
    redirectUris:
      - https://oauth.pstmn.io/v1/callback
    # The access gate, and nothing more -- one group, `postman-user`. An Application with
    # no binding is readable by EVERY user, and this one mints tokens for every API in
    # every environment. Membership means "may hold this token" -- the switch that revokes
    # Postman without touching anyone's application roles, and the only revocation faster
    # than expiry, since this client gets no refresh token. What the token can actually DO
    # still comes from the target applications' own role groups.
    roles:
      - user
    environments:
      - { cluster: server1, stage: sandbox }
      - { cluster: server1, stage: production }
      - { cluster: server2, stage: sandbox }
      - { cluster: server2, stage: production }
      - { cluster: server3, stage: production }
      - { stage: local }

  - name: argocd
    title: ArgoCD
    # Explicit host, same reasoning as homelab-dashboard: server3 is the control
    # cluster and does not follow the apps.<cluster> convention. No `local`
    # environment -- ArgoCD does not run on a developer machine.
    host: argocd.server3.homelab.irha.cz
    # ArgoCD's OIDC callback is fixed at /auth/callback, not this chart's /callback
    # default for our own apps. logoutPath stays the default (/).
    redirectPath: /auth/callback
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server3, stage: production }

  - name: homelab-dashboard
    title: Homelab Dashboard
    # Explicit host: server3 is the control cluster and does not follow the
    # apps.<cluster> convention.
    host: dashboard.server3.homelab.irha.cz
    # `viewer` was RENAMED to `reader` on 2026-09-08, when the ladder went uniform.
    # Blueprints do not prune: the old homelab-dashboard-*-viewer groups and their
    # bindings survive this change and must be deleted in the Authentik UI by hand,
    # or a member of one keeps both the access and a `homelab-dashboard.viewer` claim.
    roles:
      - name: admin
        inherits: editor
      - name: editor
        inherits: reader
      - name: reader
    environments:
      - { cluster: server3, stage: production }
      - { stage: local }

  # ---------------------------------------------------------------------------------
  # Devices. A machine identity, not a person -- no browser, no redirect, no password
  # prompt. It presents a client_id and a client_secret and gets a signed JWT back.
  #
  # THE SECRET IS NOT HERE AND NEVER WILL BE. Authentik GENERATES it when it creates the
  # provider, and the chart deliberately does not set `client_secret` -- a blueprint leaves
  # a field it does not mention exactly as it found it, so the value survives every
  # re-apply. For each device:
  #
  #   1. read it once from the provider page in the Authentik UI
  #   2. put it into that device's own firmware secrets, by hand
  #
  # Step 2 is manual and stays manual: nothing here flashes an ESP32.
  #
  # An OpenBao -> ExternalSecret -> `!Env` chain was considered and dropped. It buys a
  # secret recoverable without the database and costs a KV path, an ExternalSecret entry
  # and an env var per device -- not worth it when this instance's recovery unit is already
  # the Postgres backup plus AUTHENTIK_SECRET_KEY, and human group memberships are not in
  # git either. The cost of that choice: rebuild Authentik without its database and every
  # device needs a new secret and a reflash.
  # ---------------------------------------------------------------------------------

  - name: interactive-map
    title: Interactive Map (LaskaKit ESP32)
    kind: device
    # ONE client, `interactive-map`, whose audience names the feeder in BOTH environments
    # below -- one client_id, one secret to flash, one service account, placed in the
    # `reader` group of each. The device points at whichever API it was flashed for and
    # the same credential works against both.
    #
    # Every route it calls is a read, so `reader` is the whole grant. The role is named
    # here because there is no human whose groups could supply it: the chart puts this
    # device's service account into interactive-map-feeder-<env>-reader for every
    # environment below, and binds those same groups to its application, so the
    # membership that produces the claim is also the one that opens the door.
    #
    # Token validity is the chart default, minutes=10. Hold the token in an ESPHome
    # `global` and re-fetch when it expires -- NOT once per API request. Authentik writes
    # to the service account row on every client_credentials call, so a token per
    # 10-second poll is 8640 database writes a day for this one device.
    accesses:
      - { app: interactive-map-feeder, role: reader }
    environments:
      - { cluster: server1, stage: production }
      - { stage: local }
