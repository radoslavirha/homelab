# k8s-monitoring — shared base (collector + feature toggles, no destinations).
# Applied to every cluster; destinations live in gitops/helm-values/<cluster>/k8s-monitoring.yaml.
# server1/server2 forward all signals to server3 via a single OTLP destination;
# server3 fans out locally to Prometheus/Loki/Tempo.
# Upstream values.yaml: https://github.com/grafana/k8s-monitoring-helm/blob/main/charts/k8s-monitoring/values.yaml

# ---------------------------------------------------------------------------
# Single collapsed collector — valid because every cluster is single-node.
#
# Chart v4 removed the built-in named Alloy instances; collectors are declared here
# and each feature names the one it runs on. The chart's default layout is four
# separate collectors, one per role. All four are collapsed into one process because
# the reasons for splitting them only apply to multi-node clusters:
#
#   role       | why the chart splits it        | why it doesn't matter on one node
#   -----------|--------------------------------|----------------------------------
#   logs       | DaemonSet, reads local /var/log | DaemonSet == 1 pod
#   metrics    | clustering shards scrape targets across replicas | nothing to shard
#   singleton  | >1 replica duplicates k8s events | only ever 1 replica
#   receiver   | scales independently with ingest | ingest is small
#
# Named `alloy-receiver` so the Service stays k8s-monitoring-alloy-receiver — that name
# is referenced by every app's OTLP URL, traefik.yaml, the HTTPRoute and the
# IngressRouteTCP, and it stays correct if this is ever split back into four.
#
# >>> IF YOU EVER GO MULTI-NODE, THIS MUST BE SPLIT BACK. <<<
# Collapsed on multi-node causes: k8s events emitted once per node (N duplicates),
# duplicated scrape targets, and one OOM taking out all telemetry at once.
# To split, replace the collectors block below with:
#
#   collectors:
#     alloy-metrics:   { presets: [clustered, service-discovery] }
#     alloy-logs:      { presets: [daemonset, filesystem-log-reader] }
#     alloy-singleton: { presets: [singleton] }
#     alloy-receiver:  { presets: [deployment, otel-receiver] }
#
# and repoint each feature: clusterMetrics/hostMetrics -> alloy-metrics,
# podLogsViaLoki -> alloy-logs, clusterEvents -> alloy-singleton,
# applicationObservability -> alloy-receiver.
# ---------------------------------------------------------------------------
collectors:
  alloy-receiver:
    presets:
      - daemonset               # pod logs must be read from the local node
      - filesystem-log-reader   # mounts /var/log for pod logs
      - otel-receiver           # opens OTLP :4317 gRPC and :4318 HTTP
      - clustered               # required by clusterMetrics; a no-op at 1 replica

# Scrape any pod or service that opts in with the de-facto standard annotations.
#
# The chart defaults to k8s.grafana.com/* and supports exactly one annotation set.
# prometheus.io/* is the one that already exists on all three clusters, unset by us:
#   kube-system/cilium-agent      pod      :9962
#   kube-system/cilium-operator   pod      :9963
#   kube-system/cilium-envoy      service  :9964
#   kube-system/hubble-metrics    service  :9965
#   kube-system/kube-dns          service  :9153
# and it is the same convention ArgoCD, Longhorn, EMQX and the bitnami charts use, so
# picking it needs no upstream chart edits to reach the control plane.
#
# This replaces the Prometheus chart's own kubernetes-pods / kubernetes-service-endpoints
# jobs (disabled in prometheus.yaml): those carried no `cluster` label and only ever saw
# server3, so nothing they collected was reachable from a cluster-scoped dashboard.
#
# The chart's own node-exporter Service carries prometheus.io/scrape: "false", so
# hostMetrics stays the single source of node_* — no double collection.
annotationAutodiscovery:
  enabled: true
  collector: alloy-receiver
  annotations:
    scrape: "prometheus.io/scrape"
    metricsPath: "prometheus.io/path"
    metricsPortNumber: "prometheus.io/port"

clusterMetrics:
  enabled: true
  collector: alloy-receiver
  # The chart's default kube-state-metrics allow-list
  # (charts/feature-cluster-metrics/default-allow-lists/kube-state-metrics.yaml) carries
  # kube_pod_status_phase, kube_pod_status_reason and the container restart/waiting series,
  # but NOT kube_pod_status_ready. Without it a readiness failure is invisible: the pod
  # leaves the Service's Endpoints while phase stays Running and restarts_total stays flat,
  # so nothing in Prometheus changes and no alert can fire. The custom apps have readiness
  # probes gating on MongoDB/EMQX, which makes that the expected shape of an outage.
  # includeMetrics is additive to the default allow-list (the template concatenates both),
  # so nothing else is dropped. Cost is ~3 series per pod, one per condition value.
  #
  # The rest of this list exists for the dotdc dashboards (grafana.com 15757-15762).
  # kube_namespace_created is the important one: every "by namespace" panel in them is
  #
  #   sum(...) by (namespace) + on (namespace) (<windows series> OR kube_namespace_created * 0)
  #
  # The OR arm is the dashboards' portable way of forcing a zero row for namespaces with no
  # workload. On Talos there are no windows_container_* series, so that arm is the only one
  # left, and with kube_namespace_created absent the whole right-hand vector is empty — an
  # `on()` binary op against an empty vector yields nothing, so CPU / Memory / Network
  # "by namespace" all render blank even though the left-hand side has data.
  #
  # The *_info / *_labels entries below back the Resource Count and Namespaces panels; each
  # is one series per object (~450 total across all three clusters), so they are cheap.
  # kube_node.* and kube_daemonset.* are already in the default list via wildcards.
  kube-state-metrics:
    metricsTuning:
      includeMetrics:
        - kube_pod_status_ready
        - kube_namespace_created
        - kube_namespace_labels
        - kube_service_info
        - kube_endpoint_info
        - kube_ingress_info
        - kube_deployment_labels
        - kube_statefulset_labels
        - kube_daemonset_labels
        - kube_hpa_labels
        - kube_secret_info
        - kube_networkpolicy_labels
        - kube_pod_status_qos_class
  # The chart's cadvisor allow-list
  # (charts/feature-cluster-metrics/default-allow-lists/cadvisor.yaml) is 19 entries and
  # misses three the dotdc dashboards need. All three used to exist and stopped when item 0.2
  # disabled the Prometheus chart's own kubernetes-nodes-cadvisor job — that job carried no
  # `cluster` label, so the panels were never actually usable, they were reading a series
  # that no cluster-scoped query could reach.
  #
  #   container_cpu_cfs_throttled_seconds_total  the list has _throttled_periods_total only,
  #                                             which counts throttling events, not time lost
  #   container_oom_events_total                 the only counter for OOMKills; kube-state's
  #                                             last_terminated_reason is a gauge that resets
  #   machine_cpu_cores                          the list has machine_memory_bytes but not its
  #                                             CPU twin, so every request/limit-vs-capacity
  #                                             ratio panel has no denominator
  #
  # Cost is one series per container for the first two, one per node for the last.
  cadvisor:
    metricsTuning:
      includeMetrics:
        - container_cpu_cfs_throttled_seconds_total
        - container_oom_events_total
        - machine_cpu_cores
  # kube_pod_status_ready says a pod is NotReady. It does not say WHICH probe failed.
  # These are kubelet's own probe counters, a separate scrape of /metrics/probes on each
  # node — same node discovery, serviceaccount token and TLS config as the kubelet and
  # kubeletResource scrapes above, so this needs no extra RBAC.
  # Why it matters here: liveness is deliberately shallow and readiness gates on
  # MongoDB/EMQX. `probe_type="Readiness"` failing while `probe_type="Liveness"` stays
  # clean is the proof that split is working rather than an inference. It also surfaces
  # probe flapping that never reaches failureThreshold, which is invisible otherwise.
  #
  # prober_probe_duration_seconds is dropped: it is a histogram (~14 series per container
  # per probe type, ~7x the cost of the rest of prober_*) and answers a question we do not
  # have — probe latency only matters when tuning timeoutSeconds. Timeouts still show up
  # in prober_probe_total as result="failed", just without the distribution. Note the drop
  # is post-scrape in Alloy, so it saves storage and remote-write, not scrape work.
  kubeletProbes:
    enabled: true
    metricsTuning:
      excludeMetrics:
        - prober_probe_duration_seconds.*
  # Restores what item 0.2 removed, this time on all three clusters and with a cluster label.
  # Feeds the dotdc "Kubernetes / System / API Server" dashboard (grafana.com 15761), whose
  # 12 queries all filter on cluster="$cluster".
  #
  # >>> THE ALLOW-LIST IS MANDATORY HERE, NOT AN OPTIMISATION. <<<
  # Unlike kube-state-metrics and cadvisor above, the chart ships NO default allow-list for
  # the API server, and `includeMetrics: []` means keep everything. Measured against the live
  # endpoint (`kubectl get --raw /metrics`): ~56,000 series and ~400 metric names PER CLUSTER.
  # Enabling this bare would add ~168,000 series across the three, against a Prometheus head
  # of ~70,900 — a 3.4x blow-up that would almost certainly OOM it.
  #
  # Measured cost of each option, server1 / server3:
  #   apiserver_request_duration_seconds_bucket    12672 / 12816   <- excluded, ~38k across 3
  #   apiserver_request_total                        673 /   650
  #   apiserver_request_duration_seconds_count       528 /   534
  #   apiserver_request_duration_seconds_sum         528 /   534
  #   apiserver_requested_deprecated_apis              2 /     2
  #   process_cpu_seconds_total                        1 /     1
  #   process_resident_memory_bytes                    1 /     1
  #
  # This list is exactly the six the dashboard queries and nothing else: ~1,730 series per
  # cluster, ~5,200 across all three, +7.3% on the head. The histogram is deliberately out —
  # it is 7x everything else combined and no adopted dashboard reads it. If a latency
  # distribution is ever wanted, add the _bucket back knowingly and re-check the head count.
  apiServer:
    enabled: true
    metricsTuning:
      includeMetrics:
        - apiserver_request_total
        - apiserver_request_duration_seconds_count
        - apiserver_request_duration_seconds_sum
        - apiserver_requested_deprecated_apis
        - process_cpu_seconds_total
        - process_resident_memory_bytes
hostMetrics:
  enabled: true
  collector: alloy-receiver
  # `enabled: true` alone only deploys node-exporter — it does NOT scrape it.
  # linuxHosts defaults to false, which renders host_metrics as an empty stub
  # and silently collects nothing. windowsHosts stays off (all nodes are Talos).
  linuxHosts:
    enabled: true
    # The chart's default node-exporter allow-list is ten patterns — node_cpu.*,
    # node_filesystem.*, node_memory.*, four node_network_* counters and two process_*.
    # No disk I/O, no load average, no uname, no boot time, no PSI, so every node
    # dashboard renders those panels empty.
    #
    # includeMetrics is concatenated onto the default list, nothing is dropped. The
    # alternative is metricsTuning.useIntegrationAllowList, which swaps in the chart's
    # ~150-entry Node Exporter integration list; this stays narrower on purpose — three
    # single-node boxes, and node_disk_.* is already per-device.
    metricsTuning:
      includeMetrics:
        - node_disk_.*
        - node_load.*
        - node_uname_info
        - node_boot_time_seconds
        - node_pressure_.*
        - node_vmstat_pgmajfault
        - node_context_switches_total
        - node_intr_total
        - node_time_seconds
        - node_timex_.*
clusterEvents:
  enabled: true
  collector: alloy-receiver

# Pod logs via the Loki pipeline (generally-available). The OpenTelemetry variant
# (podLogsViaOpenTelemetry) needs otelcol.receiver.filelog, still public-preview in Alloy.
# On server1/server2 these logs are bridged into the OTLP destination automatically.
podLogsViaLoki:
  enabled: true
  collector: alloy-receiver
  # Lift trace context and level out of JSON log lines into structured metadata.
  #
  # The custom Node APIs log Winston JSON to stdout. Everything in it — including the
  # trace_id/span_id that @opentelemetry/instrumentation-winston injects — is just
  # characters inside the line, so Grafana's Loki->Tempo derived field (matcherType:
  # label) and Tempo's tracesToLogsV2 customQuery (`| trace_id = ...`) find nothing.
  # These two stages restore the correlation that OTLP log export gave for free.
  #
  # BOTH stages must live here, not split across the chart's `structuredMetadata:` key.
  # The chart renders stage.structured_metadata from that key BEFORE this block
  # (charts/feature-pod-logs-via-loki/templates/_processing.alloy.tpl:54 vs :79), so it
  # would run before stage.json has extracted anything and silently map nothing.
  #
  # Deliberately only three fields, all injected by the OTel instrumentation rather than
  # by application code, so they do not drift as the apps change what they log. Everything
  # else in the JSON stays queryable at read time with `| json`; enumerating more here
  # would couple this file to three apps' logging schemas in another repo.
  #
  # Safe cluster-wide: stage.json extracts nothing and passes the line through untouched
  # when it is not JSON, so plaintext logs (Cilium, Longhorn, nginx) are unaffected.
  # level is extracted too, but note Loki already derives detected_level correctly from
  # these lines — this makes it an explicit field rather than a heuristic.
  # Traefik's JSON access log needs nothing extra here: it writes trace context twice, as
  # TraceId/SpanId (its own stdio spelling) AND as trace_id/span_id, so these three
  # expressions cover it as they are. A Traefik-scoped mapping for the capitalised pair was
  # tried and removed as dead weight — verified against a live line on Traefik v3.6.12.
  extraLogProcessingStages: |-
    stage.json {
      expressions = { level = "level", trace_id = "trace_id", span_id = "span_id" }
    }
    stage.structured_metadata {
      values = { level = "level", trace_id = "trace_id", span_id = "span_id" }
    }

# OTLP receiver for app telemetry — apps push to k8s-monitoring-alloy-receiver:4317/4318.
applicationObservability:
  enabled: true
  collector: alloy-receiver
  receivers:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

# Self-monitoring for the collector. Without alloy_* there is no signal for a pipeline
# that is Running but collecting or exporting nothing — the failure mode behind both
# silent-collection bugs in this repo's history (see AGENTS.md, "Green does not mean
# working"). alloy_component_evaluation_* and prometheus_remote_write_* are the two that
# answer it. Feeds the Alloy mixin dashboards (item 2.6 of docs/grafana-dashboards-plan.md).
#
# Not covered by annotationAutodiscovery above: the Alloy pods carry no prometheus.io/*
# annotations. Integrations discover by label selector instead, and ship a curated
# allow-list per component, so this is a few hundred series, not everything Alloy emits.
#
# The selector is alloy-RECEIVER — the collector is named alloy-receiver (see the
# collectors block at the top), so app.kubernetes.io/name is alloy-receiver, not the
# chart default of "alloy", which matches nothing here.
#
# Loki, Tempo and Grafana run on server3 only; their instances live in
# gitops/helm-values/server3/k8s-monitoring.yaml. Helm merges the two integrations maps
# by key, so this alloy entry survives.
integrations:
  collector: alloy-receiver
  alloy:
    instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name: alloy-receiver
        # The chart's alloy allow-list
        # (charts/feature-integrations/default-allow-lists/alloy.yaml) contains exactly seven
        # otelcol_* entries, and every one of them is about SPANS:
        #   otelcol_exporter_sent_spans_total          otelcol_receiver_accepted_spans_total
        #   otelcol_exporter_send_failed_spans_total   otelcol_receiver_refused_spans_total
        #   otelcol_processor_batch_batch_send_size_bucket, _metadata_cardinality,
        #   _timeout_trigger_send_total
        #
        # So the collector can prove traces are flowing and CANNOT say whether logs or metrics
        # are. Every log-record and metric-point counter is dropped post-scrape, including all
        # three otelcol_exporter_send_failed_* variants — the exact signal that distinguishes
        # "exporting fine" from "accepting data and silently failing to ship it".
        #
        # That is the blind spot item 0.5 was added to close, and it did not close it. It
        # matters most on server1/server2: they forward everything to server3 over OTLP, so
        # otelcol.exporter.otlp IS their entire egress path. They never instantiate a
        # prometheus.remote_write component, which is why prometheus_remote_storage_* exists
        # only on server3 and the Alloy remote-write mixin dashboard is a server3-only view.
        #
        # Two prefixes rather than an enumerated list, because enumerating means silently
        # missing whatever a future Alloy release adds to the same families — which is exactly
        # how the current gap arose.
        #
        # Cost measured against the live /metrics endpoints, not estimated: 21 distinct names
        # / 69 series on server1, 20 / 109 on server3. Call it ~250 series across all three.
        # Two histograms are 55% of that (otelcol_exporter_queue_batch_send_size_bucket and
        # ..._bytes_bucket); if this ever needs trimming, exclude those two first — nothing
        # queries them today. The rest is one series per exporter or receiver per signal.
        #
        # What this actually buys, all confirmed present on the live endpoints:
        #   otelcol_exporter_sent_{spans,metric_points,log_records}_total
        #   otelcol_receiver_{accepted,refused,failed}_{spans,metric_points,log_records}_total
        #   otelcol_exporter_queue_size / queue_capacity   <- backpressure, the early warning
        #   otelcol_exporter_in_flight_requests
        #
        # Note otelcol_exporter_send_failed_* is NOT currently on the endpoint. That is not an
        # allow-list problem: the counter is only created once it first increments, so it
        # appears the moment an export actually fails. The .* prefix catches it then; an
        # enumerated list written from today's output would too, but only by luck.
        metrics:
          tuning:
            includeMetrics:
              - otelcol_exporter_.*
              - otelcol_receiver_.*

# Chart v4 extracted these into the telemetryServices subchart; all default to deploy: false.
# These two are the node/cluster telemetry: clusterMetrics needs kube-state-metrics,
# hostMetrics needs node-exporter. windows-exporter stays off (all nodes are Talos Linux).
telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
