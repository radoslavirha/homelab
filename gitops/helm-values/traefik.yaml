# Traefik — shared Helm values (bare-metal, Gateway API, hostNetwork)
# Upstream values.yaml: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
# Cluster-specific overrides (IPs, hostnames): gitops/helm-values/<cluster>/traefik.yaml

hostNetwork: true

# Required when hostNetwork: true so CoreDNS is still used for *.svc.cluster.local
# Without this, the host's DNS resolver is used and cluster DNS names don't resolve.
deployment:
  dnsPolicy: ClusterFirstWithHostNet

# With hostNetwork: true and ports.web.port: 80, Traefik binds port 80 directly on the
# host network stack. Port 80 is privileged (<1024) and requires root or NET_BIND_SERVICE.
#
# The upstream chart default uses port 8000 internally (non-privileged) and only exposes
# port 80 via the Service — so it can run as non-root 65532 without any extra capability.
# That model does not work with hostNetwork because the host listens on the container port.
#
# Solution: run as root with NET_BIND_SERVICE. Also override podSecurityContext to clear
# the upstream default of runAsNonRoot: true, which would conflict with runAsUser: 0.
securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0

podSecurityContext:
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0

updateStrategy:
  type: Recreate

ports:
  web:
    port: 80
  # The chart default is 8443, and under hostNetwork the CONTAINER port IS the host port —
  # so the default leaves every node listening on 8443 rather than 443. (It already does:
  # the entrypoint is enabled by default, which is why `websecure=8443/TCP` shows up on the
  # Traefik pods today with no Gateway listener attached to it.)
  #
  # Safe on all three clusters even where no certificate exists yet: an entrypoint is just a
  # socket. What needs a certificate is the Gateway listener, and that is declared per
  # cluster in gitops/helm-values/<cluster>/traefik.yaml.
  websecure:
    port: 443
  metrics: null

api:
  dashboard: true
  insecure: true

service:
  # ClusterIP + externalIPs is the correct pattern for bare metal.
  # LoadBalancer (default) waits for status.loadBalancer.ingress which a bare metal cluster
  # never populates, causing ArgoCD to mark the Service as Progressing forever.
  type: ClusterIP

ingressClass:
  enabled: false

# Enable Gateway API Provider & disable KubernetesIngress provider.
# Providers tell Traefik where to find routing configuration.
providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    # Watch all namespaces so Middleware CRDs can be referenced via HTTPRoute ExtensionRef.
    namespaces: []
  kubernetesGateway:
    enabled: true

# Gateway Listeners
gateway:
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

logs:
  general:
    level: INFO
  access:
    enabled: true
    # The chart default is `common` (CLF) — a plain text line. Every log panel of the
    # Traefik dashboard runs `| json` over the line and reads Traefik's own field names
    # (OriginStatus, RequestMethod, RequestPath, ServiceAddr), so with CLF they render
    # empty while metrics and traces look healthy. JSON also emits `"level":"info"`,
    # which is what makes detected_level something other than `unknown` for these lines.
    #
    # JSON is what carries TraceId/SpanId as well: with tracing enabled Traefik writes
    # them into every access log record, but only in the structured formats. Those two
    # fields are lifted into Loki structured metadata by the Traefik-scoped stage in
    # gitops/helm-values/k8s-monitoring.yaml — that is what links an access log line to
    # its Tempo trace, the same correlation the Winston-instrumented APIs get.
    format: json
    fields:
      headers:
        # Headers are dropped wholesale by default. The dashboard reads three of them.
        # Loki's `| json` rewrites `-` to `_`, so `request_X-Real-Ip` is queried as
        # `request_X_Real_Ip`. The Cf-* pair only ever populates behind Cloudflare —
        # kept so the client-country panels work if this is ever fronted by it, and
        # simply absent on the private network.
        defaultmode: drop
        names:
          X-Real-Ip: keep
          Cf-Connecting-Ip: keep
          Cf-Ipcountry: keep

tracing:
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: "k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4317"
      insecure: true

metrics:
  prometheus: null
  otlp:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    grpc:
      enabled: true
      endpoint: "k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4317"
      insecure: true
