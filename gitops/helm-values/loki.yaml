# Loki — shared base values (Monolithic / single-binary mode)
# Upstream: https://github.com/grafana-community/helm-charts/tree/main/charts/loki
# Receives logs from OTel Collector via OTLP HTTP on port 3100.

deploymentMode: Monolithic

loki:
  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: filesystem

  auth_enabled: false

# Single replica for homelab
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: longhorn

# Disable read/write/backend when using Monolithic mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable minio sub-chart (using filesystem storage)
minio:
  enabled: false

# Disable the canary and test pods for homelab.
#
# lokiCanary is TOP-LEVEL in this chart and defaults to enabled: true. It was previously
# nested under `monitoring:` here, where the chart's `monitoring:` key only accepts
# `dashboards` and `rules` — Helm ignores unknown keys silently, so the setting never
# applied and the canary ran anyway. It sat in a liveness crash-loop for months
# (30k+ restarts, HTTP 404 on /loki/api/v1/status/buildinfo) before kubelet's prober_*
# metrics made it visible. `monitoring.selfMonitoring` was dead for the same reason;
# that feature no longer exists in the chart, so it is simply dropped.
lokiCanary:
  enabled: false

test:
  enabled: false

# Memcached caches — sized for this homelab rather than left on datacenter defaults.
#
# The chart requests `allocatedMemory * 1.2` per cache pod. Upstream defaults are
# chunksCache 8192 and resultsCache 1024, so these two pods alone reserved
# 9830Mi + 1229Mi = 11059Mi — 88% of every memory request on server3 — against
# 15230Mi allocatable. Measured actual usage was 1492Mi and 27Mi. Nearly 9.5Gi was
# reserved for nothing, and the node sat at 82% requested with no room to deploy
# anything new.
#
# Sizes below are set from observed working set, not guessed: chunks gets ~35% headroom
# over the 1492Mi it had accumulated, results gets ~10x its 27Mi. Both are generous for a
# 20Gi filesystem store on one node.
#
# The chunk cache matters less here than the defaults assume — `storage.type: filesystem`
# means chunks come off local Longhorn rather than remote object storage, and the kernel
# page cache already covers much of that. The results cache is the one that earns its keep
# on repeated Grafana dashboard refreshes, and it is the one that was oversized 40x.
#
# allocatedCPU is also dropped from the 500m default on each. memcached is idle almost
# always; 1000m of reservation across the pair was 46% of this node's CPU requests.
chunksCache:
  allocatedMemory: 2048
  allocatedCPU: 100m

resultsCache:
  allocatedMemory: 256
  allocatedCPU: 100m
