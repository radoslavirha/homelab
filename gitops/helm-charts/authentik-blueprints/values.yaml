# Defaults. Real configuration lives in gitops/helm-values/server3/authentik-blueprints.yaml.

# Suffix shared by every generated hostname.
domain: homelab.irha.cz

# Authentik's shipped scope mappings attached to every provider, used as-is.
#
# `profile` is NOT here: its shipped version emits `groups` -- EVERY group the user
# belongs to, unfiltered by application, so a sandbox token names the user's
# production groups on other clusters. The template binds a local replacement
# instead, plus a `roles` mapping. See the mapping entries in templates/configmap.yaml.
scopes:
  - openid
  - email

# Name of the signing certificate. "authentik Self-signed Certificate" is created
# by Authentik on first boot.
signingKeyName: authentik Self-signed Certificate

# Token lifetimes for interactive (SPA) providers.
#
# accessTokenValidity was minutes=5, chosen when renewal was expected to be an
# invisible hidden-iframe request. It is not: Authentik sets X-Frame-Options:
# DENY, so renewal is a TOP-LEVEL navigation that reloads the SPA and loses any
# unsaved form state. At 5 minutes that is unusable.
#
# 30 minutes is the contract's own "cheaper first move" (open decision 3),
# preferred over binding offline_access because a refresh token would put a
# long-lived credential in the one place JavaScript can reach. The cost is
# revocation latency: removing someone from a group takes up to this long to
# bite. For a homelab admin UI that is the right side of the trade.
accessCodeValidity: minutes=1
accessTokenValidity: minutes=30

# Token lifetime for kind: device providers, overridable per device with
# `accessTokenValidity`.
#
# SHORT, because nothing here introspects: every verifier checks the signature offline, so
# this number IS the revocation latency. A device stays admitted for up to this long after
# its groups are cut.
#
# It can be short because a device stores nothing durable -- the token lives in an ESPHome
# `global` in RAM, and client_credentials is its own refresh: present the secret, get a new
# token. A reboot costs one extra request.
#
# It should NOT be so short that the device fetches a token per API request. Authentik runs
# update_or_create() on the service account on every client_credentials call, so that is a
# database write per API call: at a 10-second poll, 8640 a day per device. Ten minutes gives
# six token requests an hour and ten-minute revocation.
deviceAccessTokenValidity: minutes=10

# Session length for kind: proxy providers, overridable per application with
# `accessTokenValidity`.
#
# The outpost sizes the session it keeps for a guarded host from the provider's
# access_token_validity, so this is how long a login to Longhorn lasts before Authentik is
# asked again. LONG, unlike the SPAs above: the UIs behind a proxy are XHR- and
# websocket-heavy, and when the session expires mid-page their background requests get a
# 302 to auth.irha.cz they cannot follow -- the page breaks until a reload. Eight hours is
# about one working session.
#
# The cost is the usual one: removing someone from the gate group takes up to this long
# to bite.
proxyAccessTokenValidity: hours=8

# Where a proxy outpost sends browsers to log in (its config.authentik_host). HTTPS,
# explicitly: the embedded outpost Authentik created on first boot carries
# http://auth.irha.cz, and nothing here should inherit that.
authentikHost: https://auth.irha.cz

# REMOVING an application is two commits, because blueprints do not prune: deleting an
# entry here stops managing its objects, it does not delete them. On 2026-09-13 that left
# six OAuth2 providers with live credentials orphaned in Authentik, invisible to git.
#
#   1. set `state: absent` on the entry, changing nothing else. The chart re-renders the
#      same slugs as deletion entries and Authentik deletes them on the next apply.
#   2. after that apply lands, delete the entry from this file.
#
# Keep `roles` and `environments` on an absent entry -- they are how the chart knows which
# group names and slugs to delete. An absent entry whose objects are already gone is a
# no-op, so step 2 is safe to delay.
applications: []

# Onboarding — invitation-gated enrollment and admin-minted recovery.
#
# OFF by default so the chart stays inert; gitops/helm-values/server3/ opts in.
# Rendered into its own ConfigMap key, separate from the applications blueprint.
#
# Onboarding is NOT per-application, which is why it is not part of the matrix
# above: one enrollment flow and one recovery flow serve the whole instance.
#
# Design: docs/superpowers/specs/2026-09-18-authentik-identity-hardening.md
onboarding:
  enabled: false
  # The group every invited member lands in. Grants NOTHING on its own: no
  # application binding, no ladder parentage. Role memberships stay UI work, like
  # every other membership here.
  group: household
  userPath: users/household
  enrollmentTitle: Welcome — finish setting up your account
  recoveryTitle: Choose a new password
  # Shape rule for a username chosen at enrollment, enforced by an expression policy
  # on the prompt stage. Deliberately narrow, because the string outlives Authentik:
  # it is `sub` in every token, `oidc:<name>` in Kubernetes audit logs, an OpenBao
  # entity alias, and the claim Mealie matches on -- and it is immutable once set.
  #
  # Lowercase start, then lowercase letters, digits, dot, dash or underscore; 3-32
  # characters. No spaces, no capitals, no @ (which would read as an email), no colon
  # (which would collide with Kubernetes' system: prefix).
  usernamePattern: "[a-z][a-z0-9._-]{2,31}"
  usernameMessage: "Username must be 3-32 characters: start with a lowercase letter, then lowercase letters, digits, dots, dashes or underscores."

# Login surface hardening -- anti-enumeration, brute-force throttling, MFA.
#
# OFF by default so the chart stays inert; gitops/helm-values/server3/ opts in.
# Its own ConfigMap key, like onboarding: Authentik gives every .yaml key its own
# BlueprintInstance, so a malformed entry here cannot take the applications graph
# or the enrollment flow down with it.
#
# Everything here UPDATES shipped Authentik objects by identifiers -- the technique
# templates/_onboarding.tpl uses on the brand. Two things to know about that:
#
#   1. Unmentioned fields keep their stored values on SAVE (the importer uses
#      partial=True), but NOT during validation. A serializer with a cross-field
#      validate() reads only the attrs the entry supplied, so a one-field update can
#      be rejected for a field it never touched. See user_fields in _hardening.tpl.
#   2. Upstream's own blueprints manage these objects too, so an Authentik upgrade
#      can quietly revert a field. The on-cluster verification in docs/identity.md is
#      the only thing that catches it.
#
# Design: docs/superpowers/specs/archive/2026-09-18-authentik-identity-hardening.md
#         section "Out of scope", which is where this work was deferred to.
hardening:
  enabled: false

  # Brute-force throttling. Authentik keeps a reputation score per IP and per
  # username: a failed login decrements it, a successful one increments it, and the
  # policy PASSES when the score is at or below the threshold. "Policy passes" is
  # wired to a deny stage, so passing means the login is refused.
  reputation:
    # -5, i.e. five failed attempts for that username inside the score's lifetime.
    # Low enough to stop spraying, high enough that a household member fumbling a
    # password twice notices nothing.
    #
    # The cost, stated rather than discovered later: a score keyed on the username
    # alone is a score an attacker can drive on purpose. Anyone who knows a username
    # -- and akadmin needs no guessing -- fails five logins and that account is
    # refused until the score expires. Measured on server3: reputation expiry is
    # 86400, so TWENTY-FOUR HOURS. show_matched_user: false hides usernames nobody
    # already knows; it does not protect the ones they do.
    #
    # Accepted trade: throttling a spray is worth more than denying a stranger the
    # ability to annoy one account, and clearing a score is two lines of ak shell
    # (runbook in docs/identity.md). It stops being the right trade once a real
    # client address is available -- then check_ip carries the load and this can
    # loosen.
    threshold: -5
    # OFF, deliberately, and this is not a preference.
    #
    # Traefik sets no forwardedHeaders.trustedIPs today, so the moment traffic
    # arrives through a reverse proxy, every request carries that proxy's address
    # rather than the client's. IP-keyed reputation then has ONE bucket for the
    # whole internet and the whole household, and five bad guesses from anywhere
    # lock out everyone.
    #
    # Turn this on in the same change that gives Traefik a trusted range and a real
    # client address -- never before, and verify with an access log line that shows
    # a genuine remote address.
    checkIp: false
    # ON: a username-keyed score is correct regardless of what the network path
    # does to the source address.
    checkUsername: true
