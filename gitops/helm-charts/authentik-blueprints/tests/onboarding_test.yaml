suite: onboarding
templates:
  - templates/configmap.yaml
tests:
  - it: renders no onboarding key when disabled, so the chart stays inert by default
    asserts:
      - notExists:
          path: data["homelab-onboarding.yaml"]

  - it: gates enrollment on an invitation, as the FIRST stage
    set:
      onboarding:
        enabled: true
    asserts:
      # continue_flow_without_invitation: false is what makes the flow URL safe to
      # be internet-reachable. Without it, anyone reaching the URL enrolls.
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "model: authentik_stages_invitation.invitationstage\\n\\s+id: stage-enrollment-invitation\\n\\s+identifiers:\\n\\s+name: homelab-enrollment-invitation\\n\\s+attrs:\\n\\s+continue_flow_without_invitation: false"
      # lowest order in the flow, and re-evaluated so the gate cannot be planned away
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "stage: !KeyOf stage-enrollment-invitation\\n\\s+order: 10\\n\\s+attrs:\\n\\s+evaluate_on_plan: true\\n\\s+re_evaluate_policies: true"

  - it: offers a username field the invitee picks, typed so authentik validates it
    set:
      onboarding:
        enabled: true
    asserts:
      # type: username is what attaches username_field_validator, which raises
      # "Username is already taken." inline at the prompt. Without it a collision
      # falls through to user_write and surfaces as an unexplained error, after a
      # single-use invitation has already burned.
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "name: homelab-enrollment-field-username\\n\\s+attrs:\\n\\s+field_key: username\\n\\s+label: Username\\n\\s+type: username"
      # First field, and first in the stage's list: it is the identity the rest hangs off.
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "fields:\\n\\s+- !KeyOf prompt-enrollment-username\\n"

  - it: renders exactly the two password fields the match check needs
    set:
      onboarding:
        enabled: true
    asserts:
      # PromptChallengeResponse.validate compares password fields only when the
      # stage holds exactly two of them. A third would silently disable it.
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "field_key: password\\n"
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "field_key: password_repeat\\n"

  - it: writes new users into the household group and path
    set:
      onboarding:
        enabled: true
        group: household
        userPath: users/household
    asserts:
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "user_creation_mode: always_create"
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "create_users_group: !KeyOf grp-household"
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "user_path_template: users/household"

  - it: leaves the applications blueprint and the login page alone
    set:
      onboarding:
        enabled: true
    asserts:
      - exists:
          path: data["homelab-applications.yaml"]
      # Onboarding must not touch the login page or the shipped user-settings
      # stage: authentik's own blueprint manages that stage's field list.
      - notMatchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "identificationstage|default-user-settings"

  - it: wires recovery to the brand but not to the login page
    set:
      onboarding:
        enabled: true
    asserts:
      # brand.flow_recovery is what makes "Create recovery link" work on the admin
      # user page. It is an UPDATE: a blueprint leaves unmentioned fields alone.
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "model: authentik_brands.brand\\n\\s+identifiers:\\n\\s+domain: authentik-default\\n\\s+attrs:\\n\\s+flow_recovery: !KeyOf flow-recovery"
      # The identification stage is NOT touched, so the public login page shows no
      # "Forgot password?" — no reset form to enumerate usernames with. The field
      # that would do it is `recovery_flow:`; note this must not match the phrase
      # in the template's own comment, hence the colon.
      - notMatchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "recovery_flow:"

  - it: never creates a user from the recovery flow
    set:
      onboarding:
        enabled: true
    asserts:
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "name: homelab-recovery-write\\n\\s+attrs:\\n\\s+user_creation_mode: never_create"

  - it: validates the SHAPE of a username, not only its uniqueness
    set:
      onboarding:
        enabled: true
    asserts:
      # authentik's own validator only answers "already taken". This one keeps the
      # string safe for every consumer: it becomes `sub`, the `oidc:<name>` subject
      # in Kubernetes audit logs, and an OpenBao entity alias.
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "model: authentik_policies_expression.expressionpolicy\\n\\s+id: policy-username-format\\n\\s+identifiers:\\n\\s+name: homelab-enrollment-username-format"
      # Bound to the prompt stage, so it runs at the prompt where it can be corrected
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "validation_policies:\\n\\s+- !Find \\[authentik_policies_password.passwordpolicy, \\[name, default-password-change-password-policy\\]\\]\\n\\s+- !KeyOf policy-username-format"
      # Reserved prefix: authentik's own service accounts are ak-outpost-*, ak-*-client_credentials
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "ak-"

  - it: does not apply the username rule to the recovery prompt, which sets no username
    set:
      onboarding:
        enabled: true
    asserts:
      - matchRegex:
          path: data["homelab-onboarding.yaml"]
          pattern: "name: homelab-recovery-prompt\\n\\s+attrs:\\n\\s+fields:\\n\\s+- !KeyOf prompt-recovery-password\\n\\s+- !KeyOf prompt-recovery-password-repeat\\n\\s+validation_policies:\\n\\s+- !Find \\[authentik_policies_password.passwordpolicy"
