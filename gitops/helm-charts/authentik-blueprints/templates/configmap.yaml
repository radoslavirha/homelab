{{- /*
Renders one Authentik blueprint from the application matrix in values.

Shape per environment, which is the topology decision in
docs/superpowers/specs/archive/2026-09-04-authentik-tenancy-topology.md:

  - one OAuth2 provider + one Application per app per environment
  - one Group per role
  - one policy binding per role group onto its Application

INVARIANT: every Application gets at least one binding. An Application with no
binding is readable by EVERY user — Authentik fails open. Because bindings are
generated from the same `roles` list that generates the groups, an app cannot end
up unbound unless `roles` is empty, which the template rejects below.
*/ -}}
{{- $root := . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  # Only keys ending in .yaml are discovered by Authentik.
  homelab-applications.yaml: |
    # GENERATED by gitops/helm-charts/authentik-blueprints. Do not edit here —
    # edit the matrix in gitops/helm-values/server3/authentik-blueprints.yaml.
    version: 1
    metadata:
      name: homelab - applications, groups and access bindings
    entries:

      # ---------- shared scope mappings ----------
      # Two hand-written mappings, bound to every provider below. Both exist because
      # Authentik's shipped `profile` mapping emits a claim we cannot use as-is.

      # Upstream `profile`, minus `groups`.
      #
      # The shipped version ends with
      #   "groups": [group.name for group in request.user.groups.all()]
      # -- EVERY group the user is in, unfiltered by application. Measured 2026-09-04:
      # a qr-manager-server1-sandbox token listed the user's
      # qr-manager-server2-production-admin membership. So the sandbox SPA is told
      # which other clusters and stages the user can reach. Nothing needs that, and
      # the roles mapping below supplies the same information scoped correctly.
      #
      # Cost of owning a copy: if Authentik adds a claim to `profile` upstream, we do
      # not get it until someone updates this. Everything here is from OIDC Core 5.1
      # and does not move.
      - model: authentik_providers_oauth2.scopemapping
        id: pm-profile
        identifiers:
          name: homelab profile
        attrs:
          scope_name: profile
          description: "Standard profile claims. Local copy of the shipped mapping with the unfiltered `groups` claim removed."
          expression: |
            return delete_none_values({
                "name": request.user.name,
                "given_name": ak_obj_attr(request.user, "given_name", "name"),
                "family_name": ak_obj_attr(request.user, "family_name"),
                "preferred_username": request.user.username,
                "nickname": request.user.username,
                "picture": request.user.avatar,
                # `aud` as a one-element ARRAY, not the bare string Authentik defaults to.
                #
                # Both forms are valid -- OIDC Core calls the array the general case and a
                # bare string the permitted special case -- but the shape must not CHANGE
                # later. It would, the day one login is allowed to call several APIs (see
                # the `accesses` design), and code written as `aud === "<client_id>"` would
                # have worked for months before breaking. Emitting the array from the start
                # makes that mistake fail on the very first request instead.
                #
                # It lives HERE, and only here. Authentik merges list-valued claims from
                # several mappings by CONCATENATION, not replacement -- setting it in the
                # roles mapping as well produced
                #   aud: ["qr-manager-server1-sandbox", "qr-manager-server1-sandbox"]
                # (measured). `profile` is the right single home: it is in the documented
                # scope string, and a client that omits it gets no user claims at all.
                "aud": [provider.client_id],
            })

      # `roles` -- what the APIs authorize on.
      #
      # Groups are named <client_id>-<role>, because Authentik group names are GLOBALLY
      # unique (verified: creating `admin` under two different parents is rejected), so
      # the environment has to be in the name to keep the objects apart. None of that
      # belongs in the token: an API must not authorize on "server1" or "sandbox".
      #
      # So this strips the client_id prefix and re-prefixes with the application's short
      # name, taken from Application.group -- set below from the values matrix, which is
      # the single source of truth for that spelling. Result: `qr-manager.admin`, the
      # SAME string in every cluster and stage. Environment is enforced by aud and iss,
      # which the verifier checks once per request, long before a route reads a role.
      #
      # The filter is what keeps one application's roles out of another's token.
      #
      # Claim name: `roles` is the name RFC 9068 (JWT Profile for OAuth 2.0 Access
      # Tokens) uses for exactly this, borrowing it from SCIM. Not binding, but it is
      # the closest thing to a standard spelling, so a future move to another IdP is a
      # remapping rather than a rename.
      - model: authentik_providers_oauth2.scopemapping
        id: pm-roles
        identifiers:
          name: homelab roles
        attrs:
          scope_name: roles
          description: "Application-scoped roles as <app>.<role>. Requested explicitly: scope=openid profile email roles."
          expression: |
            prefix = f"{provider.client_id}-"
            app = provider.application.group or provider.client_id
            return {
                "roles": sorted(
                    f"{app}.{group.name[len(prefix):]}"
                    for group in request.user.all_groups()
                    if group.name.startswith(prefix)
                ),
            }

    {{- range $app := .Values.applications }}
      {{- if not $app.roles }}
        {{- fail (printf "application %q has no roles: it would render an Application with no policy binding, which is open to every user" $app.name) }}
      {{- end }}

      {{- /*
      The role ladder -- normalised, validated, ordered.

      A role is either a bare string (no parent) or `{ name: admin, inherits: editor }`.
      `inherits` becomes Authentik group parentage. Membership flows UPWARD, so the
      ladder is written most-privileged first and `admin` is the CHILD of `editor`: a
      member of `-admin` is an effective member of `-editor` and `-reader`, and the roles
      mapping above -- which already calls all_groups() -- puts all three in the claim.
      That is what lets an API set one role as a class-level floor instead of repeating
      every role on every route.

      Design: docs/superpowers/specs/archive/2026-09-08-role-hierarchy.md
      */ -}}
      {{- $roles := list }}
      {{- $names := list }}
      {{- range $r := $app.roles }}
        {{- if kindIs "string" $r }}
          {{- $roles = append $roles (dict "name" $r "inherits" "") }}
          {{- $names = append $names $r }}
        {{- else }}
          {{- if not $r.name }}
            {{- fail (printf "application %q has a role entry with no `name`" $app.name) }}
          {{- end }}
          {{- $roles = append $roles (dict "name" $r.name "inherits" (default "" $r.inherits)) }}
          {{- $names = append $names $r.name }}
        {{- end }}
      {{- end }}
      {{- if ne (len $names) (len (uniq $names)) }}
        {{- fail (printf "application %q declares the same role twice: both entries render the same group name, and the second would silently overwrite the first" $app.name) }}
      {{- end }}
      {{- range $r := $roles }}
        {{- if $r.inherits }}
          {{- if eq $r.inherits $r.name }}
            {{- fail (printf "application %q: role %q inherits itself" $app.name $r.name) }}
          {{- end }}
          {{- if not (has $r.inherits $names) }}
            {{- fail (printf "application %q: role %q inherits %q, which this application does not declare -- a dangling parent renders a group nobody is in, and a privilege that never arrives" $app.name $r.name $r.inherits) }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- /*
      Binding order comes from DECLARATION order and is written as an attr, not an
      identifier. Rungs get inserted in the middle; an order that is part of the identity
      would make every role below the new one look like a binding that does not exist yet,
      creating a second binding beside the one it already had.
      */ -}}
      {{- $order := dict }}
      {{- range $i, $r := $roles }}
        {{- $_ := set $order $r.name $i }}
      {{- end }}

      {{- /*
      Parents must be APPLIED before their children: !KeyOf resolves only against entries
      that already have a model instance, so a child emitted first fails its entry with
      "failed to find entry with `id` ... and a model instance". Emit the parentless roles,
      then whatever became emittable, N passes deep. A ladder of N roles is at most N deep,
      so a role still unemitted after N passes is in a cycle -- which Authentik itself does
      not reject: GroupSerializer.parents has no cycle validation.
      */ -}}
      {{- $ordered := list }}
      {{- $emitted := list }}
      {{- range $pass := until (len $roles) }}
        {{- range $r := $roles }}
          {{- if not (has $r.name $emitted) }}
            {{- if or (not $r.inherits) (has $r.inherits $emitted) }}
              {{- $ordered = append $ordered $r }}
              {{- $emitted = append $emitted $r.name }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if ne (len $ordered) (len $roles) }}
        {{- fail (printf "application %q has a cycle in `inherits`: %v could not be ordered parent-first" $app.name (without $names $emitted)) }}
      {{- end }}
      {{- range $env := $app.environments }}
        {{- $isLocal := eq $env.stage "local" }}
        {{- $slug := "" }}
        {{- $base := "" }}
        {{- if $isLocal }}
          {{- if $env.cluster }}
            {{- fail (printf "application %q has a local environment with a cluster: a developer machine is not a cluster, and the slug would be wrong" $app.name) }}
          {{- end }}
          {{- $slug = printf "%s-local" $app.name }}
          {{- $base = printf "http://localhost:%v" (default 5173 $app.localPort) }}
        {{- else }}
          {{- $slug = printf "%s-%s-%s" $app.name $env.cluster $env.stage }}
          {{- $host := $app.host }}
          {{- if not $host }}
            {{- $host = ternary
                  (printf "%s.%s.%s" $app.hostPrefix $env.cluster $root.Values.domain)
                  (printf "%s.%s.%s.%s" $app.hostPrefix $env.stage $env.cluster $root.Values.domain)
                  (eq $env.stage "production") }}
          {{- end }}
          {{- $base = printf "https://%s%s" $host (default "" $app.basePath) }}
        {{- end }}

      # ---------- {{ $slug }} ----------
        {{- range $role := $ordered }}
      - model: authentik_core.group
        id: grp-{{ $slug }}-{{ $role.name }}
        identifiers:
          name: {{ $slug }}-{{ $role.name }}
        attrs:
          # Emitted on EVERY role, empty list included. A blueprint leaves a field it does
          # not mention exactly as it found it, so a role that loses its `inherits` in
          # values would otherwise keep granting its parent forever.
        {{- if $role.inherits }}
          parents:
            - !KeyOf grp-{{ $slug }}-{{ $role.inherits }}
        {{- else }}
          parents: []
        {{- end }}
        {{- end }}

      - model: authentik_providers_oauth2.oauth2provider
        id: prov-{{ $slug }}
        identifiers:
          name: {{ $slug }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          # default-invalidation-flow, NOT default-provider-invalidation-flow.
          #
          # The provider flow is the one that deliberately does not end the
          # authentik session: it ends only the application's, so Log out
          # followed by Log in signs the user straight back in with no prompt.
          # With SSO across five applications that is not a logout, it is a
          # confusing no-op, and it is why the UI used to carry a second
          # "Sign out everywhere" button.
          #
          # This flow runs the user_logout stage, so RP-initiated logout ends
          # the session itself and then honours post_logout_redirect_uri —
          # one button, and the user lands back on the app.
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          # per_provider (the model default), reversing the earlier choice of global.
          #
          # Every provider signs with the SAME key -- measured 2026-09-04: identical kid,
          # and a token minted for one application verifies cleanly against another's
          # JWKS URL. So a valid signature says "this IdP" and nothing about which
          # application. Under `global` the only claim separating the applications is
          # `aud`, and `aud` is an optional argument in every JWT library: omit it and
          # nothing complains. Under `per_provider` the iss differs too --
          # https://auth.irha.cz/application/o/<client_id>/ -- and a verifier built from
          # a discovery document pins iss structurally, because the client IS the issuer.
          # That makes the lazy implementation app-scoped instead of IdP-scoped.
          #
          # Nothing else moves: the authorize and token endpoints stay shared, and the
          # signing key stays shared. This is a second belt, not a fix for the key --
          # that is per-provider signing certificates, deferred.
          #
          # The rejected reasoning was "each application then needs its own trusted-issuer
          # row in packages/auth". True but small: it is ONE row per deployment carrying a
          # per-environment value, exactly like apiBaseURL already does -- not N rows per
          # API. Landed before any verifier existed, when the cost was zero; afterwards it
          # would mean updating every deployment's config and breaking live tokens until
          # their next renewal.
          issuer_mode: per_provider
          # SPA: public client, PKCE, no secret to store or rotate.
          client_type: public
          client_id: {{ $slug }}
          sub_mode: user_username
          # REQUIRED. The model default is an empty list, and empty grant_types makes
          # /application/o/authorize/ reject every request with invalid_request
          # ("The request is otherwise malformed") before any policy is evaluated.
          grant_types:
            - authorization_code
            - refresh_token
          access_code_validity: {{ $root.Values.accessCodeValidity }}
          access_token_validity: {{ $root.Values.accessTokenValidity }}
          # For a `local` environment $base is http://localhost:<port>, so these are
          # the loopback URIs and there is no separate special case below.
          #
          # Local development used to be a pair of loopback URIs bolted onto every
          # *sandbox* application. That worked, and it meant a developer machine could
          # complete a login as a real sandbox client — the same client_id, the same
          # audience, the same groups as the deployed sandbox. A `local` environment
          # is its own application instead: its own client_id, its own issuer, its own
          # role groups, revocable on its own. Sandbox clients now register only their
          # deployed host, and a loopback URI exists on exactly the client whose entire
          # purpose is a developer machine.
          #
          # Not a bypass: localhost is a secure context so PKCE works, the flow is the
          # real one against the real IdP, and the token is a real RS256 token. What it
          # is not is a *sandbox* token — an API that wants to accept it needs the local
          # application as a trusted issuer row, which is exactly the point: that row
          # lives in the developer's own config and never ships.
          redirect_uris:
            - matching_mode: strict
              url: {{ $base }}/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: {{ $base }}/
              redirect_uri_type: logout
          property_mappings:
            {{- range $scope := $root.Values.scopes }}
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-{{ $scope }}]]
            {{- end }}
            # Local, not the shipped ones -- see the entries at the top of this blueprint.
            - !KeyOf pm-profile
            - !KeyOf pm-roles
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, {{ $root.Values.signingKeyName }}]]

      - model: authentik_core.application
        id: app-{{ $slug }}
        identifiers:
          slug: {{ $slug }}
        attrs:
          name: {{ $app.title }} ({{ if $isLocal }}local{{ else }}{{ $env.cluster }}/{{ $env.stage }}{{ end }})
          provider: !KeyOf prov-{{ $slug }}
          # Authentik's application-grouping field, doing double duty: it groups the
          # environments together in the user portal, AND the roles mapping reads it for
          # the short name it puts in the claim. One spelling, from the values matrix --
          # deriving it by stripping "-<cluster>-<stage>" off the client_id would break
          # the day a cluster is added.
          group: {{ $app.name }}
          # any: membership of ANY bound group grants access. Role groups ARE the
          # access groups, so there is no separate access group to keep in sync.
          policy_engine_mode: any
          meta_launch_url: {{ $base }}/
        {{- range $role := $ordered }}

      # One binding per role, parentage notwithstanding: an `-admin`-only member is
      # already admitted through the `-reader` binding they effectively hold
      # (PolicyBinding.passes -> Group.is_member -> user.all_groups()), but binding every
      # role group keeps access legible in the UI and survives a ladder being flattened.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-{{ $slug }}
          group: !KeyOf grp-{{ $slug }}-{{ $role.name }}
        attrs:
          order: {{ index $order $role.name }}
          enabled: true
        {{- end }}
      {{- end }}
    {{- end }}
