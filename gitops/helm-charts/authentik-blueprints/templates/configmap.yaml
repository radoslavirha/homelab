{{- /*
Renders one Authentik blueprint from the application matrix in values.

Shape per environment, which is the topology decision in
docs/superpowers/specs/archive/2026-09-04-authentik-tenancy-topology.md:

  - one OAuth2 provider + one Application per app per environment
  - one Group per role
  - one policy binding per role group onto its Application

INVARIANT: every Application gets at least one binding. An Application with no
binding is readable by EVERY user — Authentik fails open. Because bindings are
generated from the same `roles` list that generates the groups, an app cannot end
up unbound unless `roles` is empty, which the template rejects below.
*/ -}}
{{- $root := . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  # Only keys ending in .yaml are discovered by Authentik.
  homelab-applications.yaml: |
    # GENERATED by gitops/helm-charts/authentik-blueprints. Do not edit here —
    # edit the matrix in gitops/helm-values/server3/authentik-blueprints.yaml.
    version: 1
    metadata:
      name: homelab - applications, groups and access bindings
    entries:

      # ---------- shared scope mappings ----------
      # Two hand-written mappings, bound to every provider below. Both exist because
      # Authentik's shipped `profile` mapping emits a claim we cannot use as-is.

      # Upstream `profile`, minus `groups`.
      #
      # The shipped version ends with
      #   "groups": [group.name for group in request.user.groups.all()]
      # -- EVERY group the user is in, unfiltered by application. Measured 2026-09-04:
      # a qr-manager-server1-sandbox token listed the user's
      # qr-manager-server2-production-admin membership. So the sandbox SPA is told
      # which other clusters and stages the user can reach. Nothing needs that, and
      # the roles mapping below supplies the same information scoped correctly.
      #
      # Cost of owning a copy: if Authentik adds a claim to `profile` upstream, we do
      # not get it until someone updates this. Everything here is from OIDC Core 5.1
      # and does not move.
      - model: authentik_providers_oauth2.scopemapping
        id: pm-profile
        identifiers:
          name: homelab profile
        attrs:
          scope_name: profile
          description: "Standard profile claims. Local copy of the shipped mapping with the unfiltered `groups` claim removed."
          expression: |
            return delete_none_values({
                "name": request.user.name,
                "given_name": ak_obj_attr(request.user, "given_name", "name"),
                "family_name": ak_obj_attr(request.user, "family_name"),
                "preferred_username": request.user.username,
                "nickname": request.user.username,
                "picture": request.user.avatar,
                # `aud` as a one-element ARRAY, not the bare string Authentik defaults to.
                #
                # Both forms are valid -- OIDC Core calls the array the general case and a
                # bare string the permitted special case -- but the shape must not CHANGE
                # later. It would, the day one login is allowed to call several APIs (see
                # the `accesses` design), and code written as `aud === "<client_id>"` would
                # have worked for months before breaking. Emitting the array from the start
                # makes that mistake fail on the very first request instead.
                #
                # It lives HERE, and only here. Authentik merges list-valued claims from
                # several mappings by CONCATENATION, not replacement -- setting it in the
                # roles mapping as well produced
                #   aud: ["qr-manager-server1-sandbox", "qr-manager-server1-sandbox"]
                # (measured). `profile` is the right single home: it is in the documented
                # scope string, and a client that omits it gets no user claims at all.
                "aud": [provider.client_id],
            })

      # `roles` -- what the APIs authorize on.
      #
      # Groups are named <client_id>-<role>, because Authentik group names are GLOBALLY
      # unique (verified: creating `admin` under two different parents is rejected), so
      # the environment has to be in the name to keep the objects apart. None of that
      # belongs in the token: an API must not authorize on "server1" or "sandbox".
      #
      # So this strips the client_id prefix and re-prefixes with the application's short
      # name, taken from Application.group -- set below from the values matrix, which is
      # the single source of truth for that spelling. Result: `qr-manager.admin`, the
      # SAME string in every cluster and stage. Environment is enforced by aud and iss,
      # which the verifier checks once per request, long before a route reads a role.
      #
      # The filter is what keeps one application's roles out of another's token.
      #
      # Claim name: `roles` is the name RFC 9068 (JWT Profile for OAuth 2.0 Access
      # Tokens) uses for exactly this, borrowing it from SCIM. Not binding, but it is
      # the closest thing to a standard spelling, so a future move to another IdP is a
      # remapping rather than a rename.
      - model: authentik_providers_oauth2.scopemapping
        id: pm-roles
        identifiers:
          name: homelab roles
        attrs:
          scope_name: roles
          description: "Application-scoped roles as <app>.<role>. Requested explicitly: scope=openid profile email roles."
          expression: |
            prefix = f"{provider.client_id}-"
            app = provider.application.group or provider.client_id
            return {
                "roles": sorted(
                    f"{app}.{group.name[len(prefix):]}"
                    for group in request.user.all_groups()
                    if group.name.startswith(prefix)
                ),
            }

    {{- /*
    ---------- `kind`: what sort of client this is ----------

    Three kinds, and `kind` is OURS -- it is not Authentik's `client_type`, which stays
    public/confidential and is DERIVED from this.

      api     (default)  Serves a host. A human's browser logs in. Public + PKCE.
      client             A human drives it, and it calls other applications' APIs
                         (Postman). Public + PKCE, `accesses`, `redirectUris`.
      device             A machine. No browser, no human. Confidential +
                         client_credentials, `accesses` carrying an explicit role,
                         a blueprint-declared service account, no redirect URIs.

    A device, like a client, declares several environments and gets ONE client whose
    audience covers all of them -- one client_id, one secret to flash, one service account
    placed in each environment's role group. That is how a device reaches both a bench and
    its deployment on a single credential.

    `accesses` is what both non-api kinds have in common: the list of applications whose
    audience this client's token carries. Two invariants carry the design, and both are
    enforced rather than documented:

    - A client is never anyone's target. Clients are clients and APIs are APIs. Without
      this the tempting one-line edit is to hand `qr-manager-local` an `accesses` list,
      which deletes the property that makes the `-local` clients safe.
    - Targets resolve WITHIN ONE ENVIRONMENT (below), never across. The `roles` claim is
      environment-free by construction -- `qr-manager.admin` is the same string in every
      cluster and stage -- so `aud` and `iss` are the only things pinning a token to an
      environment. A client whose audience spanned two of them would put a sandbox
      admin's role in a token the production API accepts, with no object misconfigured.

    Where the two differ is WHOSE groups fill the roles claim. A `client` borrows the
    human's: whatever the person logging in already holds at the target. A `device` has
    no human, so its access must name the role, and the chart puts its service account in
    that group. Hence `accesses: [qr-manager]` for a client and
    `accesses: [{ app: qr-manager, role: reader }]` for a device.

    Design: docs/superpowers/specs/2026-09-08-device-identity-esp32.md and
    docs/superpowers/specs/archive/2026-09-08-multi-audience-tokens.md.
    */ -}}
    {{- $appNames := list }}
    {{- $targetNames := list }}
    {{- $byName := dict }}
    {{- range $a := .Values.applications }}
      {{- $appNames = append $appNames $a.name }}
      {{- $_ := set $byName $a.name $a }}
      {{- range $t := (default (list) $a.accesses) }}
        {{- if kindIs "map" $t }}
          {{- $targetNames = append $targetNames $t.app }}
        {{- else }}
          {{- $targetNames = append $targetNames (toString $t) }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- /*
    The SHARED `homelab roles` mapping strips `<client_id>-` off a group name, which is a
    prefix rule: if one api's name prefixed another's, a group of the longer would match
    the shorter and render a role out of the leftover. Broad clients enumerate exact pairs
    and are immune; these are not, so the collision is refused here instead.
    */ -}}
    {{- range $a := .Values.applications }}
      {{- if eq (default "api" $a.kind) "api" }}
        {{- range $b := $root.Values.applications }}
          {{- if and (eq (default "api" $b.kind) "api") (ne $a.name $b.name) }}
            {{- if hasPrefix (printf "%s-" $a.name) $b.name }}
              {{- fail (printf "application %q is a prefix of %q: the shared roles mapping strips %q off a group name, so %q's groups would match it and render a role from the leftover" $a.name $b.name (printf "%s-" $a.name) $b.name) }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- range $a := .Values.applications }}
      {{- $kind := default "api" $a.kind }}
      {{- if not (has $kind (list "api" "client" "device")) }}
        {{- fail (printf "application %q has kind %q: must be one of api, client, device" $a.name $kind) }}
      {{- end }}
      {{- if eq $kind "api" }}
        {{- if $a.accesses }}
          {{- fail (printf "application %q declares `accesses` but is kind api: an application that calls other applications' APIs is kind client (a human drives it) or kind device (a machine does)" $a.name) }}
        {{- end }}
      {{- else }}
        {{- if not $a.accesses }}
          {{- fail (printf "application %q is kind %q but declares no `accesses`: it would render a client with an audience of only itself, which reaches nothing" $a.name $kind) }}
        {{- end }}
        {{- if has $a.name $targetNames }}
          {{- fail (printf "application %q is kind %q and is also named as another application's target: an application is a client or an API, not both" $a.name $kind) }}
        {{- end }}
        {{- if or $a.host $a.hostPrefix $a.basePath $a.redirectPath $a.logoutPath }}
          {{- fail (printf "application %q is kind %q and declares a host (or redirectPath/logoutPath): it has no deployment of its own" $a.name $kind) }}
        {{- end }}
        {{- range $t := $a.accesses }}
          {{- $tName := "" }}
          {{- if kindIs "map" $t }}{{- $tName = $t.app }}{{- else }}{{- $tName = toString $t }}{{- end }}
          {{- if eq $tName $a.name }}
            {{- fail (printf "application %q lists itself in `accesses`" $a.name) }}
          {{- end }}
          {{- if not (has $tName $appNames) }}
            {{- fail (printf "application %q lists %q in `accesses`, which is not an application in this matrix" $a.name $tName) }}
          {{- end }}
          {{- if eq $kind "device" }}
            {{- if not (kindIs "map" $t) }}
              {{- fail (printf "application %q is kind device: every `accesses` entry must be `{ app: <name>, role: <role> }`, not a bare name -- a device has no human whose groups could supply the role" $a.name) }}
            {{- end }}
            {{- if not $t.role }}
              {{- fail (printf "application %q is kind device and its access to %q names no `role`" $a.name $tName) }}
            {{- end }}
            {{- $target := index $byName $tName }}
            {{- $targetRoles := list }}
            {{- range $tr := (default (list) $target.roles) }}
              {{- if kindIs "map" $tr }}
                {{- $targetRoles = append $targetRoles $tr.name }}
              {{- else }}
                {{- $targetRoles = append $targetRoles (toString $tr) }}
              {{- end }}
            {{- end }}
            {{- if not (has $t.role $targetRoles) }}
              {{- fail (printf "application %q asks for role %q on %q, which declares no such role: the group would not exist and the device would authenticate into nothing" $a.name $t.role $tName) }}
            {{- end }}
          {{- else }}
            {{- if kindIs "map" $t }}
              {{- fail (printf "application %q is kind client: `accesses` entries are bare application names. The role comes from the groups the HUMAN logging in already holds, not from this file" $a.name) }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if eq $kind "device" }}
        {{- if $a.roles }}
          {{- fail (printf "application %q is kind device and declares `roles`: a device holds no roles of its own. Its policy bindings and its service account's memberships come from the TARGET applications' role groups, named in `accesses`" $a.name) }}
        {{- end }}
        {{- if $a.redirectUris }}
          {{- fail (printf "application %q is kind device and declares `redirectUris`: client_credentials has no redirect" $a.name) }}
        {{- end }}
      {{- else }}
        {{- if eq $kind "client" }}
          {{- if not $a.redirectUris }}
            {{- fail (printf "application %q is kind client but declares no `redirectUris`: it serves no host, so its callback cannot be derived" $a.name) }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}

    {{- /*
    Devices LAST. A device's policy bindings and its service account's group memberships
    are `!KeyOf` references to the TARGET applications' role groups, and `!KeyOf` resolves
    only against entries that already have a model instance -- so a device emitted before
    its target fails with "failed to find entry with `id`". Ordering by kind here means
    the matrix can be written in whatever order reads best.

    (This is also why devices are not split into a second ConfigMap key to shorten the
    apply: `!KeyOf` does not cross blueprint files. It would have to become `!Find` on
    group NAMES, trading a render-time error for a runtime one.)
    */ -}}
    {{- $orderedApps := list }}
    {{- range $a := .Values.applications }}
      {{- if ne (default "api" $a.kind) "device" }}
        {{- $orderedApps = append $orderedApps $a }}
      {{- end }}
    {{- end }}
    {{- range $a := .Values.applications }}
      {{- if eq (default "api" $a.kind) "device" }}
        {{- $orderedApps = append $orderedApps $a }}
      {{- end }}
    {{- end }}

    {{- range $app := $orderedApps }}
      {{- $kind := default "api" $app.kind }}
      {{- $isDevice := eq $kind "device" }}
      {{- $isBroad := ne $kind "api" }}
      {{- if and (not $app.roles) (not $isDevice) }}
        {{- fail (printf "application %q has no roles: it would render an Application with no policy binding, which is open to every user" $app.name) }}
      {{- end }}

      {{- /*
      The role ladder -- normalised, validated, ordered.

      A role is either a bare string (no parent) or `{ name: admin, inherits: editor }`.
      `inherits` becomes Authentik group parentage. Membership flows UPWARD, so the
      ladder is written most-privileged first and `admin` is the CHILD of `editor`: a
      member of `-admin` is an effective member of `-editor` and `-reader`, and the roles
      mapping above -- which already calls all_groups() -- puts all three in the claim.
      That is what lets an API set one role as a class-level floor instead of repeating
      every role on every route.

      Design: docs/superpowers/specs/archive/2026-09-08-role-hierarchy.md
      */ -}}
      {{- $roles := list }}
      {{- $names := list }}
      {{- range $r := $app.roles }}
        {{- if kindIs "string" $r }}
          {{- $roles = append $roles (dict "name" $r "inherits" "") }}
          {{- $names = append $names $r }}
        {{- else }}
          {{- if not $r.name }}
            {{- fail (printf "application %q has a role entry with no `name`" $app.name) }}
          {{- end }}
          {{- $roles = append $roles (dict "name" $r.name "inherits" (default "" $r.inherits)) }}
          {{- $names = append $names $r.name }}
        {{- end }}
      {{- end }}
      {{- if ne (len $names) (len (uniq $names)) }}
        {{- fail (printf "application %q declares the same role twice: both entries render the same group name, and the second would silently overwrite the first" $app.name) }}
      {{- end }}
      {{- range $r := $roles }}
        {{- if $r.inherits }}
          {{- if eq $r.inherits $r.name }}
            {{- fail (printf "application %q: role %q inherits itself" $app.name $r.name) }}
          {{- end }}
          {{- if not (has $r.inherits $names) }}
            {{- fail (printf "application %q: role %q inherits %q, which this application does not declare -- a dangling parent renders a group nobody is in, and a privilege that never arrives" $app.name $r.name $r.inherits) }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- /*
      Binding order comes from DECLARATION order and is written as an attr, not an
      identifier. Rungs get inserted in the middle; an order that is part of the identity
      would make every role below the new one look like a binding that does not exist yet,
      creating a second binding beside the one it already had.
      */ -}}
      {{- $order := dict }}
      {{- range $i, $r := $roles }}
        {{- $_ := set $order $r.name $i }}
      {{- end }}

      {{- /*
      Parents must be APPLIED before their children: !KeyOf resolves only against entries
      that already have a model instance, so a child emitted first fails its entry with
      "failed to find entry with `id` ... and a model instance". Emit the parentless roles,
      then whatever became emittable, N passes deep. A ladder of N roles is at most N deep,
      so a role still unemitted after N passes is in a cycle -- which Authentik itself does
      not reject: GroupSerializer.parents has no cycle validation.
      */ -}}
      {{- $ordered := list }}
      {{- $emitted := list }}
      {{- range $pass := until (len $roles) }}
        {{- range $r := $roles }}
          {{- if not (has $r.name $emitted) }}
            {{- if or (not $r.inherits) (has $r.inherits $emitted) }}
              {{- $ordered = append $ordered $r }}
              {{- $emitted = append $emitted $r.name }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if ne (len $ordered) (len $roles) }}
        {{- fail (printf "application %q has a cycle in `inherits`: %v could not be ordered parent-first" $app.name (without $names $emitted)) }}
      {{- end }}
      {{- /*
      An `api` renders one Application PER ENVIRONMENT. A `client` or a `device` renders
      exactly ONE, whose audience covers every environment it lists -- one credential, one
      login, every API. So the loop below runs once per environment for an api, and once
      in total for the other two kinds.

      What that costs, stated where it is decided: the `roles` claim is environment-free
      (`qr-manager.admin` is the same string everywhere), so a token naming several
      environments carries the UNION of the holder's roles across them. An API cannot tell
      which environment a role came from. Holding `admin` in sandbox and `reader` in
      production therefore means admin in both. Accepted deliberately -- the alternative
      was a token per environment, and re-fetching one is as disruptive as logging in.
      */ -}}
      {{- $envs := $app.environments }}
      {{- if $isBroad }}
        {{- $envs = list (dict "broad" true) }}
      {{- end }}
      {{- range $env := $envs }}
        {{- $isLocal := and (not $isBroad) (eq (default "" $env.stage) "local") }}
        {{- if and $isLocal $env.cluster }}
          {{- fail (printf "application %q has a local environment with a cluster: a developer machine is not a cluster, and the slug would be wrong" $app.name) }}
        {{- end }}
        {{- $slug := "" }}
        {{- $base := "" }}
        {{- $targets := list }}
        {{- if $isBroad }}
          {{- /*
          One client. Its slug carries NO environment, because it is not of one, and its
          targets are the union over every environment it lists. An environment that
          resolves to no target at all is still an error -- that is a typo, not a ragged
          matrix.
          */ -}}
          {{- $slug = $app.name }}
          {{- range $ae := $app.environments }}
            {{- $aKey := ternary "local" (printf "%s-%s" (default "" $ae.cluster) (default "" $ae.stage)) (eq (default "" $ae.stage) "local") }}
            {{- $before := len $targets }}
            {{- range $t := $app.accesses }}
              {{- $tName := "" }}
              {{- $tRole := "" }}
              {{- if kindIs "map" $t }}
                {{- $tName = $t.app }}
                {{- $tRole = default "" $t.role }}
              {{- else }}
                {{- $tName = toString $t }}
              {{- end }}
              {{- range $other := $root.Values.applications }}
                {{- if eq $other.name $tName }}
                  {{- range $oe := $other.environments }}
                    {{- $oKey := ternary "local" (printf "%s-%s" (default "" $oe.cluster) (default "" $oe.stage)) (eq (default "" $oe.stage) "local") }}
                    {{- if eq $oKey $aKey }}
                      {{- $targets = append $targets (dict "slug" (printf "%s-%s" $other.name $aKey) "name" $other.name "role" $tRole) }}
                    {{- end }}
                  {{- end }}
                {{- end }}
              {{- end }}
            {{- end }}
            {{- if eq (len $targets) $before }}
              {{- fail (printf "application %q lists environment %q, where none of its `accesses` exist: nothing would be added to its audience" $app.name $aKey) }}
            {{- end }}
          {{- end }}
        {{- else }}
          {{- $envKey := ternary "local" (printf "%s-%s" (default "" $env.cluster) (default "" $env.stage)) $isLocal }}
          {{- $slug = printf "%s-%s" $app.name $envKey }}
          {{- if $isLocal }}
            {{- $base = printf "http://localhost:%v" (default 5173 $app.localPort) }}
          {{- else }}
            {{- $host := $app.host }}
            {{- if not $host }}
              {{- $host = ternary
                    (printf "%s.%s.%s" $app.hostPrefix $env.cluster $root.Values.domain)
                    (printf "%s.%s.%s.%s" $app.hostPrefix $env.stage $env.cluster $root.Values.domain)
                    (eq $env.stage "production") }}
            {{- end }}
            {{- $base = printf "https://%s%s" $host (default "" $app.basePath) }}
          {{- end }}
        {{- end }}
        {{- $auds := list $slug }}
        {{- range $t := $targets }}
          {{- $auds = append $auds $t.slug }}
        {{- end }}
        {{- /*
        EXACT group -> claim pairs for this client, not a prefix rule.

        The prefix version was wrong and the bug was live: a client named `interactive-map`
        matched `interactive-map-feeder-...-reader` on `startswith`, and emitted
        `interactive-map.feeder-server1-production-reader` as a role. Any client whose name
        prefixes another application's name hits it. Enumerating the pairs -- which needs
        only the target's declared roles, known here -- removes the class of bug entirely.
        */ -}}
        {{- $claims := list }}
        {{- $claimed := list }}
        {{- range $t := $targets }}
          {{- $tApp := index $byName $t.name }}
          {{- range $tr := (default (list) $tApp.roles) }}
            {{- $trName := "" }}
            {{- if kindIs "map" $tr }}{{- $trName = $tr.name }}{{- else }}{{- $trName = toString $tr }}{{- end }}
            {{- $g := printf "%s-%s" $t.slug $trName }}
            {{- if not (has $g $claimed) }}
              {{- $claimed = append $claimed $g }}
              {{- $claims = append $claims (dict "group" $g "claim" (printf "%s.%s" $t.name $trName)) }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- range $role := $ordered }}
          {{- $g := printf "%s-%s" $slug $role.name }}
          {{- if not (has $g $claimed) }}
            {{- $claimed = append $claimed $g }}
            {{- $claims = append $claims (dict "group" $g "claim" (printf "%s.%s" $app.name $role.name)) }}
          {{- end }}
        {{- end }}

      # ---------- {{ $slug }} ----------
        {{- range $role := $ordered }}
      - model: authentik_core.group
        id: grp-{{ $slug }}-{{ $role.name }}
        identifiers:
          name: {{ $slug }}-{{ $role.name }}
        attrs:
          # Emitted on EVERY role, empty list included. A blueprint leaves a field it does
          # not mention exactly as it found it, so a role that loses its `inherits` in
          # values would otherwise keep granting its parent forever.
        {{- if $role.inherits }}
          parents:
            - !KeyOf grp-{{ $slug }}-{{ $role.inherits }}
        {{- else }}
          parents: []
        {{- end }}
        {{- end }}
        {{- /*
        ---------- the client-only pair, one copy per client ----------

        A client-only app binds these INSTEAD of the shared `homelab profile` / `homelab
        roles`. Both lists are baked from the values matrix at render time, so no property
        mapping expression ever looks up another application's objects, and the audience of
        a client is readable in git rather than only on the instance.

        `aud` still lives in exactly ONE mapping per provider. Authentik merges list-valued
        claims from several mappings by CONCATENATION, so binding this copy ALONGSIDE the
        shared one would duplicate every entry -- measured, see the shared mapping above.

        The roles half is the one that is easy to miss. The shared mapping filters on the
        ISSUING client_id, which here would collect this client's own gate group and
        nothing else: a token that verifies at every API it addresses and is authorized at
        none of them. Widening `aud` without this turns a 401 into a 403.
        */ -}}
        {{- if $app.accesses }}

      # This client calls other applications' APIs, so it carries its own copies of the two
      # local mappings: `aud` names every API it may call, and `roles` is collected from
      # THEIR role groups rather than from anything named {{ $app.name }}.
      - model: authentik_providers_oauth2.scopemapping
        id: pm-profile-{{ $slug }}
        identifiers:
          name: homelab profile ({{ $slug }})
        attrs:
          scope_name: profile
          description: "Standard profile claims for {{ $slug }}, whose `aud` names every API it may call."
          expression: |
            return delete_none_values({
                "name": request.user.name,
                "given_name": ak_obj_attr(request.user, "given_name", "name"),
                "family_name": ak_obj_attr(request.user, "family_name"),
                "preferred_username": request.user.username,
                "nickname": request.user.username,
                "picture": request.user.avatar,
                # This client's own id, then one entry per API it may call.
                #
                # Widening `aud` is only half of what makes those APIs reachable: issuer_mode
                # is per_provider, so `iss` stays {{ $slug }} whatever the audience says, and
                # each API listed here needs a trusted-issuer row for this client on its own
                # side. Without that row the widened audience changes nothing.
                "aud": [
                    {{- range $a := $auds }}
                    "{{ $a }}",
                    {{- end }}
                ],
            })

      - model: authentik_providers_oauth2.scopemapping
        id: pm-roles-{{ $slug }}
        identifiers:
          name: homelab roles ({{ $slug }})
        attrs:
          scope_name: roles
          description: "Roles for {{ $slug }}, collected from every application it may call. Requested explicitly: scope=openid profile email roles."
          expression: |
            # Groups name the RESOURCE, not the client that logs in. A token minted here
            # carries `qr-manager.editor` because the user holds a qr-manager editor group
            # -- not because they hold anything named {{ $app.name }}.
            #
            # This is the half that `aud` alone does not solve. The shared `homelab roles`
            # mapping filters on the ISSUING client_id, which for this client would collect
            # its own gate group and nothing else: a token that verifies at every API it
            # addresses and is authorized at none of them.
            #
            # THE TABLE BELOW SPANS ENVIRONMENTS, and the claim it produces cannot say
            # which one a role came from: qr-manager-server1-sandbox-admin and
            # qr-manager-server2-production-admin both render `qr-manager.admin`. That is
            # the accepted cost of one credential for every environment -- holding a role
            # in ANY environment listed here grants it in ALL of them. Narrowing it means
            # going back to a client per environment, which means a token per environment.
            #
            # Exact pairs, not a prefix rule: a client whose name prefixes another
            # application's name would otherwise strip the wrong number of characters and
            # invent a role out of the remainder.
            claims = {
                {{- range $c := $claims }}
                "{{ $c.group }}": "{{ $c.claim }}",
                {{- end }}
            }
            # all_groups() returns direct groups PLUS their ancestors, so a role ladder in
            # a target application arrives here whole, exactly as it does in that
            # application's own token. The set dedupes the same role reached through
            # several environments.
            return {
                "roles": sorted({
                    claims[group.name]
                    for group in request.user.all_groups()
                    if group.name in claims
                }),
            }
        {{- end }}

      - model: authentik_providers_oauth2.oauth2provider
        id: prov-{{ $slug }}
        identifiers:
          name: {{ $slug }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          # default-invalidation-flow, NOT default-provider-invalidation-flow.
          #
          # The provider flow is the one that deliberately does not end the
          # authentik session: it ends only the application's, so Log out
          # followed by Log in signs the user straight back in with no prompt.
          # With SSO across five applications that is not a logout, it is a
          # confusing no-op, and it is why the UI used to carry a second
          # "Sign out everywhere" button.
          #
          # This flow runs the user_logout stage, so RP-initiated logout ends
          # the session itself and then honours post_logout_redirect_uri —
          # one button, and the user lands back on the app.
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          # per_provider (the model default), reversing the earlier choice of global.
          #
          # Every provider signs with the SAME key -- measured 2026-09-04: identical kid,
          # and a token minted for one application verifies cleanly against another's
          # JWKS URL. So a valid signature says "this IdP" and nothing about which
          # application. Under `global` the only claim separating the applications is
          # `aud`, and `aud` is an optional argument in every JWT library: omit it and
          # nothing complains. Under `per_provider` the iss differs too --
          # https://auth.irha.cz/application/o/<client_id>/ -- and a verifier built from
          # a discovery document pins iss structurally, because the client IS the issuer.
          # That makes the lazy implementation app-scoped instead of IdP-scoped.
          #
          # Nothing else moves: the authorize and token endpoints stay shared, and the
          # signing key stays shared. This is a second belt, not a fix for the key --
          # that is per-provider signing certificates, deferred.
          #
          # The rejected reasoning was "each application then needs its own trusted-issuer
          # row in packages/auth". True but small: it is ONE row per deployment carrying a
          # per-environment value, exactly like apiBaseURL already does -- not N rows per
          # API. Landed before any verifier existed, when the cost was zero; afterwards it
          # would mean updating every deployment's config and breaking live tokens until
          # their next renewal.
          issuer_mode: per_provider
        {{- if $isDevice }}
          # A machine: confidential, because there is no browser to run PKCE in and no
          # human to be redirected. The secret is the whole credential.
          #
          # `client_secret` is deliberately NOT set here. Authentik generates one when it
          # creates the provider, and a blueprint leaves a field it does not mention
          # exactly as it found it -- so the value survives every re-apply. Read it once
          # from the provider page in the UI and put it into that device's firmware.
          #
          # The rejected alternative was OpenBao -> ExternalSecret -> the worker's env ->
          # `!Env` here. It buys a secret recoverable without the database, and it costs
          # a KV path, an ExternalSecret entry and an env var per device. It is not worth
          # it HERE because this instance's recovery unit is already the Postgres backup
          # plus AUTHENTIK_SECRET_KEY: human group memberships are deliberately not in git
          # either, so a rebuild without the database already means re-granting access by
          # hand. A device secret is the same class of fact.
          #
          # What that costs: rebuild Authentik WITHOUT its database and every device gets
          # a new secret and must be reflashed.
          client_type: confidential
        {{- else }}
          # SPA: public client, PKCE, no secret to store or rotate.
          client_type: public
        {{- end }}
          client_id: {{ $slug }}
          sub_mode: user_username
          # REQUIRED. The model default is an empty list, and empty grant_types makes
          # /application/o/authorize/ reject every request with invalid_request
          # ("The request is otherwise malformed") before any policy is evaluated.
        {{- if $isDevice }}
          grant_types:
            # No authorization_code: there is no browser, and no redirect URI below for
            # one to come back to. No refresh_token either -- client_credentials IS the
            # refresh: the device presents its secret again and gets a new token.
            - client_credentials
        {{- else }}
          grant_types:
            - authorization_code
          {{- if $app.accesses }}
            # No refresh_token, deliberately. This client's token is addressed to several
            # APIs at once and nothing in this design introspects -- every verifier checks
            # the signature offline -- so expiry is the ONLY revocation there is. A refresh
            # token would make a credential worth N APIs effectively permanent. Re-running
            # the browser login every {{ $root.Values.accessTokenValidity }} is the price,
            # and it is what keeps removing someone from a group meaningful.
          {{- else }}
            - refresh_token
          {{- end }}
        {{- end }}
        {{- if not $isDevice }}
          access_code_validity: {{ $root.Values.accessCodeValidity }}
        {{- end }}
        {{- if $isDevice }}
          # SHORT on purpose. Nothing here introspects -- every verifier checks the
          # signature offline -- so this number IS the revocation latency: a device stays
          # admitted for up to this long after its groups are cut.
          #
          # It can be short because a device does not have to store anything: a token
          # lives in an ESPHome `global` in RAM, and client_credentials is its own refresh
          # -- the device presents its secret again and gets a new one. Losing it on
          # reboot costs one extra request.
          #
          # What it must NOT become is a token request per API request. Authentik runs
          # update_or_create() on the service account on EVERY client_credentials call, so
          # that is a database write per API call -- at a 10-second poll, 8640 writes a day
          # per device. Fetch on expiry, not per request. Override with
          # `accessTokenValidity` per device.
          access_token_validity: {{ default $root.Values.deviceAccessTokenValidity $app.accessTokenValidity }}
        {{- else }}
          access_token_validity: {{ default $root.Values.accessTokenValidity $app.accessTokenValidity }}
        {{- end }}
          # For a `local` environment $base is http://localhost:<port>, so these are
          # the loopback URIs and there is no separate special case below.
          #
          # Local development used to be a pair of loopback URIs bolted onto every
          # *sandbox* application. That worked, and it meant a developer machine could
          # complete a login as a real sandbox client — the same client_id, the same
          # audience, the same groups as the deployed sandbox. A `local` environment
          # is its own application instead: its own client_id, its own issuer, its own
          # role groups, revocable on its own. Sandbox clients now register only their
          # deployed host, and a loopback URI exists on exactly the client whose entire
          # purpose is a developer machine.
          #
          # Not a bypass: localhost is a secure context so PKCE works, the flow is the
          # real one against the real IdP, and the token is a real RS256 token. What it
          # is not is a *sandbox* token — an API that wants to accept it needs the local
          # application as a trusted issuer row, which is exactly the point: that row
          # lives in the developer's own config and never ships.
        {{- if $isDevice }}
          # REQUIRED even here. client_credentials has no redirect, but the provider
          # serializer rejects the entry outright without this key -- measured 2026-09-09:
          # "Serializer errors {'redirect_uris': [... 'This field is required.']}", which
          # failed the WHOLE blueprint, not just this entry. An empty list is the faithful
          # expression of "this client has no redirect".
          redirect_uris: []
        {{- else }}
          redirect_uris:
          {{- if $app.accesses }}
            # A client-only app serves no host, so the callback belongs to the tool rather
            # than to a deployment of ours. No logout URI: there is no page to return to.
            {{- range $uri := $app.redirectUris }}
            - matching_mode: strict
              url: {{ $uri }}
              redirect_uri_type: authorization
            {{- end }}
          {{- else }}
            {{- /*
            Our own apps (qr-manager-ui, homelab-dashboard, ...) all answer OAuth
            callbacks at /callback and return to / on logout. Third-party apps we don't
            control (ArgoCD, Grafana, Headlamp, ...) each have their own fixed callback
            path, so redirectPath/logoutPath let a single api-kind entry override it —
            defaults keep every existing app's rendered output byte-identical.
            */}}
            - matching_mode: strict
              url: {{ $base }}{{ default "/callback" $app.redirectPath }}
              redirect_uri_type: authorization
            - matching_mode: strict
              url: {{ $base }}{{ default "/" $app.logoutPath }}
              redirect_uri_type: logout
          {{- end }}
        {{- end }}
          property_mappings:
            {{- range $scope := $root.Values.scopes }}
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-{{ $scope }}]]
            {{- end }}
        {{- if $app.accesses }}
            # This client's OWN copies, carrying its audience list and its role table.
            # Not the shared pair -- binding both would duplicate `aud`.
            - !KeyOf pm-profile-{{ $slug }}
            - !KeyOf pm-roles-{{ $slug }}
        {{- else }}
            # Local, not the shipped ones -- see the entries at the top of this blueprint.
            - !KeyOf pm-profile
            - !KeyOf pm-roles
        {{- end }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, {{ $root.Values.signingKeyName }}]]

      - model: authentik_core.application
        id: app-{{ $slug }}
        identifiers:
          slug: {{ $slug }}
        attrs:
          name: {{ $app.title }}{{ if not $isBroad }} ({{ if $isLocal }}local{{ else }}{{ $env.cluster }}/{{ $env.stage }}{{ end }}){{ end }}
          provider: !KeyOf prov-{{ $slug }}
          # Authentik's application-grouping field, doing double duty: it groups the
          # environments together in the user portal, AND the roles mapping reads it for
          # the short name it puts in the claim. One spelling, from the values matrix --
          # deriving it by stripping "-<cluster>-<stage>" off the client_id would break
          # the day a cluster is added.
          group: {{ $app.name }}
          # any: membership of ANY bound group grants access. Role groups ARE the
          # access groups, so there is no separate access group to keep in sync.
          policy_engine_mode: any
        {{- if not $app.accesses }}
          meta_launch_url: {{ $base }}/
        {{- end }}
        {{- range $role := $ordered }}

      # One binding per role, parentage notwithstanding: an `-admin`-only member is
      # already admitted through the `-reader` binding they effectively hold
      # (PolicyBinding.passes -> Group.is_member -> user.all_groups()), but binding every
      # role group keeps access legible in the UI and survives a ladder being flattened.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-{{ $slug }}
          group: !KeyOf grp-{{ $slug }}-{{ $role.name }}
        attrs:
          order: {{ index $order $role.name }}
          enabled: true
        {{- end }}
        {{- if $isDevice }}

      # The service account this device's tokens are issued as.
      #
      # Authentik's client_credentials grant does update_or_create() on a username it
      # DERIVES -- `ak-<provider name>-client_credentials` -- and creates it in no groups
      # if it is absent. Left to that, the first token request would produce an empty
      # `roles` claim and then be refused by the bindings below, after creating the user.
      #
      # Declaring it here first is what avoids that: update_or_create finds this one by
      # username and only overwrites name/path/type, so the memberships survive. Only
      # `type` and `groups` are set -- a blueprint leaves fields it does not mention
      # alone, so name and path stay whatever Authentik itself last wrote and the two
      # writers never fight over them.
      #
      # VERIFY the derived username against a real client_credentials request before
      # trusting this: if it differs by one character, Authentik silently creates a
      # SECOND, group-less user beside this one and the device gets a useless token.
      #
      # Unlike a human's memberships -- deliberately not in git -- a service account is
      # not a person, and its access is exactly as reviewable as the device it belongs to.
      - model: authentik_core.user
        id: sa-{{ $slug }}
        identifiers:
          username: ak-{{ $slug }}-client_credentials
        attrs:
          type: service_account
          # REQUIRED by the user serializer -- measured 2026-09-09: omitting it fails the
          # WHOLE blueprint with "Serializer errors {'name': [... 'This field is
          # required.']}".
          #
          # The string is Authentik's OWN, copied from post_init_client_credentials_generated:
          #   f"Autogenerated user from application {app.name} (client credentials)"
          # Matching it exactly is what stops the two writers fighting: this blueprint sets
          # `name` on every apply, and every token request sets it back. Any other spelling
          # would flip on each side's turn forever.
          name: Autogenerated user from application {{ $app.title }} (client credentials)
          groups:
          {{- range $t := $targets }}
            - !KeyOf grp-{{ $t.slug }}-{{ $t.role }}
          {{- end }}
          {{- range $i, $t := $targets }}

      # Bound to the TARGET's role group, not to a gate group of its own.
      #
      # A `client` needs its own gate because many humans share one Postman client. A
      # device does not: it has its own service account, so removing THAT user from this
      # group revokes this device and nothing else. A second group would be an object
      # that exists only to be a switch someone forgets to flip.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-{{ $slug }}
          group: !KeyOf grp-{{ $t.slug }}-{{ $t.role }}
        attrs:
          order: {{ $i }}
          enabled: true
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
