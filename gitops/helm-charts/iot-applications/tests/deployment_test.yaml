suite: deployment tests
templates:
  - templates/deployment.yaml
tests:
  - it: should create a Deployment when rollout is disabled
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.image.tag: "1.0.0"
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: api-iot-my-app

  - it: should NOT create a Deployment when rollout is enabled
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.rollout.enabled: true
      apps.my-app.rollout.strategy: canary
    asserts:
      - hasDocuments:
          count: 0

  - it: should set default replica count to 1
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should respect custom replica count
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should use latest as default image tag
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ":latest$"

  - it: should use provided image tag
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.image.tag: "2.5.1"
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/example/my-app:2.5.1"

  - it: should include standard Helm labels
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - isNotEmpty:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - isNotEmpty:
          path: metadata.labels["app.kubernetes.io/instance"]

  - it: should add container port name when services defined
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.services.http.enabled: true
      apps.my-app.services.http.protocol: TCP
      apps.my-app.services.http.port: 80
      apps.my-app.services.http.targetPort: 4000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 4000

  - it: should render workload annotations on Deployment metadata for Reloader
    # Nested form, not dotted paths: helm-unittest v1.x no longer honours backslash-escaped
    # dots in `set` keys, and silently sets nothing instead of failing. Nested YAML sidesteps
    # path parsing entirely -- the annotation name is a literal key. See the note at the top.
    set:
      apps:
        my-app:
          image:
            repository: ghcr.io/example/my-app
          labels:
            component: api
            partOf: iot
          ingress:
            enabled: false
          annotations:
            reloader.stakater.com/auto: "true"
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      # Must NOT land on the pod template — Reloader only reads workload metadata
      - isNull:
          path: spec.template.metadata.annotations["reloader.stakater.com/auto"]

  - it: should NOT render workload annotations block when annotations unset
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - isNull:
          path: metadata.annotations

  - it: should render only the OTel resource annotations when no podAnnotations
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
    asserts:
      # The OTel resource attributes are always templated onto the pod; nothing else is
      - equal:
          path: spec.template.metadata.annotations
          value:
            resource.opentelemetry.io/service.name: my-app

  - it: should render podAnnotations on the pod template
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.podAnnotations.custom/annotation: "hello"
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
    asserts:
      - equal:
          path: spec.template.metadata.annotations["custom/annotation"]
          value: "hello"
      # podAnnotations are merged with, not substituted for, the OTel resource attributes
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.name"]
          value: my-app

  - it: should template the OTel service.version from image.tag
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.image.tag: "1.2.3"
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            resource.opentelemetry.io/service.name: my-app
            resource.opentelemetry.io/service.version: "1.2.3"

  - it: should quote a numeric image.tag in the OTel service.version
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.image.tag: 1.24
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      # An unquoted tag in values.yaml parses as a float — it must reach the annotation
      # as a string, or the manifest is rejected
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.version"]
          value: "1.24"

  - it: should let podAnnotations override the OTel resource attributes
    # Nested form -- see the note on the Reloader test above.
    set:
      apps:
        my-app:
          image:
            repository: ghcr.io/example/my-app
            tag: "1.2.3"
          labels:
            component: api
            partOf: iot
          ingress:
            enabled: false
          podAnnotations:
            resource.opentelemetry.io/service.name: overridden
    asserts:
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.name"]
          value: overridden
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.version"]
          value: "1.2.3"

  - it: should apply container security context
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.containerSecurityContext.allowPrivilegeEscalation: false
      apps.my-app.containerSecurityContext.readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should apply pod security context
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.podSecurityContext.runAsNonRoot: true
      apps.my-app.podSecurityContext.runAsUser: 1000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000

  - it: should apply liveness and readiness probes
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.livenessProbe.httpGet.path: /health
      apps.my-app.livenessProbe.httpGet.port: http
      apps.my-app.readinessProbe.httpGet.path: /ready
      apps.my-app.readinessProbe.httpGet.port: http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready

  - it: should apply deployment strategy
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.strategy.type: RollingUpdate
      apps.my-app.strategy.rollingUpdate.maxSurge: 1
      apps.my-app.strategy.rollingUpdate.maxUnavailable: 0
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate

  - it: should apply imagePullSecrets
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.imagePullSecrets[0].name: my-registry-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: my-registry-secret

  - it: should set serviceAccountName when serviceAccount.create is true
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: api-iot-my-app

  - it: should set serviceAccountName when serviceAccount.name is provided
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa

  - it: should NOT set serviceAccountName when serviceAccount not configured
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.serviceAccountName

  - it: should apply nodeSelector
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.nodeSelector.disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: should apply default resource requests and limits
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "250m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "500Mi"

  - it: should NOT render lifecycle or terminationGracePeriodSeconds when unset
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.terminationGracePeriodSeconds
      - isNull:
          path: spec.template.spec.containers[0].lifecycle

  - it: should render lifecycle and terminationGracePeriodSeconds when set
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.terminationGracePeriodSeconds: 30
      apps.my-app.lifecycle.preStop.sleep.seconds: 10
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 10

  - it: should render all three probes when set
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.livenessProbe.httpGet.path: /health/live
      apps.my-app.livenessProbe.httpGet.port: http
      apps.my-app.readinessProbe.httpGet.path: /health/ready
      apps.my-app.readinessProbe.httpGet.port: http
      apps.my-app.startupProbe.httpGet.path: /health/live
      apps.my-app.startupProbe.httpGet.port: http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health/live
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health/ready
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health/live

  - it: should NOT render probes when unset
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNull:
          path: spec.template.spec.containers[0].readinessProbe
      - isNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: should NOT render a validator initContainer when validate is unset
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: api-iot-my-app-config-jinja2

  - it: should NOT render a validator initContainer when validate is false
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1

  - it: should render the validator initContainer after the jinja2 one
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.image.tag: "1.2.3"
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: api-iot-my-app-config-jinja2
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: api-iot-my-app-config-validate

  - it: should derive the validator image from the app image and tag
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.image.tag: "1.2.3"
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: ghcr.io/example/my-app-config-validator:1.2.3

  - it: should default the validator tag to latest when the app image has no tag
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: ghcr.io/example/my-app-config-validator:latest

  - it: should allow the validate map form to override image and append args
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.image.tag: "1.2.3"
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate.repository: ghcr.io/example/other-validator
      apps.my-app.templates.config.validate.tag: "9.9.9"
      apps.my-app.templates.config.validate.args:
        - --strict
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: ghcr.io/example/other-validator:9.9.9
      - equal:
          path: spec.template.spec.initContainers[1].args
          value:
            - /config/config.json
            - --strict

  - it: should pass the rendered file path as the validator argument
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: production.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].args[0]
          value: /config/production.json

  - it: should mount the rendered output emptyDir into the validator
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /usr/share/nginx/html/config.json
      apps.my-app.templates.config.subPath: config.json
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].volumeMounts[0].name
          value: api-iot-my-app-tpl-out-config
      - equal:
          path: spec.template.spec.initContainers[1].volumeMounts[0].mountPath
          value: /config
      - lengthEqual:
          path: spec.template.spec.initContainers[1].volumeMounts
          count: 1

  - it: should lock down the validator security context
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.runAsNonRoot
          value: true
      # runAsUser is required, not optional: the validator images declare `USER node`,
      # a name the kubelet cannot resolve, so runAsNonRoot alone gives
      # CreateContainerConfigError. Observed in sandbox before this was added.
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.capabilities.drop
          value:
            - ALL
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should generate one validator per validated template only
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate: true
      apps.my-app.templates.other.file: other.json
      apps.my-app.templates.other.path: /app/other
      apps.my-app.templates.other.content: '{"key":"value"}'
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 3
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: api-iot-my-app-config-validate
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: api-iot-my-app-other-jinja2

  - it: should allow the validate map form to override runAsUser
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /app/config
      apps.my-app.templates.config.content: '{"key":"value"}'
      apps.my-app.templates.config.validate.runAsUser: 65532
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.runAsUser
          value: 65532

  # ── projected ServiceAccount token + CA bundle ─────────────────────────────
  - it: should NOT mount a projected token by default
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  # The case the old `if templates` condition broke: an app with no templates
  # emitted no volumes: key at all, so the projected volume had nowhere to go.
  - it: should emit volumes for a projected token even when the app has no templates
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.serviceAccount.create: true
      apps.my-app.serviceAccount.projectedToken.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: kube-api-access
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken.path
          value: token
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken.expirationSeconds
          value: 3600
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[1].configMap.name
          value: kube-root-ca.crt
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/run/secrets/kubernetes.io/serviceaccount
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true

  # The default-audience token must carry NO audience field — the apiserver
  # rejects tokens whose audience is not in --api-audiences.
  - it: should mint the apiserver token without an audience
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.serviceAccount.create: true
      apps.my-app.serviceAccount.projectedToken.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken.audience

  - it: should add one extra audience-scoped token per audience, keeping the default one
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.serviceAccount.create: true
      apps.my-app.serviceAccount.projectedToken.enabled: true
      apps.my-app.serviceAccount.projectedToken.expirationSeconds: 900
      apps.my-app.serviceAccount.projectedToken.audiences:
        - qr-manager-api
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes[0].projected.sources
          count: 3
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[2].serviceAccountToken.path
          value: token-qr-manager-api
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[2].serviceAccountToken.audience
          value: qr-manager-api
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[2].serviceAccountToken.expirationSeconds
          value: 900

  - it: should keep template volumes alongside the projected token
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.templates.config.file: config.json
      apps.my-app.templates.config.path: /home/app/config
      apps.my-app.templates.config.content: "{}"
      apps.my-app.serviceAccount.create: true
      apps.my-app.serviceAccount.projectedToken.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 3
      - equal:
          path: spec.template.spec.volumes[2].name
          value: kube-api-access
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: kube-api-access

  - it: should fail when an audience is an empty string
    set:
      apps.my-app.image.repository: ghcr.io/example/my-app
      apps.my-app.labels.component: api
      apps.my-app.labels.partOf: iot
      apps.my-app.ingress.enabled: false
      apps.my-app.serviceAccount.create: true
      apps.my-app.serviceAccount.projectedToken.enabled: true
      apps.my-app.serviceAccount.projectedToken.audiences:
        - ""
    asserts:
      - failedTemplate:
          errorMessage: "serviceAccount.projectedToken.audiences must not contain an empty string; omit the entry instead. [apps.my-app.serviceAccount.projectedToken]."
