{{- range $applicationName, $application := .Values.apps | default dict -}}
{{- include "iot-applications.validators.image" (dict "image" $application.image "applicationName" $applicationName) }}
{{- include "iot-applications.validators.services" (dict "services" ($application.services | default dict) "applicationName" $applicationName) }}
{{- $ctx := dict "application" $application "name" $applicationName "release" $.Release "chart" $.Chart -}}
{{/* Prepare resource requests and limits in case they are not set */}}
{{- $resources := $application.resources | default (dict) -}}
{{- $requests := $resources.requests | default (dict) -}}
{{- $limits := $resources.limits | default (dict) -}}
{{/* Resolve main service for CONTAINER_PORT via ingress.serviceRef */}}
{{- $mainServiceRef := $application.ingress.serviceRef | default "" -}}
{{- $mainService := get ($application.services | default dict) $mainServiceRef | default dict -}}
{{/* Resolve UDP service for CONTAINER_UDP_PORT via udpIngress.serviceRef */}}
{{- $udpServiceRef := (($application.udpIngress | default dict).serviceRef | default "") -}}
{{- $udpService := get ($application.services | default dict) $udpServiceRef | default dict -}}
{{- $serviceAccount := $application.serviceAccount | default dict -}}
{{- $projectedToken := include "iot-applications.projectedToken.enabled" $application -}}
{{- if not (($application.rollout | default dict).enabled) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iot-applications.identifier" $ctx }}
  labels: {{ include "iot-applications.meta.labels" $ctx | nindent 4 }}
  {{- with $application.annotations }}
  {{- /* Workload-level annotations. Stakater Reloader reads reloader.stakater.com/auto here — NOT on the pod template. */}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $application.replicas | default 1 }}
  {{- with $application.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{ include "iot-applications.labels.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{ include "iot-applications.labels.selector" $ctx | nindent 8 }}
      {{- /* OTel Resource attributes for SCRAPED pod logs. k8s-monitoring's pod-log
             pipeline labelmaps every resource.opentelemetry.io/* pod annotation into a
             Loki label, and its service_name detection prefers this annotation over the
             app.kubernetes.io/name label.

             service.name is already correct without this (the annotation, the label and
             the SDK's serviceName all resolve to $applicationName) — it is declared here
             so it stops depending on that coincidence.

             service.version is the real gain: it is the one attribute the apps push to
             the SDK that cannot reach stdout, so scraped logs lack it entirely. Templated
             from image.tag so it cannot drift from the deployed image, and it picks up the
             per-environment tag override automatically.

             merge gives precedence to the destination, so a per-app podAnnotations entry
             still overrides either of these. */}}
      {{- $otelResource := dict "resource.opentelemetry.io/service.name" $applicationName }}
      {{- with $application.image.tag }}
      {{- $_ := set $otelResource "resource.opentelemetry.io/service.version" (. | toString) }}
      {{- end }}
      {{- with merge (deepCopy ($application.podAnnotations | default dict)) $otelResource }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if or $serviceAccount.create $serviceAccount.name }}
      serviceAccountName: {{ include "iot-applications.serviceAccountName" $ctx }}
      {{- end }}
      {{- with $application.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $application.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $application.terminationGracePeriodSeconds }}
      {{- /* SIGTERM → SIGKILL budget. Must exceed the preStop sleep plus the app's drain time. */}}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if $application.templates | default dict | len }}
      initContainers:
        {{- /* Loop all the Jinja2 templates, container can process only one template */}}
        {{- range $templateName, $template := $application.templates | default dict }}
        {{- include "iot-applications.validators.template" (dict "name" $templateName "template" $template "applicationName" $applicationName) }}
        - name: {{ include "iot-applications.identifier" $ctx }}-{{ $templateName }}-jinja2
          image: objectiflibre/jinja-init
          env:
            - name: VERBOSE
              value: "1"
            - name: JINJA_SRC_FILE
              value: "/config_src/{{ $template.file }}"
            - name: JINJA_DEST_FILE
              value: "/config/{{ $template.file }}"
            {{- /* Prepare VARS for substitution. */}}
            {{- range $key, $value := $.Values | default dict }}
            {{- if hasPrefix "VAR_" $key }}
            - name: JINJA_VAR_{{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /* Prepare selected VARS from configuration. */}}
            - name: JINJA_VAR_APPLICATION
              value: {{ $applicationName | quote }}
            - name: JINJA_VAR_PATH_NAME
              value: {{ ($application.ingress.pathName | default $applicationName) | quote }}
            - name: JINJA_VAR_COMPONENT
              value: {{ $application.labels.component | quote }}
            - name: JINJA_VAR_APPLICATION_GROUP
              value: {{ $application.labels.partOf | quote }}
            - name: JINJA_VAR_CONTAINER_PORT
              value: {{ $mainService.targetPort | default 80 | toString | quote }}
            {{- if $udpService.targetPort }}
            - name: JINJA_VAR_CONTAINER_UDP_PORT
              value: {{ $udpService.targetPort | toString | quote }}
            {{- end }}
            - name: JINJA_VAR_NAMESPACE
              value: {{ $.Release.Namespace | quote }}
            {{- /* Inject values from secretRefs as JINJA_VAR_ prefixed env vars for Jinja2 substitution. */}}
            {{- range $secretRef := $application.secretRefs | default list }}
            {{- range $key := $secretRef.keys | default list }}
            - name: JINJA_VAR_{{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretRef.name }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          volumeMounts:
            {{- /* Volume with config template. */}}
            - name: {{ include "iot-applications.identifier" $ctx }}-tpl-in-{{ $templateName }}
              mountPath: /config_src
            {{- /* Volume with substituted config file. */}}
            - name: {{ include "iot-applications.identifier" $ctx }}-tpl-out-{{ $templateName }}
              mountPath: /config
        {{- if $template.validate }}
        {{- /* Validates the rendered config before the main container starts. Emitted inside
               the same range and directly after the Jinja2 container, so initContainer order
               guarantees it never reads unrendered template source. */}}
        - name: {{ include "iot-applications.identifier" $ctx }}-{{ $templateName }}-validate
          image: {{ include "iot-applications.template.validatorImage" (dict "application" $application "template" $template) }}
          imagePullPolicy: {{ $application.image.pullPolicy | default "IfNotPresent" }}
          args:
            {{- /* The rendered file, where JINJA_DEST_FILE put it. Not $template.path — that
                   is where the main container mounts it, which the validator never sees. */}}
            - "/config/{{ $template.file }}"
            {{- with (ternary dict $template.validate (kindIs "bool" $template.validate)).args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            runAsNonRoot: true
            {{- /* Defensive default, not a requirement. Both validator images declare
                   `USER 1000` since qr-manager-ui@0.7.1 / homelab-dashboard-ui@0.4.1 and
                   satisfy runAsNonRoot unaided — verified in-cluster with this securityContext
                   and no runAsUser. It is kept because the chart cannot know what an arbitrary
                   validate.repository override contains, and an image whose USER is a NAME
                   fails with CreateContainerConfigError "non-numeric user". Supplying a
                   known-good UID costs nothing; override via validate.runAsUser. */}}
            runAsUser: {{ (ternary dict $template.validate (kindIs "bool" $template.validate)).runAsUser | default 1000 }}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            {{- /* Same emptyDir jinja-init wrote to — validate the rendered output. */}}
            - name: {{ include "iot-applications.identifier" $ctx }}-tpl-out-{{ $templateName }}
              mountPath: /config
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "iot-applications.identifier" $ctx }}
          image: {{ $application.image.repository }}:{{ include "iot-applications.defaults.tag" $application.image.tag }}
          imagePullPolicy: {{ $application.image.pullPolicy | default "IfNotPresent" }}
          {{- with $application.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $application.services | default dict | len }}
          ports:
            {{- range $serviceName, $svc := $application.services | default dict }}
            {{- if $svc.enabled }}
            - name: {{ $serviceName }}
              containerPort: {{ $svc.targetPort | default 80 }}
              protocol: {{ $svc.protocol | default "TCP" }}
            {{- end }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $requests.cpu | default "250m" | quote }}
              memory: {{ $requests.memory | default "250Mi" | quote }}
            limits:
              cpu: {{ $limits.cpu | default "500m" | quote }}
              memory: {{ $limits.memory | default "500Mi" | quote }}
          {{- if $application.secretRefs | default list | len }}
          envFrom:
            {{- /* Mount each secretRef into the main container for runtime access. */}}
            {{- range $secretRef := $application.secretRefs | default list }}
            - secretRef:
                name: {{ $secretRef.name }}
            {{- end }}
          {{- end }}
          {{- if $application.env | default list | len }}
          env:
            {{- toYaml $application.env | nindent 12 }}
          {{- end }}
          {{- with $application.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $application.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $application.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $application.lifecycle }}
          {{- /* preStop.sleep keeps the pod serving while its Endpoints removal propagates
                 to Traefik — without it a rolling update drops requests despite the probes. */}}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* Emitted when EITHER Jinja2 templates or a projected token is wanted —
                 an app with neither must still render a valid pod spec. */}}
          {{- if or ($application.templates | default dict | len) $projectedToken }}
          volumeMounts:
            {{- /* Add volumes with substituted config files from Jinja2 container. */}}
            {{- range $templateName, $template := $application.templates | default dict }}
            {{- include "iot-applications.validators.template" (dict "name" $templateName "template" $template "applicationName" $applicationName) }}
            - name: {{ include "iot-applications.identifier" $ctx }}-tpl-out-{{ $templateName }}
              mountPath: {{ $template.path }}
              {{- if $template.subPath }}
              subPath: {{ $template.subPath }}
              {{- end }}
            {{- end }}
            {{- if $projectedToken }}
            {{- include "iot-applications.projectedToken.volumeMount" $ctx | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with $application.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $application.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $application.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or ($application.templates | default dict | len) $projectedToken }}
      volumes:
        {{- range $templateName, $template := $application.templates | default dict }}
        {{- include "iot-applications.validators.template" (dict "name" $templateName "template" $template "applicationName" $applicationName) }}
        {{- /* ConfigMap with Jinja2 template source. */}}
        - name: {{ include "iot-applications.identifier" $ctx }}-tpl-in-{{ $templateName }}
          configMap:
            name: {{ include "iot-applications.identifier" $ctx }}-tpl-{{ $templateName }}
        {{- /* EmptyDir for Jinja2 rendered output. */}}
        - name: {{ include "iot-applications.identifier" $ctx }}-tpl-out-{{ $templateName }}
          emptyDir: {}
        {{- end }}
        {{- if $projectedToken }}
        {{- include "iot-applications.projectedToken.volume" $ctx | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
{{ end }}