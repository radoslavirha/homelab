{{- range $applicationName, $application := .Values.apps | default dict -}}
{{- include "iot-applications.validators.ingress" (dict "ingress" $application.ingress "applicationName" $applicationName) }}
{{- if $application.ingress.enabled }}
{{- $ctx := dict "application" $application "name" $applicationName "release" $.Release "chart" $.Chart -}}
{{- $refSvcName := $application.ingress.serviceRef | default "" -}}
{{- $refSvc := get ($application.services | default dict) $refSvcName | default dict -}}
{{- $pathName := ternary (toString $application.ingress.pathName) $applicationName (hasKey $application.ingress "pathName") -}}
{{/* Stage sits LEFT of the component: api.sandbox.<domain>, not sandbox.api.<domain>.
     Three reasons, summarised in docs/architecture.md -> "Hostnames and TLS":
       1. Otherwise sandbox is a subdomain of production. A cookie scoped to the
          production host api.<domain> is sent to sandbox.api.<domain>; reversed, the
          two share only the cluster parent and neither inherits from the other.
       2. One wildcard per STAGE (*.sandbox.<domain>) instead of one per COMPONENT.
          Adding an app then costs nothing; before, it cost a new SAN and a reissue.
       3. Stage is a namespace holding many components, not a property of one.
     The subdomain helper already emits a trailing dot, and an empty VAR_SUBDOMAIN
     still yields api.<domain> — production stays implicit. */}}
{{- $computedHostname := printf "%s.%s%s" $application.labels.component (include "iot-applications.subdomain" $.Values.VAR_SUBDOMAIN) $.Values.VAR_PUBLIC_DOMAIN -}}
{{- $hostname := $application.ingress.hostname | default $computedHostname -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "iot-applications.identifier" $ctx }}
  labels: {{ include "iot-applications.meta.labels" $ctx | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /{{ $pathName }}
      backendRefs:
        - name: {{ include "iot-applications.identifier" $ctx }}-{{ $refSvcName }}
          port: {{ $refSvc.port | default 80 }}
      {{- $stripPrefix := dig "stripPrefix" true ($application.ingress | default dict) -}}
      {{- if $stripPrefix }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ include "iot-applications.identifier" $ctx }}-middleware-stripprefix
      {{- end }}
{{ end }}
{{ end }}