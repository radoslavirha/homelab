{{- range $applicationName, $application := .Values.apps | default dict -}}
{{- $ctx := dict "application" $application "name" $applicationName "release" $.Release "chart" $.Chart -}}
{{- range $templateName, $template := $application.templates | default dict -}}
{{- include "iot-applications.validators.template" (dict "name" $templateName "template" $template "applicationName" $applicationName) }}
{{- $name := printf "%s-tpl-%s" (include "iot-applications.identifier" $ctx) $templateName }}
---
{{- /* ESO renders the config file — variables and secrets together — into a Secret the
       pod mounts. The rendered file holds credentials, so it is a Secret, never a
       ConfigMap. Reloader restarts the workload when it changes. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels: {{ include "iot-applications.meta.labels" $ctx | nindent 4 }}
  annotations:
    {{- /* Before the workload (wave 0), so the Secret exists when the pod mounts it. */}}
    argocd.argoproj.io/sync-wave: "-1"
spec:
  {{- if $template.secrets }}
  {{- /* Periodic: a secret rotated in OpenBao re-renders the file within the hour. */}}
  refreshInterval: {{ $.Values.configRender.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml $.Values.configRender.secretStore | nindent 4 }}
  {{- else }}
  {{- /* Nothing to rotate: render only when this ExternalSecret changes. */}}
  refreshPolicy: OnChange
  {{- end }}
  target:
    name: {{ $name }}
    template:
      engineVersion: v2
      data:
        {{ $template.file }}: |-
          {{- include "iot-applications.template.body" (dict "root" $ "application" $application "applicationName" $applicationName "template" $template) | nindent 10 }}
  {{- if $template.secrets }}
  data:
    {{- range $variable, $ref := $template.secrets }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ $ref.key }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
  {{- else }}
  {{- /* ESO rejects an ExternalSecret with neither data nor dataFrom. A UUID generator is
         the anchor for a template without secrets; OnChange keeps the Secret from being
         rewritten (and the pods restarted) on every refresh. Its `uuid` key joins the
         variables and is simply never referenced. */}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: UUID
          name: {{ $name }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: UUID
metadata:
  name: {{ $name }}
  labels: {{ include "iot-applications.meta.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec: {}
  {{- end }}
{{ end }}
{{- end }}
