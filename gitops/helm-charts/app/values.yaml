# One release deploys one application; the release name is the application name
# (ApplicationSet helm.releaseName). Every key below is top-level. Nothing here is set by default — this block documents the schema.

# # replicas is the number of pod replicas. Defaults to 1.
# replicas: 1

# image:
#   # image.repository is the container image repository (required).
#   repository: your-docker-repo/your-application-image
#   # image.tag is the container image tag. Defaults to "latest".
#   tag: latest
#   # image.pullPolicy is the image pull policy. Defaults to "IfNotPresent".
#   # https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
#   pullPolicy: IfNotPresent

# # imagePullSecrets is a list of image pull secrets for private registries.
# # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# imagePullSecrets:
#   - name: my-registry-secret

# # serviceAccount is the Kubernetes ServiceAccount configuration for the pod.
# # When serviceAccount.create is true, a ServiceAccount is created and referenced automatically.
# # When serviceAccount.create is false, set serviceAccount.name to reference an existing one.
# serviceAccount:
#   create: false
#   name: ""
#   annotations: {}
#   # automountServiceAccountToken: false stops the pod receiving an ambient,
#   # long-lived, full-audience token. Leave it false and use projectedToken
#   # below, which is explicit, scoped and short-lived.
#   automountServiceAccountToken: false
#
#   # projectedToken mounts a short-lived ServiceAccount token and the cluster
#   # CA bundle at /var/run/secrets/kubernetes.io/serviceaccount — the
#   # conventional path, so Kubernetes client libraries find them unconfigured.
#   #
#   # Off by default. Enable it only for a workload that actually calls the
#   # Kubernetes apiserver or verifies cluster-issued ServiceAccount tokens.
#   # A static frontend does not need one.
#   #
#   # Both files are required and neither works alone: without ca.crt the TLS
#   # handshake fails, and without the token the apiserver returns 401 because
#   # it runs with --anonymous-auth=false.
#   projectedToken:
#     enabled: false
#     # expirationSeconds is the token lifetime; the kubelet rotates the file
#     # in place before it expires. Minimum 600, Kubernetes default 3600.
#     expirationSeconds: 3600
#     # audiences mints ONE ADDITIONAL token per entry, at path
#     # token-<audience>, each valid only for that callee — so a token stolen
#     # from one service is useless against another.
#     #
#     # These are for service-to-service calls, NOT for the apiserver. The
#     # apiserver only accepts tokens whose audience is in --api-audiences,
#     # so an audience-scoped token 401s against it while looking correct.
#     # The default-audience `token` file is always mounted for that purpose.
#     audiences: []
#       # - qr-manager-api

# # resources defines CPU and memory requests and limits.
# # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
# resources:
#   requests:
#     cpu: 250m
#     memory: 250Mi
#   limits:
#     cpu: 500m
#     memory: 500Mi

# # podSecurityContext applies to every container in the Pod, initContainers included.
# # runAsUser must be NUMERIC: kubelet verifies runAsNonRoot against the image's
# # configured user and cannot map a username to a UID, so an image whose USER is a
# # name fails closed with CreateContainerConfigError "non-numeric user".
# podSecurityContext:
#   runAsNonRoot: true
#   runAsUser: 1000
#   runAsGroup: 1000
#   fsGroup: 1000
#   seccompProfile:
#     type: RuntimeDefault

# # containerSecurityContext applies to the main container only. The config-validator
# # initContainers set their own, unconditionally, in the template.
# containerSecurityContext:
#   allowPrivilegeEscalation: false
#   readOnlyRootFilesystem: true
#   capabilities:
#     drop: [ALL]

# labels:
#   # labels.component is used as the component label and the first hostname label (required).
#   component: api
#   # labels.partOf is used as the base path for ingress (/partOf/application) (required).
#   partOf: iot

# # services is a map of Kubernetes Services to create for this application.
# # Supports multiple protocols per pod (e.g. HTTP + UDP).
# # For Argo Rollouts canary/blueGreen, define service pairs using
# # the names expected by rollout.canary.stableServiceRef etc.
# services:
#   # Each key becomes the service name suffix: {identifier}-{key}
#   http:
#     # services.http.enabled controls whether this service is created (required).
#     enabled: true
#     # services.http.protocol is the protocol: TCP or UDP. Defaults to TCP.
#     protocol: TCP
#     # services.http.port is the ClusterIP service port. Defaults to 80.
#     port: 80
#     # services.http.targetPort is the container target port. Defaults to 80.
#     targetPort: 4000

# ingress:
#   # ingress.enabled controls whether an HTTPRoute + Middleware are created (required).
#   enabled: true
#   # ingress.serviceRef is the key from the services map to use as the HTTPRoute backend.
#   # Required when ingress.enabled is true.
#   serviceRef: http
#   # ingress.hostname overrides the computed hostname (<component>.<vars.domain>).
#   # Use for apps that require a custom domain not following the standard pattern.
#   # Example: dashboard.server3.homelab.irha.cz
#   hostname: ""
#   # ingress.stripPrefix controls whether a Traefik stripPrefix Middleware is created and attached.
#   # Defaults to true. Set to false for UI apps that handle their own base path.
#   stripPrefix: false

# # templates is a map of config files rendered by External Secrets Operator (ESO) into a
# # Secret each, which the main container mounts. Content lives in env-specific values
# # files as multiline strings. ESO re-renders when the content, a vars value or a secret in
# # OpenBao changes; set annotations.reloader.stakater.com/auto (below) so Reloader
# # restarts the pods — the file is read once, at pod start.
# templates:
#   # Each key is the template name. Generates one ExternalSecret -> Secret
#   # <identifier>-tpl-<name>, plus a UUID generator when the template has no secrets.
#   config:
#     # templates.config.file is the destination file name inside the container (required).
#     file: production.json
#     # templates.config.path is the destination path inside the container (required).
#     # For directory mounts (APIs): path: /home/app/config  → file lands at path/file
#     # For single-file mounts (UIs): path: /usr/share/nginx/html/config.json + subPath: config.json
#     path: /home/app/config
#     # templates.config.subPath mounts only this file from the Secret instead of the whole directory.
#     # Use for UIs where the app's serving root must not be shadowed by the volume mount.
#     # subPath: config.json
#     # templates.config.secrets maps a name to an OpenBao entry, read through
#     # configRender.secretStore. Optional; omit it for a template without credentials.
#     secrets:
#       mongodbPassword:
#         key: <cluster>/<env>/my-app-mongodb
#         property: mongodb-password
#     # templates.config.content is an ESO (Go text/template + Sprig) template (required,
#     # defined in env-specific values files). It reads three maps:
#     #   .vars.*     the top-level `vars` map, whole
#     #   .secrets.*  the keys of templates.config.secrets
#     #   .app.*      built-ins: name, group (labels.partOf), component, namespace,
#     #               containerPort (ingress.serviceRef's targetPort), pathName, and
#     #               host — the HTTPRoute hostname, only when ingress is enabled
#     # A missing key fails the ExternalSecret and leaves the previous Secret — and the
#     # running pods — untouched. Pipe a secret through toJson when it may contain
#     # quotes or backslashes: "pass": {{ .secrets.mongodbPassword | toJson }}
#     content: |
#       {
#         "url": "{{ .vars.protocol }}://{{ .app.host }}/{{ .app.pathName }}"
#       }
#     # templates.config.validate generates a second initContainer that checks the RENDERED
#     # config before the main container starts. Opt-in, and only for apps that cannot
#     # validate their own config: the Ts.ED APIs fail their own boot on a bad config, so
#     # they leave this unset. The nginx UIs cannot — nginx has no JSON parser — so without
#     # this they serve a blank page from a pod that reports itself perfectly healthy.
#     # A rejected config gives Init:CrashLoopBackOff and the previous pod keeps serving.
#     # Reason: kubectl logs <pod> -c <identifier>-<template>-validate
#     #
#     # The image defaults to <image.repository>-config-validator:<image.tag>, so the
#     # existing deploy.json tag bump moves the app and its validator together.
#     # The validator mounts the rendered Secret at /config itself, so
#     # templates.config.path and .subPath do not affect it.
#     validate: true
#     # Map form, for when the derived image is not the right one:
#     # validate:
#     #   repository: ghcr.io/radoslavirha/some-other-validator
#     #   tag: "1.2.3"
#     #   args: ["--strict"]
#     #   # UID the validator runs as. Defaults to 1000 (the `node` user in the
#     #   # node:*-alpine base). The chart always supplies one as a defensive default:
#     #   # the shipped validators declare USER 1000 and satisfy runAsNonRoot on their
#     #   # own, but an override image whose USER is a NAME cannot — the kubelet cannot
#     #   # resolve a name and fails with CreateContainerConfigError. Set this only for
#     #   # a validator image built on a base with a different UID.
#     #   runAsUser: 65532

# # env is a list of static environment variables injected into the main container.
# # Supports any valid Kubernetes env entry (value, valueFrom, secretKeyRef, etc.).
# env:
#   - name: NGINX_BASE_PATH
#     value: /my-app

# # annotations is a map of annotations added to the WORKLOAD metadata
# # (Deployment / Rollout) — not the pod template. This is where Stakater
# # Reloader looks. Set it on every app that has templates or consumes
# # secretRefs, otherwise nothing restarts when either one changes.
# annotations:
#   reloader.stakater.com/auto: "true"

# # podAnnotations is a map of extra annotations added to the pod template.
# podAnnotations: {}

# # podSecurityContext is the pod-level security context applied to all containers.
# # https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
# podSecurityContext: {}
#   # runAsNonRoot: true
#   # runAsUser: 1000
#   # fsGroup: 2000

# # containerSecurityContext is the container-level security context.
# containerSecurityContext: {}
#   # allowPrivilegeEscalation: false
#   # readOnlyRootFilesystem: true
#   # capabilities:
#   #   drop: [ALL]

# # Probes. All three are omitted when not set. Deliberately NOT defaulted by the chart:
# # the right path and boot budget differ between the nginx UIs (/healthz) and the Ts.ED
# # APIs (/health/live, /health/ready), and a wrong default silently CrashLoops a new app.
# # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/

# # livenessProbe MUST stay shallow: process-local only, no dependency I/O. A dependency
# # check here turns one database blip into a fleet-wide restart storm.
# livenessProbe: {}
#   # httpGet:
#   #   path: /health/live
#   #   # port refers to a key from the services map, rendered as the container port name.
#   #   port: http
#   # periodSeconds: 10
#   # failureThreshold: 3
#   # timeoutSeconds: 2

# # readinessProbe may check hard dependencies. Failure only removes the pod from the
# # Service Endpoints; it never restarts the container.
# readinessProbe: {}
#   # httpGet:
#   #   path: /health/ready
#   #   port: http
#   # periodSeconds: 5
#   # failureThreshold: 3
#   # timeoutSeconds: 3

# # startupProbe is the boot budget (periodSeconds × failureThreshold). Liveness and
# # readiness are suppressed until it passes once — the modern replacement for
# # initialDelaySeconds guesswork.
# startupProbe: {}
#   # httpGet:
#   #   path: /health/live
#   #   port: http
#   # periodSeconds: 5
#   # failureThreshold: 24

# # terminationGracePeriodSeconds is the SIGTERM → SIGKILL budget.
# # Must exceed the preStop sleep plus the app's own drain time.
# terminationGracePeriodSeconds: 30

# # lifecycle hooks. preStop.sleep (native action, Kubernetes 1.30+) keeps the pod serving
# # while its removal from Endpoints propagates to Traefik. Pod deletion and Endpoints
# # removal are concurrent, so without this a rolling update drops requests even with
# # correct probes.
# lifecycle: {}
#   # preStop:
#   #   sleep:
#   #     seconds: 10

# # strategy is the Deployment update strategy.
# # https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# strategy: {}
#   # type: RollingUpdate
#   # rollingUpdate:
#   #   maxSurge: 1
#   #   maxUnavailable: 0

# # nodeSelector is a map of node labels for pod scheduling.
# nodeSelector: {}

# # tolerations is a list of tolerations for pod scheduling.
# tolerations: []

# # affinity is the affinity rules for pod scheduling.
# affinity: {}

# # secretRefs is a list of Kubernetes Secrets injected into the main container as env
# # vars (envFrom), for an app that reads a credential from its environment at runtime.
# # Config files do NOT use this — they take templates.config.secrets.
# secretRefs:
#   - name: miot-bridge-mqtt-credentials
#     keys:
#       - SECRET_MQTT_MIOT_BRIDGE_USERNAME
#       - SECRET_MQTT_MIOT_BRIDGE_PASSWORD

# # rollout is the Argo Rollouts configuration. Defaults to standard Deployment when not set or enabled: false.
# rollout:
#   # rollout.enabled controls whether an Argo Rollout is emitted instead of a Deployment.
#   # Requires Argo Rollouts controller to be installed.
#   enabled: false
#   # rollout.strategy is the rollout strategy: canary | blueGreen.
#   strategy: canary

#   # canary is the canary strategy options (used when rollout.strategy is canary).
#   # Requires two services defined in the services map: stable + canary.
#   canary:
#     # canary.stableServiceRef is the key from the services map pointing to the stable service.
#     stableServiceRef: stable
#     # canary.canaryServiceRef is the key from the services map pointing to the canary service.
#     canaryServiceRef: canary
#     # canary.steps is the list of rollout steps. See: https://argoproj.github.io/argo-rollouts/features/canary/
#     steps: []
#     # canary.trafficRouting is the Gateway API traffic routing via argoproj-labs/gatewayAPI plugin.
#     trafficRouting:
#       enabled: false
#     # canary.analysis is an optional AnalysisTemplate reference for automated promotion/rollback.
#     analysis: {}

#   # blueGreen is the blueGreen strategy options (used when rollout.strategy is blueGreen).
#   # Requires two services defined in the services map: active + preview.
#   blueGreen:
#     # blueGreen.activeServiceRef is the key from the services map pointing to the active (live) service.
#     activeServiceRef: active
#     # blueGreen.previewServiceRef is the key from the services map pointing to the preview service.
#     previewServiceRef: preview
#     # blueGreen.autoPromotionEnabled controls automatic promotion after all steps complete. Defaults to false.
#     autoPromotionEnabled: false
#     # blueGreen.scaleDownDelaySeconds is the seconds to wait before scaling down the old ReplicaSet after promotion.
#     scaleDownDelaySeconds: 30
#     # blueGreen.prePromotionAnalysis is an optional AnalysisTemplate run before promotion.
#     prePromotionAnalysis: {}
#     # blueGreen.postPromotionAnalysis is an optional AnalysisTemplate run after promotion.
#     postPromotionAnalysis: {}
# vars is read by config templates as {{ .vars.<name> }}; the chart passes it whole and
# never lists its keys. vars.domain is the stage's base domain: every HTTPRoute hostname
# is <labels.component>.<vars.domain> unless ingress.hostname overrides it.
vars: {}

# configRender configures how ESO renders templates into Secrets.
configRender:
  # secretStore is where a template's `secrets` are read from.
  secretStore:
    name: openbao
    kind: ClusterSecretStore
  # refreshInterval bounds how long a secret rotated in OpenBao takes to reach the
  # rendered file (and, through Reloader, the pods). Templates without secrets ignore it.
  refreshInterval: 1h
