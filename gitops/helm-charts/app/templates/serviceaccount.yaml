{{- $applicationName := .Release.Name -}}
{{- $application := .Values -}}
{{- $ctx := dict "application" $application "name" $applicationName "release" $.Release "chart" $.Chart -}}
{{- $serviceAccount := $application.serviceAccount | default dict -}}
{{- if $serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" $ctx }}
  labels: {{ include "app.meta.labels" $ctx | nindent 4 }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if hasKey $serviceAccount "automountServiceAccountToken" }}
{{- if (not $serviceAccount.automountServiceAccountToken) }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
