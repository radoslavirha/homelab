suite: externalsecret tests
templates:
  - templates/externalsecret.yaml
release:
  name: my-app
  namespace: sandbox
tests:
  - it: should render nothing for an app without templates
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should read secrets from OpenBao and refresh periodically
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: production.json
      templates.config.path: /home/app/config
      templates.config.content: '{"pass": {{ .SECRET_PASS | toJson }}}'
      templates.config.secrets.SECRET_PASS.key: server1/sandbox/my-app
      templates.config.secrets.SECRET_PASS.property: password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: api-iot-my-app-tpl-config
      - equal:
          path: spec.target.name
          value: api-iot-my-app-tpl-config
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: spec.refreshInterval
          value: 1h
      - equal:
          path: spec.secretStoreRef
          value:
            name: openbao
            kind: ClusterSecretStore
      - equal:
          path: spec.data
          value:
            - secretKey: SECRET_PASS
              remoteRef:
                key: server1/sandbox/my-app
                property: password
      - isNull:
          path: spec.refreshPolicy
      - isNull:
          path: spec.dataFrom

  - it: should honour a custom secret store and refresh interval
    set:
      configRender.secretStore.name: other
      configRender.refreshInterval: 15m
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: c.json
      templates.config.path: /c
      templates.config.content: "{}"
      templates.config.secrets.SECRET_X.key: k
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: other
      - equal:
          path: spec.refreshInterval
          value: 15m
      - notExists:
          path: spec.data[0].remoteRef.property

  # ESO rejects an ExternalSecret with neither data nor dataFrom. Without secrets the
  # template is anchored on a UUID generator and renders only when it changes, so the
  # Secret — and through Reloader the pods — is not rewritten on every refresh.
  - it: should anchor a template without secrets on a UUID generator, rendered OnChange
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: apps
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: config.json
      templates.config.path: /usr/share/nginx/html/config.json
      templates.config.content: "{}"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ExternalSecret
        documentIndex: 0
      - equal:
          path: spec.refreshPolicy
          value: OnChange
        documentIndex: 0
      - equal:
          path: spec.dataFrom[0].sourceRef.generatorRef
          value:
            apiVersion: generators.external-secrets.io/v1alpha1
            kind: UUID
            name: apps-iot-my-app-tpl-config
        documentIndex: 0
      - isNull:
          path: spec.secretStoreRef
        documentIndex: 0
      - isNull:
          path: spec.data
        documentIndex: 0
      - isKind:
          of: UUID
        documentIndex: 1
      - equal:
          path: metadata.name
          value: apps-iot-my-app-tpl-config
        documentIndex: 1
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-2"
        documentIndex: 1

  - it: should embed vars whole and the app built-ins, then gather secrets and keep the content verbatim
    set:
      vars.protocol: https
      vars.domain: sandbox.example.com
      vars.mqtt.url: mqtt://broker:1883
      NOT_A_VAR: ignored
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: true
      ingress.serviceRef: http
      ingress.pathName: iot/my-path
      services.http.enabled: true
      services.http.targetPort: 4000
      templates.config.file: production.json
      templates.config.path: /home/app/config
      templates.config.content: '{"url": "{{ .vars.protocol }}://{{ .app.host }}/{{ .app.pathName }}"}'
    asserts:
      - equal:
          path: spec.target.template.engineVersion
          value: v2
        documentIndex: 0
      - equal:
          path: spec.target.template.data["production.json"]
          value: |-
            {{- $context := "{\"app\":{\"component\":\"api\",\"containerPort\":4000,\"group\":\"iot\",\"host\":\"api.sandbox.example.com\",\"name\":\"my-app\",\"namespace\":\"sandbox\",\"pathName\":\"iot/my-path\"},\"vars\":{\"domain\":\"sandbox.example.com\",\"mqtt\":{\"url\":\"mqtt://broker:1883\"},\"protocol\":\"https\"}}" | fromJson -}}
            {{- $secrets := dict }}{{ range $name, $value := . }}{{ $_ := set $secrets $name $value }}{{ end -}}
            {{- $_ := set $context "secrets" $secrets -}}
            {{- with $context -}}
            {"url": "{{ .vars.protocol }}://{{ .app.host }}/{{ .app.pathName }}"}
            {{- end }}
        documentIndex: 0

  # .app.host is the HTTPRoute hostname, so the override must reach it too.
  - it: should set app.host from ingress.hostname when it is set
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: apps
      labels.partOf: dashboards
      ingress.enabled: true
      ingress.serviceRef: http
      ingress.hostname: dashboard.example.com
      ingress.pathName: ""
      templates.config.file: c.json
      templates.config.path: /c
      templates.config.content: "{}"
    asserts:
      - matchRegex:
          path: spec.target.template.data["c.json"]
          pattern: '\\"host\\":\\"dashboard.example.com\\"'
        documentIndex: 0
      - matchRegex:
          path: spec.target.template.data["c.json"]
          pattern: '\\"pathName\\":\\"\\"'
        documentIndex: 0

  # No route, no host: a template reading .app.host then fails in ESO instead of
  # rendering a URL nothing serves.
  - it: should omit app.host when the app has no ingress
    set:
      vars.domain: example.com
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: c.json
      templates.config.path: /c
      templates.config.content: "{}"
    asserts:
      - notMatchRegex:
          path: spec.target.template.data["c.json"]
          pattern: '\\"host\\"'
        documentIndex: 0

  # A raw backtick string would end at the first backtick inside a value.
  - it: should embed a var containing backticks and quotes as an escaped Go string
    set:
      vars.odd: 'a`b"c'
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: c.json
      templates.config.path: /c
      templates.config.content: "{}"
    asserts:
      - matchRegex:
          path: spec.target.template.data["c.json"]
          pattern: '\\"odd\\":\\"a`b\\\\\\"c\\"'
        documentIndex: 0

  - it: should render one ExternalSecret per template
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: a.json
      templates.config.path: /a
      templates.config.content: "{}"
      templates.config.secrets.SECRET_X.key: k
      templates.other.file: b.json
      templates.other.path: /b
      templates.other.content: "{}"
      templates.other.secrets.SECRET_Y.key: k
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: api-iot-my-app-tpl-config
        documentIndex: 0
      - equal:
          path: metadata.name
          value: api-iot-my-app-tpl-other
        documentIndex: 1

  - it: should fail when secrets is not a map
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: c.json
      templates.config.path: /c
      templates.config.content: "{}"
      templates.config.secrets: [SECRET_X]
    asserts:
      - failedTemplate:
          errorMessage: "Template 'config' has an invalid secrets key. It must be a map of variable name to {key, property}. [templates]."

  - it: should fail when a secret has no key
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: c.json
      templates.config.path: /c
      templates.config.content: "{}"
      templates.config.secrets.SECRET_X.property: p
    asserts:
      - failedTemplate:
          errorMessage: "Template 'config' secret 'SECRET_X' must be a map with a key. [templates.config.secrets]."

  - it: should fail when a secret has an unknown key
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      templates.config.file: c.json
      templates.config.path: /c
      templates.config.content: "{}"
      templates.config.secrets.SECRET_X.key: k
      templates.config.secrets.SECRET_X.propery: p
    asserts:
      - failedTemplate:
          errorMessage: "Template 'config' secret 'SECRET_X' has an unknown key 'propery'. Allowed keys are: key, property. [templates.config.secrets]."
