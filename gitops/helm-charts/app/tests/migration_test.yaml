suite: migration tests
templates:
  - templates/migration.yaml
release:
  name: my-app
set:
  image.repository: ghcr.io/example/my-app
  image.tag: "1.2.3"
  labels.component: api
  labels.partOf: iot
  ingress.enabled: false
  migration.enabled: true
tests:
  - it: should render nothing when migration is not set
    set:
      migration: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should render nothing when migration.enabled is false
    set:
      migration.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should be a Sync hook at wave -1 that replaces its previous Job
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: api-iot-my-app-migration
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation

  - it: should keep the Job name within 63 characters
    release:
      name: an-application-name-long-enough-to-reach-the-limit
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,53}-migration$

  - it: should run once with a 600 second deadline
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600

  - it: should use activeDeadlineSeconds when set
    set:
      migration.activeDeadlineSeconds: 1800
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1800

  - it: should label the pod for the NetworkPolicies but not for the Services
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: my-app
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migration
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]

  - it: should carry the workload's log attributes
    set:
      podAnnotations:
        logs.grafana.com/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.name"]
          value: my-app
      - equal:
          path: spec.template.metadata.annotations["resource.opentelemetry.io/service.version"]
          value: "1.2.3"
      - equal:
          path: spec.template.metadata.annotations["logs.grafana.com/scrape"]
          value: "true"

  - it: should run migrate up through the command entry point by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--import", "/home/app/dist/otel/instrument.js", "dist/cli.js", "migrate", "up"]

  - it: should run migration.command through the command entry point
    set:
      migration.command: [migrate, verify]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--import", "/home/app/dist/otel/instrument.js", "dist/cli.js", "migrate", "verify"]

  - it: should use migration.args as the whole argv
    set:
      migration.command: [migrate, verify]
      migration.args: ["-e", "process.exit(0)"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-e", "process.exit(0)"]

  - it: should use the app's image, tag and pull policy
    set:
      image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/my-app:1.2.3
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should use the app's ServiceAccount and security contexts
    set:
      serviceAccount.create: true
      podSecurityContext.runAsUser: 65532
      containerSecurityContext.readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: api-iot-my-app
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should default to the app's resources
    set:
      resources.requests.memory: 400Mi
      resources.limits.memory: 800Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 400Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 800Mi

  - it: should prefer migration.resources over the app's
    set:
      resources.limits.memory: 800Mi
      migration.resources.limits.memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: should mount the rendered config like the workload
    set:
      templates:
        config:
          file: production.json
          path: /home/app/config
          content: "{}"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /home/app/config
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: api-iot-my-app-tpl-config

  - it: should render no volumes for an app without config templates
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.volumes

  - it: should give the Job the app's environment
    set:
      env:
        - name: NODE_OPTIONS
          value: --max-old-space-size=384
      secretRefs:
        - name: my-app-credentials
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: NODE_OPTIONS
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-app-credentials

  - it: should not mount the projected ServiceAccount token
    set:
      serviceAccount.projectedToken.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.volumes

  - it: should schedule like the workload
    set:
      nodeSelector:
        kubernetes.io/arch: amd64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64

  - it: should fail on an unknown key
    set:
      migration.activeDeadlineSecond: 60
    asserts:
      - failedTemplate:
          errorMessage: "Unknown key 'activeDeadlineSecond'. Allowed keys are: enabled, command, args, activeDeadlineSeconds, resources. [migration]."

  - it: should fail when command is not a list
    set:
      migration.command: migrate up
    asserts:
      - failedTemplate:
          errorMessage: "migration.command must be a list. [migration]."

  - it: should fail when args is not a list
    set:
      migration.args: migrate up
    asserts:
      - failedTemplate:
          errorMessage: "migration.args must be a list. [migration]."
