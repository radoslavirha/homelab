suite: serviceaccount tests
templates:
  - templates/serviceaccount.yaml
release:
  name: my-app
tests:
  - it: should create ServiceAccount when create is true
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: api-iot-my-app
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-10"

  - it: should use custom name when provided
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      serviceAccount.create: true
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should add annotations when provided
    values:
      - ./test-values/sa-annotations.yaml
    asserts:
      - equal:
          path: metadata.annotations.custom-annotation
          value: my-value
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-10"

  - it: should keep the chart's sync-wave when annotations try to override it
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      serviceAccount.create: true
      serviceAccount.annotations:
        argocd.argoproj.io/sync-wave: "5"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-10"

  - it: should NOT create ServiceAccount when create is false
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should NOT create ServiceAccount when not configured
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set automountServiceAccountToken to false when specified
    set:
      image.repository: ghcr.io/example/my-app
      labels.component: api
      labels.partOf: iot
      ingress.enabled: false
      serviceAccount.create: true
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
