{{- if .Values.emqx }}
{{- range $jobKey, $job := .Values.emqx.jobs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "emqx-provision-%s" $jobKey | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "provisioner.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: {{ $job.syncWave | default "0" | quote }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: provisioner
          image: {{ include "provisioner.image" $ }}
          env:
            - name: EMQX_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.emqx.credentialsSecret }}
                  key: {{ $.Values.emqx.credentialsUsernameKey | default "EMQX_DASHBOARD__DEFAULT_USERNAME" }}
            - name: EMQX_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.emqx.credentialsSecret }}
                  key: {{ $.Values.emqx.credentialsPasswordKey | default "EMQX_DASHBOARD__DEFAULT_PASSWORD" }}
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.baoTokenSecret }}
                  key: token
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              EMQX_HOST={{ $.Values.emqx.host | quote }}
              BAO_HOST={{ $.Values.global.baoHost | quote }}
              CLUSTER={{ $.Values.global.cluster | quote }}

              {{- include "provisioner.baoPrelude" $ | nindent 14 }}

              echo "Obtaining EMQX Bearer token..."
              EMQX_BEARER=$(curl -sf -X POST \
                -H "Content-Type: application/json" \
                "${EMQX_HOST}/api/v5/login" \
                -d "{\"username\": \"${EMQX_USER}\", \"password\": \"${EMQX_PASS}\"}" \
                | jq -r '.token')

              if [ -z "${EMQX_BEARER}" ] || [ "${EMQX_BEARER}" = "null" ]; then
                echo "ERROR: Failed to obtain EMQX Bearer token."
                exit 1
              fi

              AUTH_HEADER="Authorization: Bearer ${EMQX_BEARER}"

              # Ensure built-in database authenticator is configured (idempotent)
              AUTH_EXISTS=$(curl -sf \
                -H "${AUTH_HEADER}" \
                "${EMQX_HOST}/api/v5/authentication" \
                | jq '[.[] | select(.backend=="built_in_database")] | length')

              if [ "${AUTH_EXISTS:-0}" -eq 0 ]; then
                echo "Configuring built-in database authenticator..."
                curl -sf -X POST \
                  -H "${AUTH_HEADER}" \
                  -H "Content-Type: application/json" \
                  "${EMQX_HOST}/api/v5/authentication" \
                  -d '{
                    "mechanism": "password_based",
                    "backend": "built_in_database",
                    "password_hash_algorithm": {"name": "bcrypt", "salt_rounds": 10},
                    "user_id_type": "username"
                  }' > /dev/null
                echo "Authenticator configured."
              fi

              # --- Authorization ------------------------------------------------------
              # Same backend as authentication: one built-in database, one dashboard page,
              # rules keyed per username. The Job only ever writes usernames listed in
              # values, so rules maintained by hand for other accounts are left alone.
              AUTHZ_EXISTS=$(curl -sf \
                -H "${AUTH_HEADER}" \
                "${EMQX_HOST}/api/v5/authorization/sources" \
                | jq '[.sources[] | select(.type=="built_in_database")] | length')

              if [ "${AUTHZ_EXISTS:-0}" -eq 0 ]; then
                echo "Configuring built_in_database authorization source..."
                curl -sf -X POST \
                  -H "${AUTH_HEADER}" \
                  -H "Content-Type: application/json" \
                  "${EMQX_HOST}/api/v5/authorization/sources" \
                  -d '{"type": "built_in_database", "enable": true, "max_rules": 100}' > /dev/null
                echo "Authorization source configured."
              fi

              # Retire the stock `file` source. Its shipped acl.conf ends `{allow, all}.`,
              # which would allow everything ahead of the rules below and make
              # authorization.no_match = deny a no-op. Only runs while the source exists.
              FILE_SOURCE_EXISTS=$(curl -sf \
                -H "${AUTH_HEADER}" \
                "${EMQX_HOST}/api/v5/authorization/sources" \
                | jq '[.sources[] | select(.type=="file")] | length')

              if [ "${FILE_SOURCE_EXISTS:-0}" -gt 0 ]; then
                echo "Removing stock 'file' authorization source (it ends with {allow, all}.)..."
                curl -sf -X DELETE \
                  -H "${AUTH_HEADER}" \
                  "${EMQX_HOST}/api/v5/authorization/sources/file" > /dev/null
              fi

              {{- range $job.users }}

              # User: {{ .mqttUsername }}
              {{- if eq (.idempotencyStrategy | default "api-check") "bao-check" }}
              BAO_EXISTING=$(bao_read_field \
                "secret/${CLUSTER}/{{ .baoPath }}" \
                {{ .baoUsernameKey | default "username" | quote }})
              if [ -n "${BAO_EXISTING}" ]; then
                echo "MQTT credentials for '{{ .mqttUsername }}' already in OpenBao. Skipping."
              else
              {{- else }}
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "${AUTH_HEADER}" \
                "${EMQX_HOST}/api/v5/authentication/password_based:built_in_database/users/{{ .mqttUsername }}")
              if [ "${HTTP_CODE}" = "200" ]; then
                echo "MQTT user '{{ .mqttUsername }}' already exists. Skipping."
              else
              {{- end }}
                MQTT_PASS=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)

                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  -H "${AUTH_HEADER}" \
                  "${EMQX_HOST}/api/v5/authentication/password_based:built_in_database/users/{{ .mqttUsername }}")

                if [ "${HTTP_CODE}" = "200" ]; then
                  curl -sf -X PUT \
                    -H "${AUTH_HEADER}" \
                    -H "Content-Type: application/json" \
                    "${EMQX_HOST}/api/v5/authentication/password_based:built_in_database/users/{{ .mqttUsername }}" \
                    -d "{\"password\": \"${MQTT_PASS}\"}" > /dev/null
                else
                  curl -sf -X POST \
                    -H "${AUTH_HEADER}" \
                    -H "Content-Type: application/json" \
                    "${EMQX_HOST}/api/v5/authentication/password_based:built_in_database/users" \
                    -d "{\"user_id\": \"{{ .mqttUsername }}\", \"password\": \"${MQTT_PASS}\", \"is_superuser\": false}" > /dev/null
                fi

                bao_write \
                  "secret/${CLUSTER}/{{ .baoPath }}" \
                  {{ .baoUsernameKey | default "username" }}={{ .mqttUsername | quote }} \
                  {{ .baoPasswordKey | default "password" }}="${MQTT_PASS}"
                echo "MQTT user '{{ .mqttUsername }}' provisioned and written to OpenBao."
              fi
              {{- if .acl }}

              # ACL rules for {{ .mqttUsername }} — applied whether or not the account was
              # just created, so a rule change lands without touching the credential.
              # PUT replaces this username's whole rule list; other usernames are untouched.
              cat > /tmp/acl.json <<'ACL_RULES_EOF'
              {"username": "{{ .mqttUsername }}", "rules": {{ .acl | toJson }}}
              ACL_RULES_EOF

              curl -sf -X PUT \
                -H "${AUTH_HEADER}" \
                -H "Content-Type: application/json" \
                "${EMQX_HOST}/api/v5/authorization/sources/built_in_database/rules/users/{{ .mqttUsername }}" \
                -d @/tmp/acl.json > /dev/null

              # Read back. A silently-unapplied ACL is the failure mode this exists to avoid.
              # Compared on permission/action/topic only, sorted: the broker fills in qos
              # and retain defaults and does not promise rule order, either of which would
              # fail an exact diff for no reason.
              curl -sf \
                -H "${AUTH_HEADER}" \
                "${EMQX_HOST}/api/v5/authorization/sources/built_in_database/rules/users/{{ .mqttUsername }}" \
                | jq -S '[.rules[] | {permission, action, topic}] | sort' > /tmp/acl.readback.json
              jq -S '[.rules[] | {permission, action, topic}] | sort' /tmp/acl.json > /tmp/acl.sent.json

              if diff -q /tmp/acl.sent.json /tmp/acl.readback.json > /dev/null; then
                echo "ACL for '{{ .mqttUsername }}': {{ len .acl }} rule(s) applied and verified."
              else
                echo "ERROR: broker ACL for '{{ .mqttUsername }}' differs from what was sent."
                diff /tmp/acl.sent.json /tmp/acl.readback.json || true
                exit 1
              fi
              {{- end }}
              {{- end }}
{{- end }}
{{- end }}
