# Longhorn — shared base values (all Talos clusters)
# Cluster-specific overrides live in iac/clusters/<name>/helm-values/longhorn.yaml
defaultSettings:
  defaultReplicaCount: 1
  defaultDataLocality: best-effort
  backupTarget: ""

# defaultSettings above is NOT what the `longhorn` StorageClass uses. The chart renders
# the StorageClass from a ConfigMap (longhorn-storageclass) built out of persistence.*,
# and a parameter set there wins over the global default setting. Without these two the
# StorageClass ships numberOfReplicas: "3" and dataLocality: "disabled" — so on these
# single-node clusters every volume asks for three replicas, exactly one is schedulable,
# and all of them sit at robustness: degraded permanently. That is not a cosmetic status:
# it destroys the signal, because a genuinely degraded volume looks identical to the
# eleven that are fine. Found 2026-08-14 via the Platform dashboard's Healthy volumes
# panel reading 0 on all three clusters.
persistence:
  defaultClassReplicaCount: 1
  defaultDataLocality: best-effort

longhornManager:
  tolerations: []
  # Manager metrics live on the longhorn-backend Service, port 9500 (port name "manager").
  # These annotations opt it into k8s-monitoring's annotation autodiscovery
  # (gitops/helm-values/k8s-monitoring.yaml). The chart's metrics.serviceMonitor path is
  # not used — there are no Prometheus Operator CRDs in any of these clusters.
  #
  # Longhorn holds every byte of Prometheus, Loki, Tempo, MongoDB and InfluxDB data and
  # there was no signal at all for volume health, degraded replicas or rebuild activity.
  serviceAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9500"

longhornDriver:
  tolerations: []

longhornUI:
  tolerations: []
