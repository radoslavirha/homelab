name: Helm chart CI

on:
  push:
    paths:
      - "gitops/helm-charts/**"
    branches:
      - main
  pull_request:
    paths:
      - "gitops/helm-charts/**"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - iot-applications
          - provisioner
          # authentik-blueprints was missing from this matrix and had never been linted.
          # It has no tests; the unittest step below skips charts without a tests/ directory.
          - authentik-blueprints
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "4.2.4"

      - name: Install helm-unittest plugin
        # --verify=false is required on Helm 4: it verifies plugin sources by default and
        # this one publishes no signature, so the install fails without it.
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version v1.1.2 --verify=false

      - name: Lint ${{ matrix.chart }}
        run: helm lint gitops/helm-charts/${{ matrix.chart }}

      - name: Unit test ${{ matrix.chart }}
        run: |
          if [ -d "gitops/helm-charts/${{ matrix.chart }}/tests" ]; then
            helm unittest gitops/helm-charts/${{ matrix.chart }}
          else
            echo "No tests directory found, skipping unittest"
          fi
